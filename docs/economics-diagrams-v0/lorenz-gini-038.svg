<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 600 420" width="600" height="420"><title id="t">Lorenz curve and Gini coefficient of 0.38</title><desc id="d">Five equal population groups receive income shares 5, 10, 15, 25 and 45 percent. Area below Lorenz is 0.31 and Gini is 1 minus twice this, or 0.38.</desc><rect x="0" y="0" width="600" height="420" fill="#ffffff"/><style>text{font-family:Inter,Arial,sans-serif;fill:#263447;font-size:14px} .axis{stroke:#516073;stroke-width:2.3} .guide{stroke:#98a6b5;stroke-width:1.5;stroke-dasharray:6 6} .strong{font-weight:700} .small{font-size:12px;fill:#5c6a79} .large{font-weight:700;font-size:17px}</style><text x="31" y="29" class="large">Lorenz curve: worked Gini example</text>
