<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#2F6FD6" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <title>iClub AI Demo</title>
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="stylesheet" href="style.css?v=support1" />
  <link rel="stylesheet" href="diagnostic-demo-main-local.css?v=main-copy-1" />
</head>
<body>
  <div id="app" class="app">
    <header id="topbar" class="topbar" aria-label="Top bar">
      <button id="topbar-back" class="icon-btn" type="button" aria-label="Назад">
        <span class="icon">←</span>
      </button>

      <div class="topbar-brand">
        <img id="topbar-logo" class="topbar-logo" src="logo.png" alt="iClub" />
        <div class="topbar-title">
          <div id="topbar-title" class="title">iClub</div>
          <div id="topbar-subtitle" class="subtitle">Smarter together</div>
        </div>
      </div>

      <div class="topbar-right">
        <button id="topbar-notifications" class="icon-btn" type="button" aria-label="Уведомления" style="visibility:hidden">
          <span class="icon">🔔</span>
        </button>
        <button id="topbar-action" class="icon-btn" type="button" aria-label="Сценарий">
          <span class="icon">⋯</span>
        </button>
      </div>
    </header>

    <section class="demo-planbar" aria-label="Режим показа">
      <span class="demo-planbar-label" id="demo-planbar-label">РЕЖИМ ПОКАЗА</span>
      <div class="demo-plan-switch" role="group" aria-label="Тариф">
        <button class="demo-plan-btn is-active" type="button" data-plan="free">Free</button>
        <button class="demo-plan-btn" type="button" data-plan="plus">Plus</button>
        <button class="demo-plan-btn" type="button" data-plan="pro">Pro</button>
      </div>
    </section>

    <main id="main" class="main" role="main">
      <div class="content">
        <div id="courses-stack">
          <section id="courses-subject-hub" class="stack-screen is-active" data-stack="courses" data-screen="subject-hub">
            <div class="subject-hub-head">
              <div class="subject-hub-head-left">
                <div id="subject-hub-title" class="subject-hub-title">Экономика</div>
                <div id="subject-hub-meta" class="subject-hub-meta muted">Соревновательный</div>
              </div>
            </div>

            <div class="subject-hub-panels">
              <button id="subject-hub-mentor-btn" class="panel-card subject-hub-panel subject-hub-mentor-btn" type="button">
                <div class="panel-row">
                  <div id="subject-hub-mentor-avatar" class="mentor-avatar has-photo" aria-hidden="true"></div>
                  <div class="panel-col">
                    <div class="panel-kicker" id="mentor-kicker">ВАШ МЕНТОР</div>
                    <div id="subject-hub-mentor-title" class="panel-title">Erkinov Azizbek</div>
                    <div id="subject-hub-mentor-sub" class="muted small">AS Level Economics</div>
                  </div>
                </div>
              </button>
            </div>

            <div class="subject-hub-tabs" role="tablist" aria-label="Subject hub tabs">
              <button class="hub-tab is-active" type="button" data-hub-tab="content">Контент</button>
              <button class="hub-tab" type="button" data-hub-tab="practice">Практика</button>
              <button class="hub-tab" type="button" data-hub-tab="tours">Туры</button>
              <button class="hub-tab" type="button" data-hub-tab="resources">Ресурсы</button>
            </div>

            <div class="subject-hub-list subject-hub-actions">
              <button class="settings-nav" type="button" data-local-action="video">
                <span class="settings-nav-ico">🎬</span>
                <span class="settings-nav-text">
                  <span class="settings-nav-title" id="hub-video-title">Видео-уроки</span>
                  <span class="settings-nav-sub muted small" id="hub-video-sub">Видео-уроки доступны в Telegram</span>
                </span>
                <span class="settings-nav-arrow">›</span>
              </button>

              <button class="settings-nav" type="button" data-local-action="recommendations">
                <span class="settings-nav-ico">📚</span>
                <span class="settings-nav-text">
                  <span class="settings-nav-title" id="hub-recs-title">Мои рекомендации</span>
                  <span class="settings-nav-sub muted small" id="hub-recs-sub">Повторный доступ к чтению</span>
                </span>
                <span class="settings-nav-arrow">›</span>
              </button>
            </div>

            <div class="section" style="margin-top:14px">
              <div class="h2" id="hub-system-title">Системные</div>
            </div>

            <div class="subject-hub-list">
              <button class="settings-nav" type="button" data-local-action="certificates">
                <span class="settings-nav-ico">🎓</span>
                <span class="settings-nav-text">
                  <span class="settings-nav-title" id="hub-cert-title">Сертификаты</span>
                  <span class="settings-nav-sub muted small" id="hub-cert-sub">Туры и финальные результаты</span>
                </span>
                <span class="settings-nav-arrow">›</span>
              </button>

              <button class="settings-nav" type="button" data-local-action="archive">
                <span class="settings-nav-ico">🗂️</span>
                <span class="settings-nav-text">
                  <span class="settings-nav-title" id="hub-archive-title">Архив туров</span>
                  <span class="settings-nav-sub muted small" id="hub-archive-sub">Самопроверка • вне рейтинга</span>
                </span>
                <span class="settings-nav-arrow">›</span>
              </button>
            </div>

            <div class="subject-hub-list subject-hub-bottom">
              <button class="settings-nav" type="button" data-local-action="all-subjects">
                <span class="settings-nav-ico">🧭</span>
                <span class="settings-nav-text">
                  <span class="settings-nav-title" id="hub-all-title">Все предметы</span>
                  <span class="settings-nav-sub muted small" id="hub-all-sub">Каталог предметов</span>
                </span>
                <span class="settings-nav-arrow">›</span>
              </button>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <div id="modal-root" class="modal-root" aria-hidden="true">
    <div class="modal-backdrop" data-close-demo-menu>
      <div class="modal demo-menu-modal" role="dialog" aria-modal="true" aria-labelledby="demo-menu-title">
        <div class="modal-title" id="demo-menu-title">Сценарий</div>
        <div class="demo-menu-section">
          <div class="demo-menu-label" id="demo-language-label">Язык интерфейса</div>
          <div class="demo-language-row" role="group" aria-label="Язык интерфейса">
            <button type="button" class="demo-language-btn" data-lang="en">EN</button>
            <button type="button" class="demo-language-btn is-active" data-lang="ru">RU</button>
            <button type="button" class="demo-language-btn" data-lang="uz">UZ</button>
          </div>
        </div>
        <div class="demo-menu-actions">
          <button type="button" class="btn" data-demo-menu-action="learning" id="demo-normal-learning">Обычное обучение</button>
          <button type="button" class="btn" data-demo-menu-action="technical" id="demo-technical">Техническая панель</button>
          <button type="button" class="btn danger" data-demo-menu-action="reset" id="demo-reset">Сбросить demo</button>
        </div>
        <div class="modal-actions modal-actions-single">
          <button type="button" class="btn primary" data-close-demo-menu id="demo-close">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <script src="diagnostic-demo-main-local.js?v=main-copy-1"></script>
</body>
</html>
