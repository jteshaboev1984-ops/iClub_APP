<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>iClub UI Reset</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f3f6fb; color: #071124; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    .card { width: min(420px, 100%); border: 1px solid #dbe3ef; border-radius: 18px; background: #fff; padding: 18px; box-shadow: 0 18px 50px rgba(15, 23, 42, .10); }
    h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.15; }
    p { margin: 0; color: #475569; font-size: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Обновляем экран iClub…</h1>
      <p>Очищается только локальное состояние интерфейса. Данные аккаунта и результаты в базе не удаляются.</p>
    </div>
  </div>
  <script>
    try { localStorage.removeItem('iclub_state_v1'); } catch (e) {}
    setTimeout(function () { window.location.replace('/'); }, 700);
  </script>
</body>
</html>
