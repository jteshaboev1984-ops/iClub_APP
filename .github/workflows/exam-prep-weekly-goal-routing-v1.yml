name: Exam Prep weekly-goal routing safety (foundation only)
on:
  pull_request:
    paths:
      - 'exam-prep/exam-prep-weekly-goal-routing-v1.js'
      - 'exam-prep/exam-prep-session-recovery-policy-v1.js'
      - 'scripts/weekly-goal-routing-regression.cjs'
      - 'scripts/session-recovery-policy-regression.cjs'
      - 'docs/patch-proposals/20260918_exam_prep_resume_lookup_v1.sql'
      - 'docs/patch-proposals/20260918_exam_prep_goal_eligibility_v1.sql'
      - '.github/workflows/exam-prep-weekly-goal-routing-v1.yml'
  push:
    branches:
      - 'fix/exam-prep-weekly-goal-flow-safe'
    paths:
      - 'exam-prep/exam-prep-weekly-goal-routing-v1.js'
      - 'exam-prep/exam-prep-session-recovery-policy-v1.js'
      - 'scripts/weekly-goal-routing-regression.cjs'
      - 'scripts/session-recovery-policy-regression.cjs'
      - 'docs/patch-proposals/20260918_exam_prep_resume_lookup_v1.sql'
      - 'docs/patch-proposals/20260918_exam_prep_goal_eligibility_v1.sql'
      - '.github/workflows/exam-prep-weekly-goal-routing-v1.yml'
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated JavaScript syntax
        run: |
          node --check exam-prep/exam-prep-weekly-goal-routing-v1.js
          node --check exam-prep/exam-prep-session-recovery-policy-v1.js
          node --check scripts/weekly-goal-routing-regression.cjs
          node --check scripts/session-recovery-policy-regression.cjs
      - name: Verify strict routing and same-session recovery policies
        run: |
          node scripts/weekly-goal-routing-regression.cjs
          node scripts/session-recovery-policy-regression.cjs
      - name: Ensure both SQL proposals are read-only and cannot auto-apply
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cases={
            '20260918_exam_prep_resume_lookup_v1.sql': 'get_exam_prep_active_plan_session_safe_v1',
            '20260918_exam_prep_goal_eligibility_v1.sql': 'get_exam_prep_goal_action_state_safe_v1',
          }
          for filename,fn in cases.items():
              p=Path('docs/patch-proposals') / filename
              text=p.read_text()
              assert text.startswith('-- REVIEW PROPOSAL ONLY.'), filename
              assert f'create or replace function public.{fn}(' in text, filename
              assert 'stable\nsecurity definer\nset search_path = ' in text, filename
              assert 'private.exam_prep_require_core_access_v1()' in text, filename
              assert 's.user_id = v_uid' in text and 's.component_code = p_component_code' in text, filename
              assert 'from public;' in text and 'to authenticated;' in text, filename
              assert not any(Path('supabase/migrations').glob('*' + fn + '*.sql')), filename
              sql=re.sub(r'(?m)^--.*$', '', text)
              assert not re.search(r'\b(insert\s+into|update\s+private\.|delete\s+from|truncate\s+|drop\s+table)\b',sql,re.I), filename
              print('PASS: staged read-only access contract:',fn)
          assert not Path('scripts/weekly_goal_flow_source.tar.xz.b64').exists()
          print('PASS: opaque corrupt archive absent; no SQL applied; static checks are NOT database tests')
          PY
