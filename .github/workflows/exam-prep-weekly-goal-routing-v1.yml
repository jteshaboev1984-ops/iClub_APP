name: Exam Prep weekly-goal routing safety
on:
  pull_request:
    paths:
      - 'exam-prep/exam-prep-weekly-goal-routing-v1.js'
      - 'scripts/weekly-goal-routing-regression.cjs'
      - '.github/workflows/exam-prep-weekly-goal-routing-v1.yml'
      - 'scripts/weekly_goal_flow_source.tar.xz.b64'
  push:
    branches:
      - 'fix/exam-prep-weekly-goal-flow-safe'
    paths:
      - 'exam-prep/exam-prep-weekly-goal-routing-v1.js'
      - 'scripts/weekly-goal-routing-regression.cjs'
      - '.github/workflows/exam-prep-weekly-goal-routing-v1.yml'
      - 'scripts/weekly_goal_flow_source.tar.xz.b64'
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse routing module and test
        run: |
          node --check exam-prep/exam-prep-weekly-goal-routing-v1.js
          node --check scripts/weekly-goal-routing-regression.cjs
      - name: Verify fail-closed route and exact goal-action binding
        run: node scripts/weekly-goal-routing-regression.cjs
  review-isolated-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose archive and verify checksum before safe extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile
          source = Path('scripts/weekly_goal_flow_source.tar.xz.b64').read_text()
          encoded = ''.join(source.split())
          bad = [(i, repr(c)) for i,c in enumerate(encoded) if c not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=']
          print(f'Archive input: {len(source)} chars; normalized: {len(encoded)}; invalid chars: {len(bad)}; mod4: {len(encoded)%4}')
          if bad:
              print('First invalid positions:', bad[:5])
              raise SystemExit('Archive is not valid base64: regenerate from verified original; never guess bytes')
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except Exception as error:
              raise SystemExit(f'Invalid base64 padding/length: {error}')
          digest = hashlib.sha256(decoded).hexdigest()
          expected = '27bdbb54be8041379089276cf5529e4e0418950c10c5c38bbfad7a4b806043a5'
          print('Archive checksum matches:', digest == expected)
          if digest != expected:
              raise SystemExit('Archive checksum mismatch: do not apply unknown source')
          Path('/tmp/weekly-flow-source.tar.xz').write_bytes(decoded)
          with tarfile.open('/tmp/weekly-flow-source.tar.xz', 'r:xz') as archive:
              for member in archive.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or not (member.isfile() or member.isdir()):
                      raise SystemExit('Unsafe archived path/type: ' + member.name)
              archive.extractall('.', filter='data')
          PY
      - name: Build complete proposed fix in disposable CI checkout only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_weekly_flow_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/20260918190000_exam_prep_weekly_goal_flow_safe_v1.sql')
          s=p.read_text()
          old='  return public.authorize_exam_prep_plan_item_safe_v1(p_plan_id,p_priority_order);'
          assert s.count(old)==1
          s=s.replace(old,"  return public.authorize_exam_prep_plan_item_safe_v1(p_plan_id,p_priority_order) || jsonb_build_object('component_code',p_component_code);")
          p.write_text(s)
          PY
          node --check exam-prep/exam-prep-live.js
          node --check exam-prep/exam-prep-progress-ux-api.js
          node --check exam-prep/exam-prep-progress-ux-ui.js
          node --check exam-prep/exam-prep-progress-ux-boot.js
          node --check exam-prep/exam-prep-learner-flow-ux.js
          node scripts/weekly-goal-routing-regression.cjs
          git diff --check
          git diff --stat
          git status --short
          git diff > /tmp/weekly-goal-proposal.diff
      - name: Save proposed files for explicit review; never push or deploy
        uses: actions/upload-artifact@v4
        with:
          name: weekly-goal-review-only
          retention-days: 3
          if-no-files-found: error
          path: |
            /tmp/weekly-goal-proposal.diff
            exam-prep/exam-prep-live.js
            exam-prep/exam-prep-progress-ux-api.js
            exam-prep/exam-prep-progress-ux-ui.js
            exam-prep/exam-prep-progress-ux-boot.js
            exam-prep/exam-prep-learner-flow-ux.js
            exam-prep/exam-prep-progress-ux.css
            supabase/migrations/20260918190000_exam_prep_weekly_goal_flow_safe_v1.sql
