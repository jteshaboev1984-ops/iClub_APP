name: Exam Prep weekly-goal routing safety (foundation only)
on:
  pull_request:
    paths:
      - 'exam-prep/exam-prep-weekly-goal-routing-v1.js'
      - 'exam-prep/exam-prep-session-recovery-policy-v1.js'
      - 'scripts/weekly-goal-routing-regression.cjs'
      - 'scripts/session-recovery-policy-regression.cjs'
      - 'docs/patch-proposals/20260918_exam_prep_resume_lookup_v1.sql'
      - '.github/workflows/exam-prep-weekly-goal-routing-v1.yml'
  push:
    branches:
      - 'fix/exam-prep-weekly-goal-flow-safe'
    paths:
      - 'exam-prep/exam-prep-weekly-goal-routing-v1.js'
      - 'exam-prep/exam-prep-session-recovery-policy-v1.js'
      - 'scripts/weekly-goal-routing-regression.cjs'
      - 'scripts/session-recovery-policy-regression.cjs'
      - 'docs/patch-proposals/20260918_exam_prep_resume_lookup_v1.sql'
      - '.github/workflows/exam-prep-weekly-goal-routing-v1.yml'
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated JavaScript syntax
        run: |
          node --check exam-prep/exam-prep-weekly-goal-routing-v1.js
          node --check exam-prep/exam-prep-session-recovery-policy-v1.js
          node --check scripts/weekly-goal-routing-regression.cjs
          node --check scripts/session-recovery-policy-regression.cjs
      - name: Verify strict routing and same-session recovery policies
        run: |
          node scripts/weekly-goal-routing-regression.cjs
          node scripts/session-recovery-policy-regression.cjs
      - name: Ensure proposal remains separate from production migrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('docs/patch-proposals/20260918_exam_prep_resume_lookup_v1.sql')
          text=p.read_text()
          assert text.startswith('-- REVIEW PROPOSAL ONLY.')
          assert 'create or replace function public.get_exam_prep_active_plan_session_safe_v1(' in text
          assert 'stable\nsecurity definer\nset search_path = ' in text
          assert 'private.exam_prep_require_core_access_v1()' in text
          assert 's.user_id = v_uid' in text and 's.component_code = p_component_code' in text
          assert "s.status = 'active'" in text
          assert 'resume_independent_of_current_plan' in text
          assert 'from public;' in text and 'to authenticated;' in text
          assert not Path('supabase/migrations/20260918194500_exam_prep_resume_lookup_v1.sql').exists()
          sql=re.sub(r'(?m)^--.*$', '', text)
          assert not re.search(r'\b(insert\s+into|update\s+private\.|delete\s+from|truncate\s+|drop\s+table)\b',sql,re.I)
          print('PASS: proposal is read-only, scoped and not a production migration (not a PostgreSQL execution test)')
          PY
