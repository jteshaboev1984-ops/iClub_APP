name: Biology source audit

on:
  push:
    branches: [biology-academic-audit]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: biology-academic-audit
          fetch-depth: 0
      - name: Download and extract Biology source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl -L --fail --retry 3 \
            'https://mmmduffgpvwjdpruzikw.supabase.co/storage/v1/object/public/books/Biology%20A%20Level%20course%20Book%205th%20edition%20%282%29%20%282%29.pdf' \
            -o /tmp/biology.pdf
          pdfinfo /tmp/biology.pdf > /tmp/pdfinfo.txt
          pdftotext -layout /tmp/biology.pdf /tmp/biology.txt
          python - <<'PY'
          from pathlib import Path
          import re

          raw = Path('/tmp/biology.txt').read_text(encoding='utf-8', errors='replace')
          pages = raw.split('\f')
          out = []
          out.append('BIOLOGY A LEVEL COURSE BOOK 5TH EDITION — SOURCE AUDIT INDEX')
          out.append('')
          out.append(Path('/tmp/pdfinfo.txt').read_text(encoding='utf-8', errors='replace'))
          out.append('=== FRONT MATTER / CONTENTS (PDF pages 1-30) ===')
          for i, page in enumerate(pages[:30], start=1):
              compact = re.sub(r'[ \t]+', ' ', page).strip()
              out.append(f'\n--- PDF PAGE {i} ---\n{compact[:4500]}')

          terms = [
              'glycogen', 'non-reducing ends', 'companion cells', 'sieve tube elements',
              'glycolysis', 'oxygen is not required', 'ATP binds', 'myosin head',
              'telomerase', 'spindle checkpoint', 'aquaporin', 'succinate dehydrogenase',
              'antivenom', 'negative control', 'Casparian strip', 'cholera toxin'
          ]
          out.append('\n=== CONCEPT SEARCH CONTEXTS ===')
          for term in terms:
              hits = []
              tl = term.lower()
              for pno, page in enumerate(pages, start=1):
                  idx = page.lower().find(tl)
                  if idx >= 0:
                      context = re.sub(r'\s+', ' ', page[max(0, idx-700):idx+1800]).strip()
                      hits.append((pno, context))
                      if len(hits) == 3:
                          break
              out.append(f'\n## {term} — {len(hits)} shown')
              for pno, context in hits:
                  out.append(f'PDF page {pno}: {context}')

          Path('docs/biology-source-audit.txt').parent.mkdir(parents=True, exist_ok=True)
          Path('docs/biology-source-audit.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
      - name: Commit report and remove workflow
        run: |
          rm -f .github/workflows/biology-source-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Biology textbook source audit index'
          git push origin HEAD:biology-academic-audit
