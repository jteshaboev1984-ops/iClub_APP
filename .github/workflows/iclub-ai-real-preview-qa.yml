name: iClub AI v2.1 — real-app protected Preview QA

on:
  push:
    branches:
      - qa/iclub-ai-layer-v21-20261012
    paths:
      - '.github/workflows/iclub-ai-real-preview-qa.yml'
      - 'qa/ai-v21-real-preview-*'
      - 'qa/ai-v21-preview-typed-app-help*'
      - 'qa/ai-v21-funded-provider-transport*'
      - 'qa/ai-v21-funded-canary-approved-money-policy*'
      - 'qa/ai-v21-real-academic-screen-bridge*'
      - 'qa/ai-v21-resolver-transport.test.cjs'
      - 'qa/ai-v21-practice-resolver-http-pg.cjs'
      - 'qa/ai-v21-local-signed-auth*'
      - 'qa/ai-v21-live-release-*'
      - 'qa/ai-v21-practice-source-contract.test.cjs'
      - 'qa/ai-v21-practice-source-governed-error-e2e.test.cjs'
      - 'qa/ai-v21-practice-editorial-*'
      - 'qa/ai-layer-v21-ui-transport.cjs'
      - 'qa/edge_v21/context_core.ts'
      - 'qa/edge_v21/supabase_services.ts'
      - 'qa/edge_v21/supabase_services_test.ts'
      - 'qa/edge_v21/index.ts'
      - 'qa/edge_v21/practice_resolver_*'
      - 'qa/sql_drafts/iclub_ai_v21_practice_attempt_resolution_*'
      - 'qa/sql_drafts/iclub_ai_v21_provider_spend_*'
      - 'qa/sql_drafts/iclub_ai_paid_canary_v1*'
      - 'qa/funded_canary_edge/**'
      - 'qa/ai-layer-v21-provider-spend-sql.test.cjs'
      - 'global-ai-ui.js'
      - 'global-ai-ui.css'
      - 'app.js'
      - 'index.html'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iclub-ai-real-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-preview-acceptance:
    if: github.ref == 'refs/heads/qa/iclub-ai-layer-v21-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout existing QA branch, do not keep Git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bundle and simulated routes; refuse any prod access
        run: |
          set -euo pipefail
          node --check qa/ai-v21-real-preview-build.cjs
          node --check qa/ai-v21-real-preview-browser.cjs
          node --check qa/ai-v21-real-preview-ui-snapshot.js
          node --check qa/ai-v21-real-preview-fixture.js
          node --check qa/ai-v21-preview-typed-app-help.js
          node --test qa/ai-v21-preview-typed-app-help.test.cjs
          node --test qa/ai-v21-real-preview-regression.test.cjs
          node --check qa/ai-v21-real-academic-screen-bridge.cjs
          node --test qa/ai-v21-real-academic-screen-bridge.test.cjs
          node --test qa/ai-v21-resolver-transport.test.cjs
          node --test qa/ai-v21-practice-source-contract.test.cjs
          node --test qa/ai-v21-practice-source-governed-error-e2e.test.cjs
          node --test qa/ai-v21-practice-editorial-intake.test.cjs
          node --test qa/ai-v21-local-signed-auth.test.cjs
          node --test qa/ai-layer-v21-provider-spend-sql.test.cjs
          node --check qa/ai-v21-funded-provider-transport.cjs
          node --test qa/ai-v21-funded-provider-transport.test.cjs
          node --test qa/ai-v21-funded-canary-approved-money-policy.test.cjs
          node --test qa/ai-v21-live-release-safety-gate.test.cjs
          node --test qa/ai-layer-v21-p9-live-integration-preflight.test.cjs
      - name: Install Deno for isolated Edge contract checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check existing /context and new Practice resolver HTTP contract
        run: |
          set -euo pipefail
          deno test --no-check             qa/edge_v21/context_core_test.ts             qa/edge_v21/practice_resolver_http_test.ts             qa/edge_v21/supabase_services_test.ts
          deno check qa/funded_canary_edge/index.ts
          deno eval 'import {upperCost,MAX_OUTPUT_TOKENS} from "./qa/funded_canary_edge/policy.ts"; if (upperCost(4096,MAX_OUTPUT_TOKENS)===null || upperCost(1000000,1)!==null) throw Error("paid canary token envelope unsafe");'
      - name: Browser test on loopback network only
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium
          cd qa/ai-v21-real-preview-dist
          python3 -m http.server 4175 --bind 127.0.0.1 > /tmp/iclub-ai-real-preview-http.log 2>&1 &
          server=$!
          cd ../..
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/index.html >/dev/null; then break; fi
            sleep 1
          done
          node qa/ai-v21-real-preview-browser.cjs
      - name: Confirm source app, Exam Prep and production SQL remain untouched
        run: |
          set -euo pipefail
          git diff --exit-code c565f9a8d70ceeb791137bec36e5bf1f2e21de4c HEAD -- global-ai-ui.js global-ai-ui.css
          test -z "$(git diff --name-only 9afc7b44aead03b2a30544e6e7d4c4eb8670efbf HEAD -- app.js index.html exam-prep/ supabase/migrations/)"
          echo 'QA real-app preview: verified no protected source changes'

  isolated-practice-mapping-postgres:
    if: github.ref == 'refs/heads/qa/iclub-ai-layer-v21-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGUSER: postgres
      PGPASSWORD: qa-disposable-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
    steps:
      - name: Checkout QA-only SQL (no Git credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create brand-new disposable database and validate only V4 mapping
        shell: bash
        run: |
          set -euo pipefail
          db=iclub_ai_v21_scratch_resolver
          createdb -w "$db"
          trap 'dropdb -w --if-exists "$db"' EXIT
          psql -X -w -v ON_ERROR_STOP=1 -d "$db" -f             qa/sql_drafts/iclub_ai_v21_practice_attempt_resolution_local_pg.psql
          echo 'QA V4 identity mapping isolated PostgreSQL GREEN'
          money_db=iclub_ai_v21_scratch_finance
          createdb -w "$money_db"
          trap 'dropdb -w --if-exists "$money_db"; dropdb -w --if-exists "$db"' EXIT
          PGAPPNAME=iclub_ai_v21_local_scratch psql -X -w -v ON_ERROR_STOP=1 -d "$money_db" -f qa/sql_drafts/iclub_ai_v21_provider_spend_local_pg.psql
          echo 'QA finance: zero-default, lifetime+UTC daily+user daily, unknown liabilities GREEN'
          pilot_db=iclub_ai_v21_scratch_operator_pilot
          createdb -w "$pilot_db"
          trap 'dropdb -w --if-exists "$pilot_db"; dropdb -w --if-exists "$money_db"; dropdb -w --if-exists "$db"' EXIT
          psql -X -w -v ON_ERROR_STOP=1 -d "$pilot_db" -f qa/sql_drafts/iclub_ai_paid_canary_v1_local_pg.psql
          echo 'QA standalone operator-only funded canary: lifetime and concurrency limits GREEN'

  real-http-postgres-resolver:
    if: github.ref == 'refs/heads/qa/iclub-ai-layer-v21-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      ICLUB_QA_ALLOW_RESOLVER: synthetic-only
      PGUSER: postgres
      PGPASSWORD: qa-disposable-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
    steps:
      - name: Checkout existing QA files with no persisted Git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run end-to-end localhost HTTP Auth and PostgreSQL resolver
        run: |
          set -euo pipefail
          node --check qa/ai-v21-practice-resolver-http-pg.cjs
          node qa/ai-v21-practice-resolver-http-pg.cjs
