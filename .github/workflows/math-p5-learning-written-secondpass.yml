      - "scripts/fixtures/math-p5-learning-written-72-secondpass.sql"
      - "scripts/math-p5-learning-written-72-secondpass.cjs"
      - ".github/workflows/math-p5-learning-written-secondpass.yml"
  workflow_dispatch:
jobs:
  independent-learning-rubrics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
