name: TEMP Subject Hub Control Group v3.3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-subject-hub-control-group.yml'
      - '.github/scripts/tmp_subject_hub_control_group_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  subject-hub-control-group:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply control-group refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tmp_subject_hub_control_group_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/visual_v3_subject_hub_architecture_regression.js')
          s = p.read_text(encoding='utf-8')
          old = "  assert(state.activeTabBackground === 'rgb(255, 255, 255)', `Primary action must not look pre-selected: ${state.activeTabBackground}`);"
          new = "  assert(state.activeTabBackground === 'rgba(0, 0, 0, 0)', `Primary action must not look pre-selected: ${state.activeTabBackground}`);"
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('Expected active background assertion not found')
          obsolete = "  assert(state.firstTabAfterBottom === 'auto', `Legacy active underline positioning leaked into launcher: bottom=${state.firstTabAfterBottom}`);\n"
          s = s.replace(obsolete, '')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Static safety checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'PREMIUM SUBJECT HUB CONTROL GROUP v3.3' visual/iclub-premium-v3.css
          node --check .github/scripts/visual_v3_subject_hub_architecture_regression.js
          ! grep -Eiq 'localStorage|sessionStorage|supabase|\.rpc\s*\(|\.from\s*\(|data-tab\s*=|data-action\s*=|operational_stage\s*=|innerHTML\s*=' visual/iclub-premium-v3.css

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run visual and host regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/subject-hub-v33-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.2
          done
          node .github/scripts/visual_v3_premium_regression.js
          node .github/scripts/visual_v3_premium_extended_regression.js
          node .github/scripts/visual_v3_assessment_regression.js
          node .github/scripts/visual_v3_math_exam_prep_ux_regression.js
          node .github/scripts/visual_v3_subject_hub_architecture_regression.js
          node .github/scripts/p0_14_host_regression.js
          node .github/scripts/p0_22_live_view_coexistence_regression.js

      - name: Commit tested refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual/iclub-premium-v3.css .github/scripts/visual_v3_subject_hub_architecture_regression.js
          if git diff --cached --quiet; then
            echo 'No control-group change to commit.'
            exit 0
          fi
          git commit -m 'fix(ui): refine Subject Hub launchers into grouped controls'
          git push origin HEAD:main
