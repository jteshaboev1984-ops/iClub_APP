name: TEMP Premium v3 Extended Screens

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-premium-v3-extended.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  premium-extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add premium presentation for registration ratings and global screens
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('visual/iclub-premium-v3.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* ===== PREMIUM EXTENDED SCREENS v3 ===== */'
          if marker in css:
              raise SystemExit('extended premium layer already present')
          css += r'''

/* ===== PREMIUM EXTENDED SCREENS v3 ===== */

/* Registration */
.iclub-visual-v3 #view-registration .content.reg {
  width: 100%;
  max-width: 560px;
  margin-inline: auto;
  padding-top: 24px;
  padding-bottom: 42px;
}

.iclub-visual-v3 #view-registration .h1 {
  margin-bottom: 7px;
  color: var(--v3-text);
  font-size: 26px;
  line-height: 1.12;
  font-weight: 810;
  letter-spacing: -0.03em;
}

.iclub-visual-v3 #view-registration .content.reg > .muted {
  max-width: 470px;
  margin-bottom: 20px;
  color: var(--v3-muted);
  font-size: 13px;
  line-height: 1.5;
}

.iclub-visual-v3 #view-registration .reg-form {
  gap: 14px;
}

.iclub-visual-v3 #view-registration .field {
  gap: 6px;
}

.iclub-visual-v3 #view-registration .label {
  color: var(--v3-text);
  font-size: 11px;
  font-weight: 760;
  letter-spacing: 0.006em;
}

.iclub-visual-v3 #view-registration .input {
  min-height: 44px;
  padding-inline: 12px;
  border-color: var(--v3-border);
  border-radius: var(--v3-radius-md);
  background: #FFFFFF;
  font-size: 13px;
  box-shadow: none;
}

.iclub-visual-v3 #view-registration .field-hint,
.iclub-visual-v3 #view-registration .field-note,
.iclub-visual-v3 #view-registration .reg-subject-change-note {
  font-size: 10.5px;
  line-height: 1.45;
}

.iclub-visual-v3 #view-registration .field-hint {
  color: var(--v3-muted);
}

.iclub-visual-v3 #view-registration .field-note {
  padding: 9px 10px;
  border: 1px solid #F1DFC2;
  border-radius: var(--v3-radius-sm);
  background: #FFF9EE;
  color: #8A5517;
}

.iclub-visual-v3 #view-registration .reg-toggle,
.iclub-visual-v3 #view-registration .reg-subject-card,
.iclub-visual-v3 #view-registration .reg-nonstudent-card {
  border: 1px solid var(--v3-border);
  border-radius: var(--v3-radius-lg);
  background: var(--v3-card);
  box-shadow: var(--v3-premium-shadow);
}

.iclub-visual-v3 #view-registration .reg-toggle {
  min-height: 58px;
  padding: 11px 12px;
}

.iclub-visual-v3 #view-registration .reg-subject-card,
.iclub-visual-v3 #view-registration .reg-nonstudent-card {
  padding: 14px;
}

.iclub-visual-v3 #view-registration .reg-subject-card .card-title,
.iclub-visual-v3 #view-registration .reg-nonstudent-card .card-title {
  font-size: 14px;
  font-weight: 780;
}

.iclub-visual-v3 #view-registration .chip-group {
  gap: 7px;
  margin-top: 10px;
}

.iclub-visual-v3 #view-registration .chip-btn {
  min-height: 34px;
  padding: 7px 10px;
  border: 1px solid var(--v3-border);
  border-radius: 999px;
  background: #FFFFFF;
  color: var(--v3-muted);
  font-size: 11px;
  font-weight: 720;
  box-shadow: none;
}

.iclub-visual-v3 #view-registration .chip-btn.is-active,
.iclub-visual-v3 #view-registration .chip-btn.active,
.iclub-visual-v3 #view-registration .chip-btn[aria-pressed="true"] {
  border-color: #D1DDFC;
  background: var(--v3-primary-soft);
  color: var(--v3-primary);
}

.iclub-visual-v3 #view-registration .reg-consent {
  padding: 11px 12px;
  border: 1px solid var(--v3-border);
  border-radius: var(--v3-radius-md);
  background: #FBFCFF;
  line-height: 1.45;
}

.iclub-visual-v3 #view-registration #reg-submit {
  width: 100%;
  min-height: 46px;
  margin-top: 2px;
  border-radius: var(--v3-radius-md);
  background: var(--v3-primary);
  box-shadow: 0 6px 16px rgba(36, 87, 214, 0.18);
}

/* Ratings */
.iclub-visual-v3 #view-ratings .content.leaderboard {
  width: 100%;
  max-width: 760px;
  margin-inline: auto;
  padding-top: 12px;
  padding-bottom: 96px;
}

.iclub-visual-v3 #view-ratings .lb-header {
  min-height: 50px;
  margin-bottom: 14px;
  padding: 0 2px;
  border-bottom: 0;
}

.iclub-visual-v3 #view-ratings .lb-title {
  color: var(--v3-text);
  font-size: 22px;
  line-height: 1.15;
  font-weight: 810;
  letter-spacing: -0.025em;
}

.iclub-visual-v3 #view-ratings .lb-back,
.iclub-visual-v3 #view-ratings .lb-search-btn,
.iclub-visual-v3 #view-ratings .lb-info {
  width: 36px;
  height: 36px;
  display: inline-grid;
  place-items: center;
  padding: 0;
  border: 1px solid var(--v3-border);
  border-radius: var(--v3-radius-md);
  background: var(--v3-card);
  color: var(--v3-text);
  font-size: 0;
  box-shadow: none;
}

.iclub-visual-v3 #view-ratings .lb-info {
  font-size: 12px;
  font-weight: 800;
}

.iclub-visual-v3 #view-ratings .v3-ratings-icon {
  width: 18px;
  height: 18px;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.iclub-visual-v3 #view-ratings .lb-segment {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--v3-border);
  border-radius: var(--v3-radius-md);
  background: #F1F4F9;
  box-shadow: none;
}

.iclub-visual-v3 #view-ratings .seg-btn {
  min-height: 36px;
  border: 0;
  border-radius: var(--v3-radius-sm);
  background: transparent;
  color: var(--v3-muted);
  font-size: 11px;
  font-weight: 730;
  box-shadow: none;
}

.iclub-visual-v3 #view-ratings .seg-btn.is-active {
  background: #FFFFFF;
  color: var(--v3-primary);
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
}

.iclub-visual-v3 #view-ratings .lb-filters {
  gap: 8px;
  margin-top: 12px;
}

.iclub-visual-v3 #view-ratings .lb-filter {
  gap: 5px;
}

.iclub-visual-v3 #view-ratings .lb-filter-label {
  color: var(--v3-muted);
  font-size: 10px;
  font-weight: 760;
  letter-spacing: 0.035em;
  text-transform: uppercase;
}

.iclub-visual-v3 #view-ratings .lb-select {
  min-height: 40px;
  padding: 8px 10px;
  border: 1px solid var(--v3-border);
  border-radius: var(--v3-radius-md);
  background: #FFFFFF;
  color: var(--v3-text);
  font-size: 12px;
  box-shadow: none;
}

.iclub-visual-v3 #view-ratings .lb-hint {
  margin-top: 10px;
  padding: 9px 10px;
  border: 1px solid #DCE5FA;
  border-radius: var(--v3-radius-sm);
  background: #F6F8FF;
}

.iclub-visual-v3 #view-ratings .lb-search-panel {
  margin-top: 10px;
  padding: 10px;
  border: 1px solid var(--v3-border);
  border-radius: var(--v3-radius-lg);
  background: var(--v3-card);
  box-shadow: var(--v3-premium-shadow);
}

.iclub-visual-v3 #view-ratings .lb-search {
  min-height: 42px;
  border: 1px solid var(--v3-border);
  border-radius: var(--v3-radius-md);
  background: #FFFFFF;
  box-shadow: none;
}

.iclub-visual-v3 #view-ratings .lb-search-ico {
  display: grid;
  place-items: center;
  color: var(--v3-muted);
  font-size: 0;
}

.iclub-visual-v3 #view-ratings .lb-search-input {
  color: var(--v3-text);
  font-size: 12px;
}

.iclub-visual-v3 #view-ratings .lb-head {
  margin-top: 14px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--v3-border);
  color: var(--v3-muted);
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.06em;
}

.iclub-visual-v3 #view-ratings .lb-list-wrap {
  overflow: hidden;
  border: 1px solid var(--v3-border);
  border-radius: var(--v3-radius-lg);
  background: var(--v3-card);
  box-shadow: var(--v3-premium-shadow);
}

.iclub-visual-v3 #view-ratings .lb-row,
.iclub-visual-v3 #view-ratings .lb-item {
  min-height: 56px;
  border-bottom-color: var(--v3-border);
  background: #FFFFFF;
}

.iclub-visual-v3 #view-ratings .lb-mybar {
  border: 1px solid #D3DEFC;
  border-radius: var(--v3-radius-lg);
  background: linear-gradient(135deg, #FFFFFF 0%, #F2F6FF 100%);
  box-shadow: 0 10px 28px rgba(36, 87, 214, 0.10);
}

/* Shared global utility screens */
.iclub-visual-v3 #view-notifications .content,
.iclub-visual-v3 #view-community .content,
.iclub-visual-v3 #view-about .content,
.iclub-visual-v3 #view-support .content,
.iclub-visual-v3 #view-support-topic .content,
.iclub-visual-v3 #view-certificates .content,
.iclub-visual-v3 #view-certificate-verify .content,
.iclub-visual-v3 #view-archive .content {
  width: 100%;
  max-width: 700px;
  margin-inline: auto;
  padding-top: 20px;
  padding-bottom: 90px;
}

.iclub-visual-v3 #view-notifications .h1,
.iclub-visual-v3 #view-community .h1,
.iclub-visual-v3 #view-about .h1,
.iclub-visual-v3 #view-support .h1,
.iclub-visual-v3 #view-support-topic .h1,
.iclub-visual-v3 #view-certificates .h1,
.iclub-visual-v3 #view-certificate-verify .h1,
.iclub-visual-v3 #view-archive .h1 {
  color: var(--v3-text);
  font-size: 23px;
  line-height: 1.16;
  font-weight: 800;
  letter-spacing: -0.026em;
}

.iclub-visual-v3 #view-notifications .content > .muted,
.iclub-visual-v3 #view-community .content > .muted,
.iclub-visual-v3 #view-about .content > .muted,
.iclub-visual-v3 #view-support .content > .muted,
.iclub-visual-v3 #view-certificates .content > .muted,
.iclub-visual-v3 #view-certificate-verify .content > .muted,
.iclub-visual-v3 #view-archive .content > .muted {
  margin-top: 5px;
  color: var(--v3-muted);
  font-size: 12px;
  line-height: 1.5;
}

.iclub-visual-v3 #view-notifications .notifications-head {
  margin-bottom: 14px;
}

.iclub-visual-v3 #view-community .cards-grid,
.iclub-visual-v3 #view-support #support-topics {
  gap: 10px;
  margin-top: 16px;
}

.iclub-visual-v3 #view-community .card-btn,
.iclub-visual-v3 #view-support #support-topics > button,
.iclub-visual-v3 #view-support-topic .card,
.iclub-visual-v3 #view-certificates #certificates-list > *,
.iclub-visual-v3 #view-certificate-verify #certificate-verify-result > *,
.iclub-visual-v3 #view-archive #archive-list > * {
  border: 1px solid var(--v3-border);
  border-radius: var(--v3-radius-lg);
  background: var(--v3-card);
  box-shadow: var(--v3-premium-shadow);
}

.iclub-visual-v3 #view-community .card-btn {
  min-height: 76px;
  padding: 14px;
  text-align: left;
}

.iclub-visual-v3 #view-about #about-tabs {
  margin-top: 16px;
}

.iclub-visual-v3 #view-about #about-content,
.iclub-visual-v3 #view-notifications #notifications-list,
.iclub-visual-v3 #view-support-topic #support-topic-faq,
.iclub-visual-v3 #view-certificates #certificates-list,
.iclub-visual-v3 #view-certificate-verify #certificate-verify-result,
.iclub-visual-v3 #view-archive #archive-list {
  margin-top: 14px;
}

.iclub-visual-v3 #view-support-topic .support-textarea {
  min-height: 120px;
  resize: vertical;
}

@media (max-width: 430px) {
  .iclub-visual-v3 #view-registration .content.reg {
    padding-top: 18px;
  }

  .iclub-visual-v3 #view-registration .h1 {
    font-size: 24px;
  }

  .iclub-visual-v3 #view-ratings .content.leaderboard {
    padding-top: 8px;
  }

  .iclub-visual-v3 #view-ratings .lb-title {
    font-size: 20px;
  }

  .iclub-visual-v3 #view-notifications .content,
  .iclub-visual-v3 #view-community .content,
  .iclub-visual-v3 #view-about .content,
  .iclub-visual-v3 #view-support .content,
  .iclub-visual-v3 #view-support-topic .content,
  .iclub-visual-v3 #view-certificates .content,
  .iclub-visual-v3 #view-certificate-verify .content,
  .iclub-visual-v3 #view-archive .content {
    padding-top: 16px;
  }
}
'''
          css_path.write_text(css, encoding='utf-8')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          replacements = {
            '<button class="lb-back" type="button" data-action="back" aria-label="Back">←</button>': '<button class="lb-back" type="button" data-action="back" aria-label="Back"><svg class="v3-ratings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>',
            '<button class="lb-search-btn" type="button" data-action="ratings-search" aria-label="Search">🔍</button>': '<button class="lb-search-btn" type="button" data-action="ratings-search" aria-label="Search"><svg class="v3-ratings-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg></button>',
            '<span class="lb-search-ico">🔍</span>': '<span class="lb-search-ico" aria-hidden="true"><svg class="v3-ratings-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg></span>',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'ratings icon anchor count for {old[:35]} = {s.count(old)}')
              s = s.replace(old, new, 1)
          index.write_text(s, encoding='utf-8')
          PY

      - name: Static premium safety contract
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          grep -q 'PREMIUM EXTENDED SCREENS v3' visual/iclub-premium-v3.css
          grep -q '#view-ratings .lb-segment' visual/iclub-premium-v3.css
          grep -q '#view-registration .reg-form' visual/iclub-premium-v3.css
          grep -q '#view-support-topic .support-textarea' visual/iclub-premium-v3.css
          test "$(grep -o 'class="v3-ratings-icon"' index.html | wc -l | tr -d ' ')" = '3'
          ! grep -Eiq 'localStorage|sessionStorage|supabase|\.rpc\s*\(|\.from\s*\(|operational_stage\s*=|innerHTML\s*=' visual/iclub-premium-v3.css
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = $'index.html\nvisual/iclub-premium-v3.css'

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Browser premium screen checks before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/premium-extended-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.2
          done
          node .github/scripts/visual_v3_live_regression.js
          node .github/scripts/visual_v3_premium_regression.js
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}, javaScriptEnabled:false});
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
            const show=async(id)=>page.evaluate((id)=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('is-active'));document.getElementById(id).classList.add('is-active');},id);
            await show('view-registration');
            let x=await page.evaluate(()=>({r:getComputedStyle(document.querySelector('#view-registration .reg-subject-card')).borderRadius,w:document.documentElement.scrollWidth,i:innerWidth}));
            if(x.r!=='12px'||x.w>x.i) throw new Error('registration premium regression '+JSON.stringify(x));
            await show('view-ratings');
            x=await page.evaluate(()=>({r:getComputedStyle(document.querySelector('#view-ratings .lb-segment')).borderRadius,c:getComputedStyle(document.querySelector('#view-ratings .seg-btn.is-active')).color,icons:document.querySelectorAll('#view-ratings .v3-ratings-icon').length,w:document.documentElement.scrollWidth,i:innerWidth}));
            if(x.r!=='10px'||x.c!=='rgb(36, 87, 214)'||x.icons!==3||x.w>x.i) throw new Error('ratings premium regression '+JSON.stringify(x));
            await show('view-support-topic');
            x=await page.evaluate(()=>({r:getComputedStyle(document.querySelector('#view-support-topic .card')).borderRadius,w:document.documentElement.scrollWidth,i:innerWidth}));
            if(x.r!=='12px'||x.w>x.i) throw new Error('global premium regression '+JSON.stringify(x));
            await browser.close();
            console.log('Premium extended screens browser regression: GREEN');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit only tested premium presentation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html visual/iclub-premium-v3.css
          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = $'index.html\nvisual/iclub-premium-v3.css'
          git commit -m 'feat(ui): premium polish ratings registration and global screens'
          git push origin HEAD:main
