name: Generate Season 2 visual assets

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Generate exact SVG assets
        env:
          GENERATOR_GZIP_B64: 
        run: |
          printf '%s' "$GENERATOR_GZIP_B64" | base64 -d | gzip -d > /tmp/generate_visual_questions.py
          sed -i "s|OUT = Path('/mnt/data/visual_questions')|OUT = Path('assets/season-2/visual-questions')|" /tmp/generate_visual_questions.py
          python /tmp/generate_visual_questions.py
          test "$(find assets/season-2/visual-questions -name '*.svg' | wc -l)" -eq 35

      - name: Commit assets and remove one-shot workflow
        run: |
          rm -f .github/workflows/generate-visual-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add 35 Season 2 hard-question SVG assets"
          git push origin HEAD:${{ github.head_ref }}
