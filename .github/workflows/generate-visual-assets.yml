name: Diagnose visual asset generator

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Inspect existing payload from prior workflow revision
        run: |
          mkdir -p docs
          git show HEAD^:.github/workflows/generate-visual-assets.yml > /tmp/old-workflow.yml || true
          python - <<'PY'
          from pathlib import Path
          import re, base64, gzip, hashlib
          text=Path('/tmp/old-workflow.yml').read_text(encoding='utf-8')
          m=re.search(r'GENERATOR_GZIP_B64:\s*(\S+)',text)
          lines=[]
          if not m:
              lines.append('payload_not_found')
          else:
              value=m.group(1)
              lines.append(f'length={len(value)}')
              lines.append(f'sha256={hashlib.sha256(value.encode()).hexdigest()}')
              try:
                  raw=gzip.decompress(base64.b64decode(value))
                  lines.append(f'decoded_bytes={len(raw)}')
                  lines.append(raw[:120].decode('utf-8','replace'))
              except Exception as e:
                  lines.append(f'error={type(e).__name__}: {e}')
          Path('docs/visual-generator-diagnostic.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit diagnostic and remove workflow
        run: |
          rm -f .github/workflows/generate-visual-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture visual generator payload diagnostic"
          git push origin HEAD:${{ github.head_ref }}
