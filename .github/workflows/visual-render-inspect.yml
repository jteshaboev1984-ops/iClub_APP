name: Diagnose visual question rendering patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Persist whitespace-tolerant review anchors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_visual_question_rendering.py')
          text = path.read_text(encoding='utf-8')
          section = text.index('# 6. Preserve and display the same image in tour review.')

          def replace_block(label, replacement):
              global text
              label_pos = text.index(f'"{label}"', section)
              start = text.rfind('app = ', section, label_pos)
              end = text.index('\n)', label_pos) + 2
              text = text[:start] + replacement + text[end:]

          replace_block('local review image', '''app = sub_once(
              app,
              r'(\\s+question: q\\?\\.question \\|\\| "",\\n)(\\s+options: Array\\.isArray\\(q\\?\\.options\\) \\? q\\.options\\.slice\\(\\) : \\[\\],)',
              r'\\1               imageUrl: q?.imageUrl || q?.image_url || null,\\n\\2',
              "local review image",
          )''')

          replace_block('DB review image select', '''app = sub_once(
              app,
              r'(\\s+explanation,\\n)(\\s+question_text_ru,)',
              r'\\1          image_url,\\n\\2',
              "DB review image select",
          )''')

          replace_block('DB review image mapping', '''app = sub_once(
              app,
              r'(\\s+question: pickContentText\\(q, "question_text"\\) \\|\\| "",\\n)(\\s+options,)',
              r'\\1         imageUrl: q?.image_url || null,\\n\\2',
              "DB review image mapping",
          )''')

          replace_block('review image HTML', '''app = sub_once(
              app,
              r'(\\s+<div style="margin-top:10px">\\$\\{escapeHTML\\(d\\.question \\|\\| ""\\)\\}</div>\\n)(\\s+<div class="muted small" style="margin-top:10px">)',
              r'\\1              ${buildReviewQuestionImageHtml(d)}\\n\\2',
              "review image HTML",
          )''')

          replace_block('review image binding', '''app = sub_once(
              app,
              r'(\\s+`;\\n)(\\s+};\\n\\n\\s+// 1\\) instant local payload right after finish)',
              r'\\1    bindQuestionImageButtons(wrap);\\n\\2',
              "review image binding",
          )''')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Capture next patch result
        run: |
          set +e
          python scripts/apply_visual_question_rendering.py > /tmp/visual-patch.log 2>&1
          status=$?
          set -e
          mkdir -p docs
          {
            echo "exit_status=$status"
            cat /tmp/visual-patch.log
          } > docs/visual-patch-error.txt

      - name: Commit script fixes and diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_visual_question_rendering.py docs/visual-patch-error.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Make review image patch anchors flexible [skip diagnose]"
          git push origin HEAD:${{ github.head_ref }}
