name: Diagnose visual question rendering patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Persist DB review select anchor fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_visual_question_rendering.py')
          text = path.read_text(encoding='utf-8')
          section = text.index('# 6. Preserve and display the same image in tour review.')
          label = text.index('"DB review image select"', section)
          start = text.rfind('app = replace_once(', section, label)
          if start >= 0:
              end = text.index('\n)', label) + 2
              replacement = '''app = sub_once(
                  app,
                  r'(\\s+explanation,\\n)(\\s+question_text_ru,)',
                  r'\\1          image_url,\\n\\2',
                  "DB review image select",
              )'''
              text = text[:start] + replacement + text[end:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Capture next patch result
        run: |
          set +e
          python scripts/apply_visual_question_rendering.py > /tmp/visual-patch.log 2>&1
          status=$?
          set -e
          mkdir -p docs
          {
            echo "exit_status=$status"
            cat /tmp/visual-patch.log
          } > docs/visual-patch-error.txt

      - name: Commit script fix and diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_visual_question_rendering.py docs/visual-patch-error.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Make DB review select patch anchor flexible [skip diagnose]"
          git push origin HEAD:${{ github.head_ref }}
