name: Final visual rendering hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden-and-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          old = '''    const raw = String(value || "").trim();
    if (!raw) return "";

    try {'''
          new = '''    const raw = String(value || "").trim();
    if (!raw) return "";
    // Legacy relative filenames are not reliable question assets and must not block a tour.
    if (!/^https?:\\/\\//i.test(raw)) return "";

    try {'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'if (!/^https?:\\/\\//i.test(raw)) return "";' not in text:
              raise SystemExit('normalizeQuestionImageUrl hardening anchor missing')

          old = '''    retryBtn.hidden = true;
    status.hidden = true;

    if (!url) {'''
          new = '''    retryBtn.hidden = true;
    retryBtn.textContent = tr3(
      "Повторить загрузку",
      "Qayta yuklash",
      "Retry loading"
    );
    openBtn.setAttribute("aria-label", tr3(
      "Увеличить изображение",
      "Rasmni kattalashtirish",
      "Enlarge image"
    ));
    status.hidden = true;

    if (!url) {'''
          if old in text:
              text = text.replace(old, new, 1)
          elif '"Qayta yuklash"' not in text:
              raise SystemExit('image controls localisation anchor missing')

          old = '''    __questionImageModalBound = true;
    if (closeBtn) closeBtn.addEventListener("click", closeQuestionImageModal);'''
          new = '''    __questionImageModalBound = true;
    if (closeBtn) {
      closeBtn.setAttribute("aria-label", tr3("Закрыть", "Yopish", "Close"));
      closeBtn.addEventListener("click", closeQuestionImageModal);
    }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'tr3("Закрыть", "Yopish", "Close")' not in text:
              raise SystemExit('modal close localisation anchor missing')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate application code and all SVG assets
        run: |
          node --check app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('style.css').read_text(encoding='utf-8')
          files = sorted(Path('assets/season-2/visual-questions').rglob('*.svg'))

          checks = {
            '35 SVG files': len(files) == 35,
            'active image container': html.count('id="tour-question-figure"') == 1,
            'global modal': html.count('id="question-image-modal"') == 1,
            'preload before attempt': app.count('preloadTourQuestionImages(questions)') == 2,
            'timer guard': 'if (!ctx.questionReady || qStart === null || qStart === undefined) return;' in app,
            'review image': 'buildReviewQuestionImageHtml(d)' in app,
            'absolute URL guard': 'if (!/^https?:\\/\\//i.test(raw)) return "";' in app,
            'retry localisation': '"Qayta yuklash"' in app,
            'mobile CSS': 'Question images — active tours and review' in css,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Contract failed: ' + ', '.join(failed))

          for path in files:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('<svg') or 'viewBox="0 0 1200 800"' not in text:
                  raise SystemExit(f'Invalid SVG: {path}')
              if re.search(r'<script\b', text, re.I):
                  raise SystemExit(f'Script tag found: {path}')
              if path.stat().st_size < 500:
                  raise SystemExit(f'Unexpectedly small SVG: {path}')

          bio = Path('assets/season-2/visual-questions/biology/s2_t7_q5844.svg').read_text()
          math = Path('assets/season-2/visual-questions/mathematics/s2_t1_q6026.svg').read_text()
          econ = Path('assets/season-2/visual-questions/economics/s2_t4_q6184.svg').read_text()
          if '>ATP</text>' in bio or '#059669' in math or 'fill="#dc2626" style="">A</text>' in econ:
              raise SystemExit('Answer giveaway remains in corrected SVGs')

          print('Final visual rendering audit passed.')
          PY

      - name: Remove temporary workflows and commit final product changes
        run: |
          rm -f .github/workflows/visual-render-inspect.yml
          rm -f .github/workflows/harden-visual-rendering.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize visual question rendering hardening"
          git push origin HEAD:${{ github.head_ref }}
