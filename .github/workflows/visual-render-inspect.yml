name: Apply visual question rendering

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply visual rendering patch
        run: python scripts/apply_visual_question_rendering.py

      - name: Validate JavaScript and visual contract
        run: |
          node --check app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('style.css').read_text(encoding='utf-8')

          checks = {
              'one active image figure': html.count('id="tour-question-figure"') == 1,
              'one active image element': html.count('id="tour-question-image"') == 1,
              'one global image modal': html.count('id="question-image-modal"') == 1,
              'preload helper and call': app.count('preloadTourQuestionImages(questions)') >= 2,
              'timer readiness state': 'questionReady: false' in app,
              'timeout readiness guard': 'if (!ctx.questionReady || qStart === null || qStart === undefined) return;' in app,
              'review query includes image': 'image_url,' in app,
              'review image mapping': 'imageUrl: q?.image_url || null' in app,
              'review image rendering': app.count('buildReviewQuestionImageHtml(d)') == 1,
              'review image binding': app.count('bindQuestionImageButtons(wrap)') == 1,
              'responsive image CSS': 'Question images — active tours and review' in css,
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))
          print('Visual rendering contract validated.')
          PY

      - name: Remove temporary tooling and commit product changes
        run: |
          rm -f .github/workflows/visual-render-inspect.yml
          rm -f scripts/apply_visual_question_rendering.py
          rm -f docs/visual-render-inspection.txt
          rm -f docs/visual-patch-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render visual questions safely in tours and review"
          git push origin HEAD:${{ github.head_ref }}
