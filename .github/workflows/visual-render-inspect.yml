name: Diagnose visual question rendering patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Capture patch output
        run: |
          set +e
          python scripts/apply_visual_question_rendering.py > /tmp/visual-patch.log 2>&1
          status=$?
          set -e
          mkdir -p docs
          {
            echo "exit_status=$status"
            cat /tmp/visual-patch.log
          } > docs/visual-patch-error.txt

      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-patch-error.txt
          git commit -m "Capture visual rendering patch diagnostic [skip diagnose]"
          git push origin HEAD:${{ github.head_ref }}
