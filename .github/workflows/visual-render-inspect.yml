name: Diagnose visual question rendering patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Persist whitespace-tolerant review anchor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_visual_question_rendering.py')
          text = path.read_text(encoding='utf-8')
          section = text.index('# 6. Preserve and display the same image in tour review.')
          label = text.index('"local review image"', section)
          preceding = text.rfind('app = ', section, label)
          if text.startswith('app = replace_once(', preceding):
              end = text.index('\n)', label) + 2
              replacement = '''app = sub_once(
                  app,
                  r'(\\s+question: q\\?\\.question \\|\\| "",\\n)(\\s+options: Array\\.isArray\\(q\\?\\.options\\) \\? q\\.options\\.slice\\(\\) : \\[\\],)',
                  r'\\1               imageUrl: q?.imageUrl || q?.image_url || null,\\n\\2',
                  "local review image",
              )'''
              text = text[:preceding] + replacement + text[end:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Capture next patch result
        run: |
          set +e
          python scripts/apply_visual_question_rendering.py > /tmp/visual-patch.log 2>&1
          status=$?
          set -e
          mkdir -p docs
          {
            echo "exit_status=$status"
            cat /tmp/visual-patch.log
          } > docs/visual-patch-error.txt

      - name: Commit script fix and diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_visual_question_rendering.py docs/visual-patch-error.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist visual patch anchor fix and diagnostic [skip diagnose]"
          git push origin HEAD:${{ github.head_ref }}
