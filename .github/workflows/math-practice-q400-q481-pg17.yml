name: Mathematics Practice versioned correction batches — isolated PostgreSQL17
on:
  pull_request:
    branches: [main]
    paths:
      - 'content/math/practice_v2/p1_quadratics/P1-QUA-02.json'
      - 'content/math/practice_v2/p2_functions/P1-FUN-03.json'
      - 'content/math/practice_v2/p2_functions/P1-FUN-01.json'
      - 'content/math/practice_v2/p4_circular_trigonometry/P1-TRI-03.json'
      - 'content/math/practice_v2/p4_circular_trigonometry/P1-TRI-04.json'
      - 'content/math/practice_v2/p5_binomial_series/P1-SER-03.json'
      - 'content/math/practice_v2/p5_binomial_series/P1-SER-05.json'
      - 'content/math/practice_v2/p3_coordinate_geometry/P1-COO-05.json'
      - 'content/math/practice_v2/p4_circular_trigonometry/P1-CIR-02.json'
      - 'content/math/practice_v2/p4_circular_trigonometry/P1-CIR-03.json'
      - 'content/math/practice_v2/p5_binomial_series/P1-SER-02.json'
      - 'content/math/practice_v2/p5_binomial_series/P1-SER-04.json'
      - 'content/math/practice_v2/p6_differentiation/P1-DIF-06.json'
      - 'content/math/practice_v2/p6_differentiation/P1-DIF-05.json'
      - 'content/math/practice_v2/p7_integration/P1-INT-04.json'
      - 'scripts/math-practice-confirmed10-source-guard.cjs'
      - 'scripts/math-practice-v2-confirmed10-stage-generator.cjs'
      - 'scripts/math-practice-confirmed10-pg17-fixture.cjs'
      - 'supabase/tests/math_practice_q400_q481_future_only_pg17.sql'
      - 'supabase/tests/math_practice_q089_q202_q226_future_only_pg17.sql'
      - 'supabase/tests/math_practice_pending10_future_only_pg17.sql'
      - 'supabase/tests/math_practice_decimal8_future_only_pg17.sql'
      - 'supabase/tests/math_practice_q069_q311_semantic_future_only_pg17.sql'
      - 'supabase/candidates/math_practice_v2_future_only_atomic_membership_switch_v1.sql'
      - '.github/workflows/math-practice-q400-q481-pg17.yml'
permissions:
  contents: read
jobs:
  versioned-math-batches-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard all 495 and prove 28 published plus 2 next semantic corrections
        run: |
          set -euo pipefail
          node --check scripts/math-practice-confirmed10-source-guard.cjs
          node --check scripts/math-practice-v2-confirmed10-stage-generator.cjs
          node --check scripts/math-practice-confirmed10-pg17-fixture.cjs
          node scripts/math-practice-confirmed10-source-guard.cjs
      - name: Two-item isolated future-only stage, fail-closed QA, atomic cutover and rollback
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          chmod 700 "$tmp"
          trap 'rm -rf "$tmp"' EXIT
          node scripts/math-practice-v2-confirmed10-stage-generator.cjs --batch q400q481 --out "$tmp/stage.sql"
          node scripts/math-practice-confirmed10-pg17-fixture.cjs \
            --stage "$tmp/stage.sql" --out "$tmp/fixture.sql" --expect 2
          createdb -T template0 math_q400q481
          psql -X -v ON_ERROR_STOP=1 -d math_q400q481 -f "$tmp/fixture.sql" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_q400q481 -f "$tmp/stage.sql" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_q400q481 \
            -f supabase/candidates/math_practice_v2_future_only_atomic_membership_switch_v1.sql >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_q400q481 \
            -f supabase/tests/math_practice_q400_q481_future_only_pg17.sql
      - name: Three-item mixed MCQ/input stage and historical drills rollback
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          chmod 700 "$tmp"
          trap 'rm -rf "$tmp"' EXIT
          node scripts/math-practice-v2-confirmed10-stage-generator.cjs --batch q089q202q226 --out "$tmp/stage.sql"
          node scripts/math-practice-confirmed10-pg17-fixture.cjs \
            --stage "$tmp/stage.sql" --out "$tmp/fixture.sql" --expect 3
          createdb -T template0 math_q089q202q226
          psql -X -v ON_ERROR_STOP=1 -d math_q089q202q226 -f "$tmp/fixture.sql" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_q089q202q226 -f "$tmp/stage.sql" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_q089q202q226 \
            -f supabase/candidates/math_practice_v2_future_only_atomic_membership_switch_v1.sql >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_q089q202q226 \
            -f supabase/tests/math_practice_q089_q202_q226_future_only_pg17.sql
      - name: One consolidated ten-item atomic mixed MCQ/input cutover and rollback
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          chmod 700 "$tmp"
          trap 'rm -rf "$tmp"' EXIT
          node scripts/math-practice-v2-confirmed10-stage-generator.cjs --batch pending10 --out "$tmp/stage.sql"
          node scripts/math-practice-confirmed10-pg17-fixture.cjs \
            --stage "$tmp/stage.sql" --out "$tmp/fixture.sql" --expect 10
          createdb -T template0 math_pending10
          psql -X -v ON_ERROR_STOP=1 -d math_pending10 -f "$tmp/fixture.sql" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_pending10 -f "$tmp/stage.sql" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_pending10 \
            -f supabase/candidates/math_practice_v2_future_only_atomic_membership_switch_v1.sql >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_pending10 \
            -f supabase/tests/math_practice_pending10_future_only_pg17.sql
      - name: Next eight numeric-format clarifications — exact original hashes, inactive QA, atomic switch and rollback
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          chmod 700 "$tmp"
          trap 'rm -rf "$tmp"' EXIT
          node scripts/math-practice-v2-confirmed10-stage-generator.cjs --batch decimal8 --out "$tmp/stage.sql"
          node scripts/math-practice-confirmed10-pg17-fixture.cjs \
            --stage "$tmp/stage.sql" --out "$tmp/fixture.sql" --expect 8
          createdb -T template0 math_decimal8
          psql -X -v ON_ERROR_STOP=1 -d math_decimal8 -f "$tmp/fixture.sql" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_decimal8 -f "$tmp/stage.sql" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_decimal8 \
            -f supabase/candidates/math_practice_v2_future_only_atomic_membership_switch_v1.sql >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_decimal8 \
            -f supabase/tests/math_practice_decimal8_future_only_pg17.sql
      - name: Two exact MCQ semantic clarifications Q069/Q311 — pending QA and atomic future-only replacement with preserved open session
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          chmod 700 "$tmp"
          trap 'rm -rf "$tmp"' EXIT
          node scripts/math-practice-v2-confirmed10-stage-generator.cjs --batch semantic2 --out "$tmp/stage.sql"
          node scripts/math-practice-confirmed10-pg17-fixture.cjs \
            --stage "$tmp/stage.sql" --out "$tmp/fixture.sql" --expect 2
          createdb -T template0 math_semantic2
          psql -X -v ON_ERROR_STOP=1 -d math_semantic2 -f "$tmp/fixture.sql" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_semantic2 -f "$tmp/stage.sql" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_semantic2 \
            -f supabase/candidates/math_practice_v2_future_only_atomic_membership_switch_v1.sql >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_semantic2 \
            -f supabase/tests/math_practice_q069_q311_semantic_future_only_pg17.sql
      - name: No live academic publication
        run: echo 'Two new semantic items Q069/Q311 and previous published regressions ONLY. No hosted DML, app deployment, QA approval or published key output.'
