name: iClub AI Layer v2.1 — isolated QA only
# QA P2/P5/P6: validate mismatched actual screen as forgery; app-wide evidence guards.

# QA Lesson/Practice/Tour context acceptance: thirteen disposable scratch PostgreSQL suites.
# This workflow never builds or deploys to Vercel, never connects to Supabase,
# never uses production secrets and never runs on main.
on:
  push:
    branches:
      - qa/iclub-ai-layer-v21-20261012
    paths:
      - '.github/workflows/iclub-ai-v21-offline-qa.yml'
      - 'qa/ai-layer-v21-trusted-server-adapter.cjs'
      - 'qa/ai-layer-v21-trusted-server-adapter.test.cjs'
      - 'qa/ai-layer-v21-app-wide-admission.cjs'
      - 'qa/ai-layer-v21-edge-request.cjs'
      - 'qa/edge_v21/**'
      - 'qa/ai-layer-v21-scoped-context-sql.test.cjs'
      - 'qa/ai-layer-v21-p6-navigation-candidates.test.cjs'
      - 'qa/ai-layer-v21-p6-navigation-candidates.snapshot.json'
      - 'qa/ai-layer-v21-p6-navigation-editorial-drafts.snapshot.json'
      - 'qa/ai-layer-v21-p6-navigation-editorial-drafts.test.cjs'
      - 'qa/ai-layer-v21-p6-editorial-source-packet.cjs'
      - 'qa/ai-layer-v21-p6-editorial-source-packet.test.cjs'
      - 'qa/ai-layer-v21-p6-release-preflight.cjs'
      - 'qa/ai-layer-v21-p6-release-preflight.test.cjs'
      - 'qa/ai-layer-v21-p6-app-screen-binding.cjs'
      - 'qa/ai-layer-v21-p6-app-screen-binding.test.cjs'
      - 'qa/ai-layer-v21-p6-real-ui-contract.test.cjs'
      - 'qa/ai-layer-v21-ui-transport.cjs'
      - 'qa/ai-layer-v21-ui-transport.test.cjs'
      - 'docs/iclub-ai-layer-p6-editorial-packet-and-proof-hardening-v2.1.md'
      - 'qa/ai-layer-v21-p6-home-next-action-proof.cjs'
      - 'qa/ai-layer-v21-p6-home-next-action-proof.test.cjs'
      - 'i18n.js'
      - 'qa/sql_drafts/iclub_ai_scoped_context_v21_UNAPPLIED.sql'
      - 'qa/sql_drafts/iclub_ai_scoped_context_local_pg.psql'
      - 'qa/sql_drafts/iclub_ai_source_proof_bundle_v21_UNAPPLIED.sql'
      - 'qa/sql_drafts/iclub_ai_v21_p6_navigation_gate_UNAPPLIED.sql'
      - 'qa/sql_drafts/iclub_ai_v21_real_schema_screen_proof_UNAPPLIED.sql'
      - 'qa/sql_drafts/iclub_ai_v21_real_schema_screen_proof_local_pg.psql'
      - 'qa/run-ai-layer-v21-postgres-local.sh'
      - 'docs/iclub-ai-layer-p7-real-schema-proof-audit-v2.1.md'
      - 'docs/iclub-ai-layer-p7-current-screen-authority-v2.1.md'
      - 'docs/iclub-ai-layer-p6-home-profile-general-trusted-scope-v2.1.md'
      - 'docs/iclub-ai-layer-master-plan-v2.1.md'
      - 'qa/run-ai-layer-v21-offline.cjs'
      - 'docs/iclub-ai-layer-trusted-server-adapter-v2.1.md'
      - 'docs/iclub-ai-layer-app-wide-edge-binding-v2.1.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iclub-ai-v21-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-node-and-scratch-pg:
    if: github.ref == 'refs/heads/qa/iclub-ai-layer-v21-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGUSER: postgres
      PGPASSWORD: synthetic-only
      PGCONNECT_TIMEOUT: 5
    steps:
      - name: Checkout QA branch (no credentials persisted)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete offline QA and frozen Exam Prep regression
        run: node qa/run-ai-layer-v21-offline.cjs
      - name: Headless Chrome actual viewport and interaction QA, synthetic only
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium || command -v chromium-browser
          node qa/ai-layer-v21-browser-visual.cjs
      - name: Synthetic Preview real Chromium practice to iClub AI journey
        run: node qa/ai-layer-v21-protected-preview-browser.cjs
      - name: Install Deno runtime for Edge candidate verification
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck isolated Deno Edge transport
        run: deno check qa/edge_v21/http.ts qa/edge_v21/context_core.ts qa/edge_v21/screen_proof_services.ts qa/edge_v21/screen_proof_services_test.ts qa/edge_v21/supabase_services.ts qa/edge_v21/runtime.ts qa/edge_v21/index.ts
      - name: Native Deno HTTP, Auth and source-gate regression
        run: deno test --allow-read=qa --no-check qa/edge_v21/http_test.ts qa/edge_v21/screen_proof_services_test.ts qa/edge_v21/supabase_services_test.ts qa/edge_v21/runtime_test.ts qa/edge_v21/context_core_test.ts qa/edge_v21/source_proof_test.ts qa/edge_v21/authority_services_test.ts qa/edge_v21/e2e_synthetic_test.ts
      - name: Install ephemeral PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Run thirteen independent scratch PostgreSQL suites
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for suite in meter math practice release claim atomic context source publisher authority spend receipt realproof; do
            db="iclub_ai_v21_scratch_ci_${suite}"
            createdb -h 127.0.0.1 -p 5432 -U postgres "${db}"
            if ICLUB_PGTEST_DB="${db}" ICLUB_PGTEST_HOST=127.0.0.1 \
                ICLUB_PGTEST_PORT=5432 ICLUB_PGTEST_SUITE="${suite}" \
                bash qa/run-ai-layer-v21-postgres-local.sh; then
              echo "PASS: scratch suite ${suite}"
            else
              echo "FAIL: scratch suite ${suite}"
              failed=1
            fi
            dropdb -h 127.0.0.1 -p 5432 -U postgres "${db}"
          done
          exit "$failed"
      - name: Real two-worker durable delivery race in another empty scratch DB
        shell: bash
        run: |
          set -euo pipefail
          db=iclub_ai_v21_scratch_ci_parallel
          createdb -h 127.0.0.1 -p 5432 -U postgres "${db}"
          result=0
          ICLUB_PGTEST_DB="${db}" ICLUB_PGTEST_HOST=127.0.0.1 \
            ICLUB_PGTEST_PORT=5432 bash qa/run-ai-layer-v21-claim-race.sh || result=$?
          dropdb -h 127.0.0.1 -p 5432 -U postgres "${db}"
          exit "$result"
      - name: Independent two-worker provider monetary budget race
        shell: bash
        run: |
          set -euo pipefail
          db=iclub_ai_v21_scratch_ci_moneyrace
          createdb -h 127.0.0.1 -p 5432 -U postgres "$db"
          result=0
          ICLUB_PGTEST_DB="$db" ICLUB_PGTEST_HOST=127.0.0.1 \
            ICLUB_PGTEST_PORT=5432 bash qa/run-ai-layer-v21-budget-race.sh || result=$?
          dropdb -h 127.0.0.1 -p 5432 -U postgres "$db"
          exit "$result"
      - name: Verify legacy code and migrations have no QA modifications
        if: always()
        run: |
          set -euo pipefail
          git diff --name-only 9afc7b44aead03b2a30544e6e7d4c4eb8670efbf HEAD -- \
            exam-prep/ supabase/functions/exam-prep-ai/ supabase/migrations/ \
            index.html app.js > /tmp/iclub-ai-protected-files.txt
          if [ -s /tmp/iclub-ai-protected-files.txt ]; then
            cat /tmp/iclub-ai-protected-files.txt
            echo "FAIL: original Mathematics Exam Prep surface changed"
            exit 1
          fi
