permissions:
  contents: read

concurrency:
  group: iclub-ai-v21-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-node-and-scratch-pg:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/qa/iclub-ai-layer-v21-20261012') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qa/iclub-ai-layer-v21-20261012') ||
      (github.event_name == 'pull_request' && github.base_ref == 'qa/iclub-ai-layer-v21-20261012' && startsWith(github.head_ref, 'qa/iclub-ai-v21-ci-verification-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGUSER: postgres
      PGPASSWORD: synthetic-only
      PGCONNECT_TIMEOUT: 5
    steps:
      - name: Checkout QA branch (no credentials persisted)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete offline QA and frozen Exam Prep regression
        run: node qa/run-ai-layer-v21-offline.cjs
      - name: Knowledge First exact prepared source to existing quota and delivery claim
        env:
          CI: 'true'
          ICLUB_AI_QA_BOUND_PREPARED: synthetic-only
        run: node --test qa/ai-v21-knowledge-first-prepared-bridge.test.cjs
      - name: Universal real academic source contracts, approved UI and permissions
        run: node --test qa/live_candidate/iclub-ai-v21-academic-architecture.test.cjs qa/live_candidate/iclub-ai-v21-source-intake.test.cjs qa/live_candidate/iclub-ai-v21-owner-beta-release.test.cjs qa/live_candidate/iclub-ai-v21-browser-adapter.test.cjs qa/live_candidate/iclub-ai-v21-product-ux.test.cjs
      - name: Headless Chrome actual viewport and interaction QA, synthetic only
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium || command -v chromium-browser
          node qa/ai-layer-v21-browser-visual.cjs
      - name: Offline P6 native Chromium navigation and context-scope QA
        run: node qa/ai-layer-v21-p6-native-browser.cjs
      - name: QA-only P6 accessible tab names native Chromium in RU UZ EN
        run: node qa/ai-layer-v21-p6-nav-a11y-browser.cjs
      - name: Synthetic Preview real Chromium practice to iClub AI journey
        run: node qa/ai-layer-v21-protected-preview-browser.cjs
      - name: Exact APP look visual acceptance in Chromium at 320 390 and 1366
        env:
          ICLUB_VISUAL_ARTIFACT_DIR: /tmp/iclub-ai-v21-app-look-screenshots
        run: node qa/ai-layer-v21-app-look-browser.cjs
      - name: Upload iClub visual approval screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iclub-ai-v21-app-look-review-screenshots
          path: /tmp/iclub-ai-v21-app-look-screenshots/*.png
          if-no-files-found: warn
          retention-days: 5
      - name: Build one-file offline visual Preview with exact application styles
        run: node qa/ai-layer-v21-app-look-package.cjs /tmp/iclub-ai-v21-visual-review/iClub_AI_v21_Visual_Preview.html
      - name: Attach clickable offline iClub visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iclub-ai-v21-standalone-visual-preview
          path: /tmp/iclub-ai-v21-visual-review/iClub_AI_v21_Visual_Preview.html
          if-no-files-found: warn
          retention-days: 7
      - name: Install Deno runtime for Edge candidate verification
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck isolated Deno Edge transport
        run: deno check qa/edge_v21/qa_startup_guard.ts qa/edge_v21/qa_startup_guard_test.ts qa/edge_v21/auth_trust_boundary_test.ts qa/edge_v21/http.ts qa/edge_v21/context_core.ts qa/edge_v21/screen_proof_services.ts qa/edge_v21/screen_proof_services_test.ts qa/edge_v21/supabase_services.ts qa/edge_v21/runtime.ts qa/edge_v21/index.ts
      - name: Native Deno HTTP, Auth and source-gate regression
        run: deno test --allow-read=qa --no-check qa/edge_v21/qa_startup_guard_test.ts qa/edge_v21/auth_trust_boundary_test.ts qa/edge_v21/http_test.ts qa/edge_v21/screen_proof_services_test.ts qa/edge_v21/supabase_services_test.ts qa/edge_v21/runtime_test.ts qa/edge_v21/context_core_test.ts qa/edge_v21/source_proof_test.ts qa/edge_v21/authority_services_test.ts qa/edge_v21/e2e_synthetic_test.ts
      - name: Install ephemeral PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Isolated $5 owner-approved Free beta money guard in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          db="iclub_ai_v21_scratch_ci_5usd_freeform"
          createdb -h 127.0.0.1 -p 5432 -U postgres "$db"
          cleanup() { dropdb -h 127.0.0.1 -p 5432 -U postgres "$db"; }
          trap cleanup EXIT
          for path in \
            qa/live_candidate/iclub_ai_v21_freeform_5usd_scratch_BOOTSTRAP_20261021.psql \
            qa/live_candidate/iclub_ai_v21_freeform_5usd_money_GATE_UNAPPLIED_20261021.sql \
            qa/live_candidate/iclub_ai_v21_freeform_5usd_money_SCRATCH_TEST_20261021.sql \
            qa/live_candidate/iclub_ai_v21_freeform_shared_beta_quota_GATE_UNAPPLIED_20261021.sql \
            qa/live_candidate/iclub_ai_v21_freeform_shared_beta_quota_SCRATCH_TEST_20261021.sql \
            qa/live_candidate/iclub_ai_v21_freeform_general_help_source_UNAPPLIED_20261021.sql \
            qa/live_candidate/iclub_ai_v21_freeform_general_help_source_SCRATCH_TEST_20261021.sql; do
            psql -X -w -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 \
              -U postgres -d "$db" -f "$path"
          done
      - name: Isolated three-locale question provenance SQL proof (NO production)
        shell: bash
        run: |
          set -euo pipefail
          db=iclub_ai_v21_scratch_ci_qbank_origin
          createdb -h 127.0.0.1 -p 5432 -U postgres "$db"
          cleanup() { dropdb -h 127.0.0.1 -p 5432 -U postgres "$db"; }
          trap cleanup EXIT
          PGDATABASE="$db" PGHOST=127.0.0.1 PGPORT=5432 \
            node qa/live_candidate/iclub-ai-v21-qbank-provenance.pgtest.cjs
          node --test qa/live_candidate/iclub-ai-v21-qbank-provenance.contract.test.cjs
          node --test qa/live_candidate/iclub-ai-v21-qbank-p4-signed-triad-bridge.test.cjs
      - name: Run fifteen independent scratch PostgreSQL suites
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for suite in meter math practice release claim atomic context source publisher authority spend receipt realproof home integrated; do
            db="iclub_ai_v21_scratch_ci_${suite}"
            createdb -h 127.0.0.1 -p 5432 -U postgres "${db}"
            if ICLUB_PGTEST_DB="${db}" ICLUB_PGTEST_HOST=127.0.0.1 \
                ICLUB_PGTEST_PORT=5432 ICLUB_PGTEST_SUITE="${suite}" \
                bash qa/run-ai-layer-v21-postgres-local.sh; then
              echo "PASS: scratch suite ${suite}"
            else
              echo "FAIL: scratch suite ${suite}"
              failed=1
            fi
            dropdb -h 127.0.0.1 -p 5432 -U postgres "${db}"
          done
          exit "$failed"
      - name: Full-stack synthetic Auth to real ten-draft PostgreSQL, owner, kill and money proof
        env:
          ICLUB_QA_ALLOW_FULLSTACK: synthetic-only
        run: node qa/ai-layer-v21-p9-http-to-pg-fullstack.cjs
      - name: Local-only HTTP to real scratch PostgreSQL signed Home integration
        shell: bash
        run: |
          set -euo pipefail
          db="iclub_ai_v21_scratch_ci_home_http"
          createdb -h 127.0.0.1 -p 5432 -U postgres "$db"
          cleanup() { dropdb -h 127.0.0.1 -p 5432 -U postgres "$db"; }
          trap cleanup EXIT
          export ICLUB_PGTEST_DB="$db"
          export ICLUB_PGTEST_HOST=127.0.0.1
          export ICLUB_PGTEST_PORT=5432
          export PGAPPNAME=iclub_ai_v21_local_scratch
          psql -X -w -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 \
            -U postgres -d "$db" \
            -f qa/sql_drafts/iclub_ai_v21_home_http_fixture_local_pg.psql
          node --test qa/ai-layer-v21-p6-home-pg-http.test.cjs
      - name: Native Chromium and independent Study route in a second disposable database
        shell: bash
        run: |
          set -euo pipefail
          db="iclub_ai_v21_scratch_ci_study_route"
          createdb -h 127.0.0.1 -p 5432 -U postgres "$db"
          cleanup() { dropdb -h 127.0.0.1 -p 5432 -U postgres "$db"; }
          trap cleanup EXIT
          export ICLUB_PGTEST_DB="$db"
          export ICLUB_PGTEST_HOST=127.0.0.1
          export ICLUB_PGTEST_PORT=5432
          export PGAPPNAME=iclub_ai_v21_local_scratch
          psql -X -w -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 \
            -U postgres -d "$db" \
            -f qa/sql_drafts/iclub_ai_v21_home_http_fixture_local_pg.psql
          node qa/ai-layer-v21-p6-home-pg-chromium.cjs
          node --test qa/ai-layer-v21-p6-study-route-http.test.cjs
          node qa/ai-layer-v21-p6-study-route-race.cjs
      - name: Independent one-use Home action claim race in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          db=iclub_ai_v21_scratch_ci_home_action_race
          createdb -h 127.0.0.1 -p 5432 -U postgres "$db"
          cleanup() { dropdb -h 127.0.0.1 -p 5432 -U postgres "$db"; }
          trap cleanup EXIT
          export ICLUB_PGTEST_DB="$db"
          export ICLUB_PGTEST_HOST=127.0.0.1
          export ICLUB_PGTEST_PORT=5432
          export PGAPPNAME=iclub_ai_v21_local_scratch
          psql -X -w -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 \
            -U postgres -d "$db" \
            -f qa/sql_drafts/iclub_ai_v21_home_http_fixture_local_pg.psql
          node qa/ai-layer-v21-p6-home-action-race.cjs
      - name: Real two-worker durable delivery race in another empty scratch DB
        shell: bash
        run: |
          set -euo pipefail
          db=iclub_ai_v21_scratch_ci_parallel
          createdb -h 127.0.0.1 -p 5432 -U postgres "${db}"
          result=0
          ICLUB_PGTEST_DB="${db}" ICLUB_PGTEST_HOST=127.0.0.1 \
            ICLUB_PGTEST_PORT=5432 bash qa/run-ai-layer-v21-claim-race.sh || result=$?
          dropdb -h 127.0.0.1 -p 5432 -U postgres "${db}"
          exit "$result"
      - name: Independent two-worker provider monetary budget race
        shell: bash
        run: |
          set -euo pipefail
          db=iclub_ai_v21_scratch_ci_moneyrace
          createdb -h 127.0.0.1 -p 5432 -U postgres "$db"
          result=0
          ICLUB_PGTEST_DB="$db" ICLUB_PGTEST_HOST=127.0.0.1 \
            ICLUB_PGTEST_PORT=5432 bash qa/run-ai-layer-v21-budget-race.sh || result=$?
          dropdb -h 127.0.0.1 -p 5432 -U postgres "$db"
          exit "$result"
      - name: Verify legacy code and migrations have no QA modifications
        if: always()
        run: |
          set -euo pipefail
          git diff --name-only 9afc7b44aead03b2a30544e6e7d4c4eb8670efbf HEAD -- \
            exam-prep/ supabase/functions/exam-prep-ai/ supabase/migrations/ \
            index.html app.js i18n.js style.css > /tmp/iclub-ai-protected-files.txt
