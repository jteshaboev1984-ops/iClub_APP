name: Mathematics source audit

on:
  push:
    branches: [mathematics-academic-audit]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathematics-academic-audit
          fetch-depth: 0
      - name: Download and extract Mathematics source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl -L --fail --retry 3 \
            'https://mmmduffgpvwjdpruzikw.supabase.co/storage/v1/object/public/books/Complete_Pure_Mathematics_1_for_Cambridge_International_AS_%26_A_Level%20%282%29.pdf' \
            -o /tmp/mathematics.pdf
          pdfinfo /tmp/mathematics.pdf > /tmp/pdfinfo.txt
          pdftotext -layout /tmp/mathematics.pdf /tmp/mathematics.txt
          python - <<'PY'
          from pathlib import Path
          import re

          raw = Path('/tmp/mathematics.txt').read_text(encoding='utf-8', errors='replace')
          pages = raw.split('\f')
          out = ['PURE MATHEMATICS 1 — SOURCE AUDIT INDEX', '', Path('/tmp/pdfinfo.txt').read_text(encoding='utf-8', errors='replace')]
          out.append('=== FRONT MATTER / CONTENTS (PDF pages 1-30) ===')
          for i, page in enumerate(pages[:30], start=1):
              compact = re.sub(r'[ \t]+', ' ', page).strip()
              out.append(f'\n--- PDF PAGE {i} ---\n{compact[:6000]}')

          terms = [
              'quadratic inequalities', 'modulus', 'functions and graphs', 'inverse functions',
              'coordinate geometry', 'sequences and series', 'binomial expansion',
              'radian measure', 'arc length', 'sector area', 'trigonometric equations',
              'further trigonometry', 'addition formulae', 'double angle', 'R sin',
              'sum to infinity', 'factor theorem', 'remainder theorem', 'discriminant',
              'horizontal stretch', 'composite functions', 'perpendicular bisector'
          ]
          out.append('\n=== CONCEPT SEARCH CONTEXTS ===')
          for term in terms:
              hits = []
              tl = term.lower()
              for pno, page in enumerate(pages, start=1):
                  idx = page.lower().find(tl)
                  if idx >= 0:
                      context = re.sub(r'\s+', ' ', page[max(0, idx-900):idx+2600]).strip()
                      hits.append((pno, context))
                      if len(hits) == 4:
                          break
              out.append(f'\n## {term} — {len(hits)} shown')
              for pno, context in hits:
                  out.append(f'PDF page {pno}: {context}')

          Path('docs/mathematics-source-audit.txt').parent.mkdir(parents=True, exist_ok=True)
          Path('docs/mathematics-source-audit.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
      - name: Commit report and remove workflow
        run: |
          rm -f .github/workflows/mathematics-source-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Mathematics textbook source audit index'
          git push origin HEAD:mathematics-academic-audit
