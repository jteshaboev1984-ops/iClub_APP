name: Exam Prep due and future retest CTA (isolated)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/weekly-flow-due-retest-cta-regression.cjs'
      - 'exam-prep/exam-prep-live.js'
      - 'exam-prep/exam-prep-api.js'
      - '.github/workflows/exam-prep-due-retest-cta.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and browser preflight
        run: |
          node --check scripts/weekly-flow-due-retest-cta-regression.cjs
          node --check exam-prep/exam-prep-live.js
          node --check exam-prep/exam-prep-weekly-flow-adapter.js
      - name: Install isolated Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Retest due and future, RU UZ EN, mobile and desktop
        run: node scripts/weekly-flow-due-retest-cta-regression.cjs
