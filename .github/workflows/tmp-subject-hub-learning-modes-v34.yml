name: TEMP Subject Hub Learning Modes v3.4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-subject-hub-learning-modes-v34.yml'
      - '.github/scripts/tmp_subject_hub_learning_modes_v34.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  subject-hub-learning-modes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply learning-mode refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tmp_subject_hub_learning_modes_v34.py

      - name: Static safety checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check i18n.js
          node --check .github/scripts/visual_v3_premium_regression.js
          node --check .github/scripts/visual_v3_subject_hub_architecture_regression.js
          grep -q 'PREMIUM SUBJECT HUB LEARNING MODES v3.4' visual/iclub-premium-v3.css
          grep -q 'subject-hub-primary-modes' index.html
          ! grep -Eiq 'localStorage|sessionStorage|supabase|\.rpc\s*\(|\.from\s*\(|operational_stage\s*=|innerHTML\s*=' visual/iclub-premium-v3.css

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run visual and host regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/subject-hub-v34-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.2
          done
          node .github/scripts/visual_v3_premium_regression.js
          node .github/scripts/visual_v3_premium_extended_regression.js
          node .github/scripts/visual_v3_assessment_regression.js
          node .github/scripts/visual_v3_math_exam_prep_ux_regression.js
          node .github/scripts/visual_v3_subject_hub_architecture_regression.js
          node .github/scripts/p0_14_host_regression.js
          node .github/scripts/p0_22_live_view_coexistence_regression.js

      - name: Commit tested learning-mode refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html i18n.js visual/iclub-premium-v3.css .github/scripts/visual_v3_premium_regression.js .github/scripts/visual_v3_subject_hub_architecture_regression.js
          if git diff --cached --quiet; then
            echo 'No learning-mode change to commit.'
            exit 0
          fi
          git commit -m 'feat(ui): promote Exam Prep Practice and Tours as primary modes'
          git push origin HEAD:main
