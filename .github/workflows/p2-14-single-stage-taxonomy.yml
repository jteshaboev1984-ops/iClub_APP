name: P2-14 Single Stage Taxonomy Gate

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/*exam_prep_p2_14_*.sql'
      - 'supabase/tests/p2_14_single_stage_taxonomy_matrix.sql'
      - 'scripts/p2-14-single-stage-taxonomy-regression.cjs'
      - 'exam-prep/exam-prep-overview-placement.js'
      - '.github/workflows/p2-14-single-stage-taxonomy.yml'
  pull_request:
    paths:
      - 'supabase/migrations/*exam_prep_p2_14_*.sql'
      - 'supabase/tests/p2_14_single_stage_taxonomy_matrix.sql'
      - 'scripts/p2-14-single-stage-taxonomy-regression.cjs'
      - 'exam-prep/exam-prep-overview-placement.js'
      - '.github/workflows/p2-14-single-stage-taxonomy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-stage-taxonomy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Initialize diagnostics
        run: printf 'P2-14 C25 single Stage 0-6 taxonomy gate\n' > p214.log

      - name: Static non-destructive contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/p2-14-single-stage-taxonomy-regression.cjs
          node scripts/p2-14-single-stage-taxonomy-regression.cjs | tee -a p214.log

      - name: Bootstrap legacy and Supabase contract
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql 2>&1 | tee -a p214.log
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_03_ephemeral_legacy_helpers.sql 2>&1 | tee -a p214.log

      - name: Apply P0 Exam Prep foundation
        shell: bash
        run: |
          set -euo pipefail
          for stage in 04 05 06 07 08 09 10 11 12 13 15 16; do
            mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p0_${stage}_*.sql" | sort)
            test "${#files[@]}" -ge 1
            for f in "${files[@]}"; do
              echo "=== Applying $f ===" | tee -a p214.log
              psql -v ON_ERROR_STOP=1 -f "$f" >>p214.log 2>&1
            done
          done

      - name: Apply P1-01 through P1-03 progression foundation
        shell: bash
        run: |
          set -euo pipefail
          for stage in 01 02 03; do
            mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p1_${stage}_*.sql" | sort)
            test "${#files[@]}" -ge 1
            for f in "${files[@]}"; do
              echo "=== Applying $f ===" | tee -a p214.log
              psql -v ON_ERROR_STOP=1 -f "$f" >>p214.log 2>&1
            done
          done

      - name: Apply P2-14 single-taxonomy guard
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260909070000_exam_prep_p2_14_single_stage_taxonomy_guard_v1.sql 2>&1 | tee -a p214.log

      - name: Run single-taxonomy matrix
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p2_14_single_stage_taxonomy_matrix.sql 2>&1 | tee -a p214.log

      - name: Prove fail-closed baseline and zero synthetic residue
        shell: bash
        run: |
          set -euo pipefail
          users="$(psql -Atqc "select count(*) from auth.users where email like 'p214-%@invalid.example'")"
          public_users="$(psql -Atqc "select count(*) from public.users where first_name='P214' and last_name='Single Taxonomy'")"
          evidence="$(psql -Atqc "select count(*) from private.exam_prep_evidence_events")"
          state="$(psql -Atqc "select rollout_state||'|'||core_enabled||'|'||ai_enabled||'|'||mentor_enabled||'|'||kill_switch from private.exam_prep_feature_config where program_key='math_as_p1_p5'")"
          test "$users" = '0'
          test "$public_users" = '0'
          test "$evidence" = '0'
          test "$state" = 'off|false|false|false|true'
          echo 'P2-14 C25 single Stage 0-6 taxonomy gate: GREEN' | tee -a p214.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-14-single-stage-taxonomy-diagnostics
          path: p214.log
          if-no-files-found: error
          retention-days: 3
