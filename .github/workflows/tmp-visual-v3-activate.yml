name: TEMP Activate Visual Foundation v3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-visual-v3-activate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prepare tested live visual patch
        run: python3 .github/scripts/activate_visual_v3.py

      - name: Static boundary checks
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/visual_v3_live_regression.js
          node --check app.js
          grep -q '<body class="iclub-visual-v3">' index.html
          grep -q 'visual/iclub-visual-v3.css?v=v3foundation1' index.html
          grep -q 'data-tab="courses"' index.html
          ! grep -q 'data-tab="study"' index.html
          test "$(grep -o 'class="v3-shell-nav-icon"' index.html | wc -l | tr -d ' ')" = '4'
          test "$(grep -o 'class="v3-shell-icon"' index.html | wc -l | tr -d ' ')" = '3'
          test "$(grep -o 'tab_study:' i18n.js | wc -l | tr -d ' ')" = '3'
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = $'i18n.js\nindex.html\nvisual/iclub-visual-v3.css'

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run Visual v3 regression before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/visual-v3-activate-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          node .github/scripts/visual_v3_live_regression.js

      - name: Commit only tested visual files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html i18n.js visual/iclub-visual-v3.css
          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = $'i18n.js\nindex.html\nvisual/iclub-visual-v3.css'
          git commit -m 'feat(ui): activate Visual Foundation v3 shell'
          git push origin HEAD:main
