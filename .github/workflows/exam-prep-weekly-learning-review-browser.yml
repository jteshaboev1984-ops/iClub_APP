name: Exam Prep same-pack learning review browser acceptance (isolated)
on:
  pull_request:
    branches: [main]
    paths:
      - 'exam-prep/exam-prep-progress-ux-boot.js'
      - 'exam-prep/exam-prep-weekly-review-ui.js'
      - 'exam-prep/exam-prep-weekly-flow-adapter.js'
      - 'exam-prep/exam-prep-live.js'
      - 'scripts/weekly-flow-learning-review-browser.cjs'
      - 'scripts/weekly-flow-learning-review-race-browser.cjs'
      - 'scripts/weekly-flow-learning-review-two-tabs-browser.cjs'
      - '.github/workflows/exam-prep-weekly-learning-review-browser.yml'
  push:
    branches: ['fix/exam-prep-weekly-goal-flow-safe']
    paths:
      - 'exam-prep/exam-prep-progress-ux-boot.js'
      - 'exam-prep/exam-prep-weekly-review-ui.js'
      - 'exam-prep/exam-prep-weekly-flow-adapter.js'
      - 'exam-prep/exam-prep-live.js'
      - 'scripts/weekly-flow-learning-review-browser.cjs'
      - 'scripts/weekly-flow-learning-review-race-browser.cjs'
      - 'scripts/weekly-flow-learning-review-two-tabs-browser.cjs'
      - '.github/workflows/exam-prep-weekly-learning-review-browser.yml'
permissions:
  contents: read
jobs:
  isolated-learning-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and OFF-by-default bridge loading
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/weekly-flow-learning-review-browser.cjs
          node --check scripts/weekly-flow-learning-review-race-browser.cjs
          node --check scripts/weekly-flow-learning-review-two-tabs-browser.cjs
          node --check exam-prep/exam-prep-weekly-review-ui.js
          node --check exam-prep/exam-prep-progress-ux-boot.js
          grep -Fq 'await loadRequiredWeeklyReviewUi();' exam-prep/exam-prep-progress-ux-boot.js
          grep -Fq 'window.iClubExamPrepWeeklyFlowEnabled = false;' exam-prep/exam-prep-progress-ux-boot.js
          git diff --check
      - name: Install isolated Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Six native review journeys RU UZ EN phone and desktop, synthetic only
        run: node scripts/weekly-flow-learning-review-browser.cjs
      - name: Six review race recovery and cross-screen notice isolation journeys
        run: node scripts/weekly-flow-learning-review-race-browser.cjs
      - name: Six shared-server two-tab review and written acknowledgement loss journeys
        run: node scripts/weekly-flow-learning-review-two-tabs-browser.cjs
