name: P1-04 AI Source Pack Gate

on:
  push:
    branches:
      - main
    paths:
      - supabase/migrations/20260907103000_exam_prep_ai_initial_context_source_pack_v1.sql
      - supabase/tests/p1_04_ai_initial_source_pack_matrix.sql
      - .github/workflows/p1-04-ai-source-pack.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap minimum legacy/Supabase contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql

      - name: Apply Exam Prep P0 foundation
        shell: bash
        run: |
          set -euo pipefail
          for stage in 04 05 06 07 08 09 10 11 12 13 15 16; do
            mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p0_${stage}_*.sql" | sort)
            test "${#files[@]}" -ge 1
            for f in "${files[@]}"; do psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done
          done

      - name: Apply AI governance prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t p101 < <(find supabase/migrations -maxdepth 1 -type f -name '*exam_prep_p1_01_*.sql' | sort)
          test "${#p101[@]}" -ge 1
          for f in "${p101[@]}"; do psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done
          mapfile -t p104 < <(find supabase/migrations -maxdepth 1 -type f -name '*exam_prep_p1_04_*.sql' | sort)
          test "${#p104[@]}" -ge 2
          for f in "${p104[@]}"; do psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done

      - name: Apply initial governed AI source pack
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907103000_exam_prep_ai_initial_context_source_pack_v1.sql

      - name: Validate source-pack security and P1/P5 isolation
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_04_ai_initial_source_pack_matrix.sql

      - name: Static protected-content and authority checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c "'approved','original_iclub',true" supabase/migrations/20260907103000_exam_prep_ai_initial_context_source_pack_v1.sql)" -eq 12
          ! grep -qi 'correct_answer' supabase/migrations/20260907103000_exam_prep_ai_initial_context_source_pack_v1.sql
          ! grep -qi 'mark scheme' supabase/migrations/20260907103000_exam_prep_ai_initial_context_source_pack_v1.sql
          ! grep -qi 'update private.exam_prep_stage_states' supabase/migrations/20260907103000_exam_prep_ai_initial_context_source_pack_v1.sql
          ! grep -qi 'insert into private.exam_prep_evidence_events' supabase/migrations/20260907103000_exam_prep_ai_initial_context_source_pack_v1.sql
          grep -q "Paper 1 results never raise Paper 5 progress" supabase/migrations/20260907103000_exam_prep_ai_initial_context_source_pack_v1.sql
          grep -q "Результаты Paper 1 не повышают прогресс Paper 5" supabase/migrations/20260907103000_exam_prep_ai_initial_context_source_pack_v1.sql
          grep -q "Paper 1 natijalari Paper 5 progressini oshirmaydi" supabase/migrations/20260907103000_exam_prep_ai_initial_context_source_pack_v1.sql
