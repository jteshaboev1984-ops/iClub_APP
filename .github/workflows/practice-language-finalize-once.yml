name: One-shot Practice language cache and copy repair (draft only)
on:
  push:
    branches: ['fix/practice-language-preserve-history']
    paths: ['.github/workflows/practice-language-finalize-once.yml']
permissions:
  contents: write
jobs:
  patch-only:
    if: github.repository == 'jteshaboev1984-ops/iClub_APP' && github.ref == 'refs/heads/fix/practice-language-preserve-history' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/practice-language-preserve-history
      - name: Require exact pre-patch source blobs and isolated branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/practice-language-preserve-history
          test "$(git hash-object index.html)" = 9c60638077b40425439ec48698c80339c81e41bf
          test "$(git hash-object i18n.js)" = 64334d28fed3787042c9637b3db9eb0a6757db9a
          test "$(git hash-object scripts/practice-content-language-preservation.cjs)" = c77d36541dbc444378d0fd53e36cf9fa36ee153e
      - name: Fix registration copy and cache keys only, no SQL or live credentials
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          html=Path('index.html'); h=html.read_text()
          old='Важно: смена языка после регистрации сбросит прогресс.'
          new='Язык заданий можно изменить позже — результаты и ответы сохранятся.'
          assert h.count(old)==1
          h=h.replace(old,new)
          old_i18n='<script src="i18n.js"></script>'
          assert h.count(old_i18n)==1
          h=h.replace(old_i18n,'<script src="i18n.js?v=practicepreserve1"></script>')
          old_app='app.js?v=support4-p0legacysaveoff1-p014host1'
          assert h.count(old_app)==1
          h=h.replace(old_app,old_app+'-practicepreserve1')
          html.write_text(h)
          i18n=Path('i18n.js'); t=i18n.read_text()
          pairs=[
          ('Важно: смена языка после регистрации сбросит прогресс.',
           'Язык заданий можно изменить позже — результаты и ответы сохранятся.'),
          ('Muhim: ro‘yxatdan o‘tgandan so‘ng tilni o‘zgartirish progressni o‘chiradi.',
           'Savollar tilini keyin ham o‘zgartirishingiz mumkin — natijalar va javoblar saqlanadi.'),
          ('Important: changing the language after registration will reset progress.',
           'You can change the question language later without losing results or answers.')]
          for old,new in pairs:
              assert t.count(old)==1, 'Registration translation changed: '+old
              t=t.replace(old,new)
          i18n.write_text(t)
          script=Path('scripts/practice-content-language-preservation.cjs')
          code=script.read_text()
          anchor='async function exercise('
          assert code.count(anchor)==1
          supplement='''// Registration warning and cache keys must agree with non-destructive settings.
          const htmlSource = fs.readFileSync('index.html','utf8');
          assert.ok(htmlSource.includes('i18n.js?v=practicepreserve1'));
          assert.ok(htmlSource.includes('app.js?v=support4-p0legacysaveoff1-p014host1-practicepreserve1'));
          assert.ok(htmlSource.includes('Язык заданий можно изменить позже — результаты и ответы сохранятся.'));
          for (const old of [
            'Важно: смена языка после регистрации сбросит прогресс.',
            'Muhim: ro‘yxatdan o‘tgandan so‘ng tilni o‘zgartirish progressni o‘chiradi.',
            'Important: changing the language after registration will reset progress.'
          ]) assert.ok(!localization.includes(old) && !htmlSource.includes(old), 'Obsolete data-loss registration warning');
          for (const text of [
            'Язык заданий можно изменить позже — результаты и ответы сохранятся.',
            'Savollar tilini keyin ham o‘zgartirishingiz mumkin — natijalar va javoblar saqlanadi.',
            'You can change the question language later without losing results or answers.'
          ]) assert.ok(localization.includes(text), 'Registration translation missing: '+text);

          '''
          script.write_text(code.replace(anchor,supplement+anchor))
          PY
      - name: Syntax and seven isolated settings cases plus registration/cache assertions
        run: |
          set -euo pipefail
          node --check app.js
          node --check i18n.js
          node --check scripts/practice-content-language-preservation.cjs
          node scripts/practice-content-language-preservation.cjs
          git diff --check
      - name: Commit exactly three non-workflow files to isolated draft branch
        shell: bash
        run: |
          set -euo pipefail
          git add index.html i18n.js scripts/practice-content-language-preservation.cjs
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          test "$(git diff --cached --name-only)" = $'i18n.js\nindex.html\nscripts/practice-content-language-preservation.cjs'
          git config user.name 'iClub guarded CI patch'
          git config user.email 'iclub-ci-patch@users.noreply.github.com'
          git commit -m 'fix: refresh safe language assets and remove false registration reset warning'
          git push origin HEAD:refs/heads/fix/practice-language-preserve-history
