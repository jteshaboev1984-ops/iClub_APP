name: TEMP Exam Prep Persistence Continuity v1

on:
  push:
    branches:
      - exam-prep-persistence-continuity-v1
    paths:
      - '.github/workflows/tmp-exam-prep-persistence-continuity-v1.yml'
      - '.github/scripts/tmp_exam_prep_persistence_continuity_v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persistence-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply continuity patch
        run: python3 .github/scripts/tmp_exam_prep_persistence_continuity_v1.py

      - name: Static safety checks
        run: |
          set -euo pipefail
          git diff --check
          node --check exam-prep/exam-prep-api.js
          node --check exam-prep/exam-prep-live.js
          node --check exam-prep/exam-prep-profile-completeness.js
          node --check .github/scripts/p0_17_live_diagnostic_regression.js
          node --check .github/scripts/exam_prep_persistence_continuity_regression.js
          node scripts/p2-05-profile-completeness-regression.cjs
          grep -q 'exam-prep-live.js?v=p019timed2' exam-prep/exam-prep-api.js
          grep -q 'exam-prep-profile-completeness.js?v=p205profile2' exam-prep/exam-prep-api.js
          ! grep -q 'localStorage' exam-prep/exam-prep-profile-completeness.js
          ! grep -q 'sessionStorage' exam-prep/exam-prep-profile-completeness.js
          ! grep -qiE 'delete[[:space:]]+from|truncate[[:space:]]+|drop[[:space:]]+table' exam-prep/exam-prep-profile-completeness.js

      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run persistence and host regressions
        run: |
          set -euo pipefail
          node .github/scripts/exam_prep_persistence_continuity_regression.js
          node .github/scripts/p0_17_live_diagnostic_regression.js
          node .github/scripts/p0_14_host_regression.js
          node .github/scripts/p0_22_live_view_coexistence_regression.js
          node .github/scripts/p2_09_exam_map_ui_regression.js

      - name: Commit tested continuity fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-prep/exam-prep-api.js exam-prep/exam-prep-live.js exam-prep/exam-prep-profile-completeness.js .github/scripts/p0_17_live_diagnostic_regression.js scripts/p2-05-profile-completeness-regression.cjs
          if git diff --cached --quiet; then
            echo 'No staged continuity changes.'
            exit 0
          fi
          git commit -m 'fix(exam-prep): restore saved plan and diagnostic continuity'
          git push origin HEAD:exam-prep-persistence-continuity-v1
