name: UX531 accepted B00 + registered learner integration

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'i18n.js'
      - 'visual/iclub-academy-v55-shell-b01.css'
      - 'visual/iclub-academy-ux531-b02b03.css'
      - 'qa/ux531-registration-combination.cjs'
      - 'qa/ux531-registered-navigation-e2e.cjs'
      - 'registration-b00-ui.js'
      - 'visual/iclub-registration-b00.css'
      - '.github/workflows/ux531-registration-combination.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-registration-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify approved registration SHA and materialize B00 in ephemeral runner only
        shell: bash
        run: |
          set -euo pipefail
          B00_SHA=8a1aab29a5cb8924efdbe660f364d3846d864ff2
          git fetch --no-tags --depth=1 origin "$B00_SHA"
          # Never mutate checked-out approved B00 assets; prove exact SHA equality.
          for filename in registration-b00-ui.js visual/iclub-registration-b00.css qa/registration-b00-browser.cjs qa/registration-b00-real-app-mocked-e2e.cjs; do
            git show "$B00_SHA:$filename" | cmp - "$filename"
          done
          grep -q 'Keeps the ORIGINAL' registration-b00-ui.js
          grep -q '#view-registration.reg-b00-enhanced' visual/iclub-registration-b00.css
      - name: Check syntax and install isolated Chromium
        shell: bash
        run: |
          node --check qa/ux531-registration-combination.cjs
          node --check qa/registration-b00-browser.cjs
          node --check qa/registration-b00-real-app-mocked-e2e.cjs
          node --check qa/ux531-registered-navigation-e2e.cjs
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Accepted B00 registration UI against CURRENT Academy OS source
        shell: bash
        run: |
          node qa/ux531-registration-combination.cjs
          node qa/registration-b00-browser.cjs
      # The archived B00 runtime test expects non-school subjects=0.
      # The architect's newer requirement explicitly supersedes this ONE
      # behavioural assertion, but the approved B00 visual files/test
      # remain SHA-pinned and intact. The current-source UX integration
      # below covers school + non-school, including the new Study minimum.
      - name: Registered learner Home / Subjects / Subject Hub integration
        shell: bash
        run: node qa/ux531-registered-navigation-e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux531-b00-accepted-registration-combined-shot
          path: ux531-registration-compat-screens/*.png
          if-no-files-found: ignore
          retention-days: 7
