name: P0-14 Apply Host Bridge

on:
  push:
    branches:
      - exam-prep-p0-host
    paths:
      - .p0-14-host-bridge-run

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exam-prep-p0-host
          fetch-depth: 0

      - name: Apply guarded patch
        run: python .github/scripts/p0_14_apply_host_bridge.py

      - name: Static safety checks
        run: |
          node --check app.js
          node --check exam-prep/exam-prep-api.js
          node --check exam-prep/exam-prep-host.js
          grep -q "connect-src 'none'" exam-prep-preview.html
          ! grep -q "localStorage" exam-prep/exam-prep-api.js
          ! grep -q "localStorage" exam-prep/exam-prep-host.js
          ! grep -q "\.from(" exam-prep/exam-prep-api.js
          ! grep -q "\.from(" exam-prep/exam-prep-host.js
          ! grep -q "iclub_state_v1" exam-prep/exam-prep-api.js
          ! grep -q "iclub_state_v1" exam-prep/exam-prep-host.js
          git diff --check

      - name: Commit guarded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat(exam-prep): add P0-14 minimal host bridge"
          git push origin HEAD:exam-prep-p0-host
