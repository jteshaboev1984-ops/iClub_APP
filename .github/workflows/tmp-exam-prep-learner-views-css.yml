name: TEMP Exam Prep Learner Views CSS Gate

on:
  push:
    branches:
      - exam-prep-css-threshold-v1
    paths:
      - .github/workflows/tmp-exam-prep-learner-views-css.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exam-prep-css-threshold-v1
          fetch-depth: 0

      - name: Stage centralized learner views styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('exam-prep/exam-prep-learner-views.js')
          js = js_path.read_text()
          original = js
          js, n = re.subn(r'\n  function ensureStyle\(\) \{.*?\n  \}\n\n  function shell\(', '\n\n  function shell(', js, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one ensureStyle block, removed {n}')
          js = js.replace('busy = true; activeLanguage = detectLanguage(); ensureStyle(); renderLoading', 'busy = true; activeLanguage = detectLanguage(); renderLoading')
          js = js.replace('busy = true; ensureStyle(); renderLoading', 'busy = true; renderLoading')
          js = js.replace('activeLanguage = detectLanguage(); ensureStyle(); const c = copy();', 'activeLanguage = detectLanguage(); const c = copy();')
          if 'ensureStyle(' in js or 'ep-learner-views-style' in js or 'document.createElement("style")' in js:
              raise SystemExit('Runtime learner-view style injection remains')
          if js == original:
              raise SystemExit('Learner views JS did not change')
          js_path.write_text(js)

          css_path = Path('exam-prep/exam-prep-host.css')
          css = css_path.read_text()
          marker = '/* ===== EXAM PREP CENTRALIZED LEARNER VIEWS v1 ===== */'
          if marker in css:
              raise SystemExit('Learner views CSS marker already exists')
          css += r'''

/* ===== EXAM PREP CENTRALIZED LEARNER VIEWS v1 ===== */
#exam-prep-host-root .ep-views-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 2px;
}

#exam-prep-host-root .ep-views-btn {
  border: 1px solid rgba(127,127,127,.28);
  border-radius: 10px;
  padding: 8px 10px;
  background: transparent;
  color: inherit;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

#exam-prep-host-root .ep-views-btn.primary {
  background: #111827;
  color: #fff;
  border-color: #111827;
}

#exam-prep-host-root .ep-views-btn:disabled {
  opacity: .55;
  cursor: default;
}

#exam-prep-host-root .ep-views-shell {
  display: grid;
  gap: 12px;
}

#exam-prep-host-root .ep-views-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}

#exam-prep-host-root .ep-views-title {
  font-size: 20px;
  font-weight: 800;
}

#exam-prep-host-root .ep-views-sub {
  font-size: 12px;
  opacity: .72;
  margin-top: 3px;
}

#exam-prep-host-root .ep-views-card {
  display: grid;
  gap: 10px;
  border: 1px solid rgba(127,127,127,.22);
  border-radius: 14px;
  padding: 13px;
  background: rgba(127,127,127,.035);
}

#exam-prep-host-root .ep-views-summary {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 8px;
}

#exam-prep-host-root .ep-views-stat {
  display: grid;
  gap: 3px;
  border: 1px solid rgba(127,127,127,.16);
  border-radius: 10px;
  padding: 9px;
}

#exam-prep-host-root .ep-views-stat span {
  font-size: 11px;
  opacity: .72;
}

#exam-prep-host-root .ep-views-stat strong {
  font-size: 17px;
}

#exam-prep-host-root .ep-views-area {
  display: grid;
  gap: 8px;
}

#exam-prep-host-root .ep-views-area-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
}

#exam-prep-host-root .ep-views-progress {
  height: 6px;
  border-radius: 999px;
  background: rgba(127,127,127,.16);
  overflow: hidden;
}

#exam-prep-host-root .ep-views-progress > span {
  display: block;
  height: 100%;
  background: currentColor;
  opacity: .7;
}

#exam-prep-host-root .ep-views-skill {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
  text-align: left;
  border: 0;
  border-top: 1px solid rgba(127,127,127,.14);
  padding: 9px 0 0;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

#exam-prep-host-root .ep-views-skill-meta {
  font-size: 11px;
  opacity: .7;
}

#exam-prep-host-root .ep-views-badge {
  font-size: 11px;
  font-weight: 700;
  border: 1px solid rgba(127,127,127,.22);
  border-radius: 999px;
  padding: 4px 7px;
  white-space: nowrap;
}

#exam-prep-host-root .ep-views-list {
  display: grid;
  gap: 7px;
}

#exam-prep-host-root .ep-views-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: start;
  padding: 9px;
  border-radius: 10px;
  background: rgba(127,127,127,.06);
}

#exam-prep-host-root .ep-views-row small {
  opacity: .7;
}

#exam-prep-host-root .ep-views-note {
  padding: 10px;
  border-radius: 10px;
  background: rgba(127,127,127,.08);
  font-size: 12px;
  line-height: 1.45;
}

#exam-prep-host-root .ep-views-error {
  padding: 10px;
  border-radius: 10px;
  background: rgba(180,30,30,.12);
  font-size: 13px;
}

@media (max-width: 680px) {
  #exam-prep-host-root .ep-views-top {
    display: grid;
  }

  #exam-prep-host-root .ep-views-summary {
    grid-template-columns: 1fr;
  }

  #exam-prep-host-root .ep-views-skill,
  #exam-prep-host-root .ep-views-row {
    grid-template-columns: 1fr;
  }

  #exam-prep-host-root .ep-views-actions .ep-views-btn {
    flex: 1 1 auto;
  }
}
'''
          css_path.write_text(css)

          reg_path = Path('.github/scripts/p0_20_live_tracker_corrections_regression.js')
          reg = reg_path.read_text()
          anchor = "  await page.goto('http://iclub.test/');\n"
          if anchor not in reg:
              raise SystemExit('p0_20 goto anchor missing')
          reg = reg.replace(anchor, anchor + "  await page.addStyleTag({ path: path.resolve('exam-prep/exam-prep-host.css') });\n", 1)
          assertion_anchor = "  assert(visible.includes('1 / 45'), 'P1 tracker must preserve the 45-skill denominator');\n"
          if assertion_anchor not in reg:
              raise SystemExit('p0_20 tracker assertion anchor missing')
          extra = """  const presentation = await page.evaluate(() => {\n    const root = document.querySelector('#exam-prep-host-root');\n    const shell = root.querySelector('.ep-views-shell');\n    const summary = root.querySelector('.ep-views-summary');\n    const card = root.querySelector('.ep-views-card');\n    return {\n      runtimeStyle: Boolean(document.querySelector('#ep-learner-views-style')),\n      shellDisplay: getComputedStyle(shell).display,\n      summaryColumns: getComputedStyle(summary).gridTemplateColumns,\n      cardRadius: getComputedStyle(card).borderRadius,\n      rootWidth: root.getBoundingClientRect().width,\n      scrollWidth: root.scrollWidth\n    };\n  });\n  assert(presentation.runtimeStyle === false, 'Learner views must not inject a runtime style tag');\n  assert(presentation.shellDisplay === 'grid', 'Centralized learner-view CSS did not apply');\n  assert(presentation.cardRadius === '14px', 'Learner-view card geometry changed during CSS centralization');\n  assert(presentation.scrollWidth <= presentation.rootWidth + 1, `Learner views overflow: ${presentation.scrollWidth} > ${presentation.rootWidth}`);\n"""
          reg = reg.replace(assertion_anchor, assertion_anchor + extra, 1)
          reg_path.write_text(reg)

          wf_path = Path('.github/workflows/p0-14-host-regression.yml')
          wf = wf_path.read_text()
          guard = "          ! grep -q '\\\\.from(' exam-prep/exam-prep-learner-views.js\n"
          if guard not in wf:
              raise SystemExit('p0-14 learner views guard anchor missing')
          checks = "          ! grep -q 'ep-learner-views-style' exam-prep/exam-prep-learner-views.js\n          ! grep -q 'document.createElement(\"style\")' exam-prep/exam-prep-learner-views.js\n          grep -q 'EXAM PREP CENTRALIZED LEARNER VIEWS v1' exam-prep/exam-prep-host.css\n"
          wf = wf.replace(guard, guard + checks, 1)
          wf_path.write_text(wf)
          PY

      - name: Static safety checks
        run: |
          set -euo pipefail
          node --check exam-prep/exam-prep-learner-views.js
          node --check .github/scripts/p0_20_live_tracker_corrections_regression.js
          ! grep -q 'ep-learner-views-style' exam-prep/exam-prep-learner-views.js
          ! grep -q 'document.createElement("style")' exam-prep/exam-prep-learner-views.js
          ! grep -q 'localStorage' exam-prep/exam-prep-learner-views.js
          ! grep -q '\.from(' exam-prep/exam-prep-learner-views.js
          grep -q 'EXAM PREP CENTRALIZED LEARNER VIEWS v1' exam-prep/exam-prep-host.css

      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Learner views regression
        run: node .github/scripts/p0_20_live_tracker_corrections_regression.js

      - name: Combined learner views regression
        run: node .github/scripts/p0_22_live_view_coexistence_regression.js

      - name: Host bridge regression
        run: node .github/scripts/p0_14_host_regression.js

      - name: Commit only after green
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exam-prep/exam-prep-learner-views.js exam-prep/exam-prep-host.css .github/scripts/p0_20_live_tracker_corrections_regression.js .github/workflows/p0-14-host-regression.yml
          git diff --cached --check
          git commit -m "refactor(ui): centralize Exam Prep learner view styles"
          git push origin HEAD:exam-prep-css-threshold-v1
