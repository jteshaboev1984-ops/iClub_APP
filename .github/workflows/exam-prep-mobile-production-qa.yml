name: Exam Prep Mobile Production QA (Latest)

on:
  pull_request:
    paths:
      - '.github/scripts/exam_prep_mobile_production_qa.js'
      - '.github/workflows/exam-prep-mobile-production-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate test script
        run: node --check .github/scripts/exam_prep_mobile_production_qa.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run production mobile QA
        env:
          ICLUB_BASE_URL: https://i-club-app.vercel.app/
          ICLUB_MOBILE_QA_OUT: mobile-production-qa-artifacts
        run: node .github/scripts/exam_prep_mobile_production_qa.js

      - name: Upload mobile production QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-prep-mobile-production-qa
          path: mobile-production-qa-artifacts/
          retention-days: 7
