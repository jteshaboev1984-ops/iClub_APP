name: Exam Prep Wave 1 UX Hotfix Gate

on:
  pull_request:
    paths:
      - 'exam-prep/exam-prep-materials.js'
      - 'exam-prep/exam-prep-wave1-ux.js'
      - 'exam-prep/exam-prep-wave1-ux.css'
      - 'exam-prep/exam-prep-learner-flow-ux.js'
      - 'exam-prep/exam-prep-learner-flow-ux.css'
      - 'exam-prep/exam-prep-interaction-polish.js'
      - 'exam-prep/exam-prep-interaction-polish.css'
      - '.github/scripts/exam_prep_wave1_ux_regression.js'
      - '.github/scripts/exam_prep_flow_clarity_regression.js'
      - '.github/scripts/exam_prep_interaction_polish_regression.js'
      - '.github/workflows/exam-prep-wave1-ux-hotfix.yml'
  push:
    branches:
      - main
    paths:
      - 'exam-prep/exam-prep-materials.js'
      - 'exam-prep/exam-prep-wave1-ux.js'
      - 'exam-prep/exam-prep-wave1-ux.css'
      - 'exam-prep/exam-prep-learner-flow-ux.js'
      - 'exam-prep/exam-prep-learner-flow-ux.css'
      - 'exam-prep/exam-prep-interaction-polish.js'
      - 'exam-prep/exam-prep-interaction-polish.css'
      - '.github/scripts/exam_prep_wave1_ux_regression.js'
      - '.github/scripts/exam_prep_flow_clarity_regression.js'
      - '.github/scripts/exam_prep_interaction_polish_regression.js'
      - '.github/workflows/exam-prep-wave1-ux-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave1-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static safety checks
        run: |
          node --check exam-prep/exam-prep-materials.js
          node --check exam-prep/exam-prep-wave1-ux.js
          node --check exam-prep/exam-prep-learner-flow-ux.js
          node --check exam-prep/exam-prep-interaction-polish.js
          node --check .github/scripts/exam_prep_wave1_ux_regression.js
          node --check .github/scripts/exam_prep_flow_clarity_regression.js
          node --check .github/scripts/exam_prep_interaction_polish_regression.js
          grep -q 'const VERSION = "wave1ux3"' exam-prep/exam-prep-wave1-ux.js
          grep -q 'const VERSION = "flowux3"' exam-prep/exam-prep-learner-flow-ux.js
          grep -q 'const VERSION = "polish4"' exam-prep/exam-prep-interaction-polish.js
          grep -q 'exam-prep-wave1-ux.js?v=wave1ux3' exam-prep/exam-prep-materials.js
          grep -q 'exam-prep-wave1-ux.css?v=wave1ux3' exam-prep/exam-prep-materials.js
          grep -q 'exam-prep-learner-flow-ux.js?v=flowux3' exam-prep/exam-prep-materials.js
          grep -q 'exam-prep-learner-flow-ux.css?v=flowux3' exam-prep/exam-prep-materials.js
          grep -q 'exam-prep-interaction-polish.js?v=polish4' exam-prep/exam-prep-materials.js
          grep -q 'exam-prep-interaction-polish.css?v=polish3' exam-prep/exam-prep-materials.js
          grep -q 'same-idempotency-key' .github/scripts/exam_prep_wave1_ux_regression.js
          grep -q 'topbar back from a weekly plan must follow its hidden logical origin and stay inside Exam Prep' .github/scripts/exam_prep_wave1_ux_regression.js
          grep -q 'correction CTA must route to and start the matching governed weekly-plan item' .github/scripts/exam_prep_flow_clarity_regression.js
          grep -q 'answer submit must keep the question visually stable while saving' .github/scripts/exam_prep_interaction_polish_regression.js
          grep -q 'the previous Exam Prep screen must remain mounted while the destination data is loading' .github/scripts/exam_prep_interaction_polish_regression.js
          grep -q 'document.getElementById("toast")' exam-prep/exam-prep-interaction-polish.js
          ! grep -q 'ep-flow-answer-toast' exam-prep/exam-prep-interaction-polish.js
          ! grep -q 'ep-flow-answer-toast' exam-prep/exam-prep-interaction-polish.css
          ! grep -q 'ep-flow-screen-enter' exam-prep/exam-prep-interaction-polish.js
          ! grep -q 'ep-flow-screen-enter' exam-prep/exam-prep-interaction-polish.css
          ! grep -q '\.from(' exam-prep/exam-prep-wave1-ux.js
          ! grep -q 'localStorage' exam-prep/exam-prep-wave1-ux.js
          ! grep -q 'correct_answer' exam-prep/exam-prep-wave1-ux.js
          ! grep -q 'service_role' exam-prep/exam-prep-wave1-ux.js
          ! grep -q '\.from(' exam-prep/exam-prep-learner-flow-ux.js
          ! grep -q 'localStorage' exam-prep/exam-prep-learner-flow-ux.js
          ! grep -q 'correct_answer' exam-prep/exam-prep-learner-flow-ux.js
          ! grep -q 'service_role' exam-prep/exam-prep-learner-flow-ux.js
          ! grep -q '\.from(' exam-prep/exam-prep-interaction-polish.js
          ! grep -q 'localStorage' exam-prep/exam-prep-interaction-polish.js
          ! grep -q 'correct_answer' exam-prep/exam-prep-interaction-polish.js
          ! grep -q 'service_role' exam-prep/exam-prep-interaction-polish.js

      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Browser-isolated Wave 1 stability and UX regression
        run: node .github/scripts/exam_prep_wave1_ux_regression.js

      - name: Browser-isolated learner flow clarity regression
        run: node .github/scripts/exam_prep_flow_clarity_regression.js

      - name: Browser-isolated interaction polish regression
        run: node .github/scripts/exam_prep_interaction_polish_regression.js