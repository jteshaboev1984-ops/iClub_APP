name: iClub AI v2.1 Real Interface Protected Preview QA
on:
  push:
    branches: [qa/fix-exam-prep-subject-isolation-20261011]
    paths:
      - 'qa/ai-real-ui-*'
      - '.github/workflows/iclub-ai-real-ui-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-real-ui-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and read-only source contract
        run: |
          node --check qa/ai-real-ui-controller.js
          node --check qa/ai-real-ui-shell.js
          node --check qa/ai-real-ui-browser.cjs
          node --test qa/ai-real-ui-qa.test.cjs
      - name: Real Chromium 320/390/desktop synthetic journey
        run: |
          command -v google-chrome || command -v chromium
          node qa/ai-real-ui-browser.cjs
