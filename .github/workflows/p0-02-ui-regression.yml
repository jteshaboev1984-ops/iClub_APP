name: P0-02 UI regression

on:
  push:
    branches:
      - iclub-v3-implementation
    paths:
      - .github/workflows/p0-02-ui-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@v4
        with:
          ref: iclub-v3-implementation

      - name: Verify expected revision markers
        run: |
          grep -q 'security/legacy-assessment-safe-api.js?v=p002v4tour1' index.html
          grep -q 'app.js?v=support4-p0tourwrites1' index.html
          grep -q 'ratings_cache_safe_v4' app.js
          grep -q 'tour_attempts_leaderboard_safe_v4' app.js
          ! grep -q '\.from("ratings_cache")' app.js
          ! grep -q 'users(first_name' app.js
          node --check app.js
          node --check security/legacy-assessment-safe-api.js
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { range } from './scripts/p0-02-aux-patcher.mjs';
          const app = fs.readFileSync('app.js','utf8');
          const fn = range(app,'createTourAttempt').text;
          for (const banned of ['.from("tour_attempts")','.insert(','.delete(','.update(']) {
            if (fn.includes(banned)) throw new Error(`legacy Tour creator still contains ${banned}`);
          }
          const calls = (app.match(/\bcreateTourAttempt\s*\(/g) || []).length;
          if (calls !== 1) throw new Error(`createTourAttempt is not declaration-only: ${calls}`);
          NODE

      - name: Install Chromium harness
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/iclub-http.log 2>&1 &
          echo $! >/tmp/iclub-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/iclub-http.log
          exit 1

      - name: Run browser smoke regression
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            const pageErrors = [];
            const localRequestFailures = [];
            page.on('pageerror', e => pageErrors.push(String(e?.stack || e?.message || e)));
            page.on('requestfailed', req => {
              try {
                const u = new URL(req.url());
                if (u.hostname === '127.0.0.1' || u.hostname === 'localhost') {
                  localRequestFailures.push(`${req.method()} ${req.url()} :: ${req.failure()?.errorText || 'failed'}`);
                }
              } catch {}
            });

            const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            assert(response && response.ok(), `root response not OK: ${response?.status()}`);
            await page.waitForTimeout(5000);

            const result = await page.evaluate(() => ({
              bodyTextLen: (document.body?.innerText || '').trim().length,
              hasApp: !!document.querySelector('#app'),
              hasActiveView: !!document.querySelector('.view.is-active'),
              scripts: Array.from(document.scripts).map(s => s.getAttribute('src') || ''),
              safeApi: {
                root: typeof window.iclubSafeAssessment === 'object' && !!window.iclubSafeAssessment,
                practice: typeof window.iclubSafeAssessment?.practice === 'object' && !!window.iclubSafeAssessment?.practice,
                drill: typeof window.iclubSafeAssessment?.practice?.drill === 'object' && !!window.iclubSafeAssessment?.practice?.drill,
                practiceStart: typeof window.iclubSafeAssessment?.practice?.start === 'function',
                practiceReview: typeof window.iclubSafeAssessment?.practice?.review === 'function',
                tour: typeof window.iclubSafeAssessment?.tour === 'object' && !!window.iclubSafeAssessment?.tour,
                tourPreflight: typeof window.iclubSafeAssessment?.tour?.preflight === 'function',
                tourStart: typeof window.iclubSafeAssessment?.tour?.start === 'function',
                tourQuestions: typeof window.iclubSafeAssessment?.tour?.questions === 'function',
                tourSubmit: typeof window.iclubSafeAssessment?.tour?.submit === 'function',
                tourFinalize: typeof window.iclubSafeAssessment?.tour?.finalize === 'function',
                tourReview: typeof window.iclubSafeAssessment?.tour?.review === 'function'
              }
            }));

            assert(result.bodyTextLen > 20, `page appears blank: bodyTextLen=${result.bodyTextLen}`);
            assert(result.hasApp, '#app missing');
            assert(result.hasActiveView, 'no active app view');
            assert(result.scripts.some(x => x.includes('security/legacy-assessment-safe-api.js?v=p002v4tour1')), 'safe API script cache key missing in DOM');
            assert(result.scripts.some(x => x.includes('app.js?v=support4-p0tourwrites1')), 'app cache key missing in DOM');
            assert(result.safeApi.root && result.safeApi.practice && result.safeApi.drill, 'safe Practice/drill API not exposed');
            assert(result.safeApi.practiceStart && result.safeApi.practiceReview, 'safe Practice start/review API missing');
            assert(result.safeApi.tour, 'safe Tour API not exposed');
            assert(result.safeApi.tourPreflight && result.safeApi.tourStart && result.safeApi.tourQuestions, 'safe Tour start path missing');
            assert(result.safeApi.tourSubmit && result.safeApi.tourFinalize && result.safeApi.tourReview, 'safe Tour submit/finalize/review path missing');
            assert(pageErrors.length === 0, `uncaught page errors: ${JSON.stringify(pageErrors)}`);
            assert(localRequestFailures.length === 0, `local asset request failures: ${JSON.stringify(localRequestFailures)}`);

            await page.screenshot({ path: 'artifacts/p0-02-ui-regression.png', fullPage: true });
            console.log(JSON.stringify({ ok: true, ...result, pageErrors, localRequestFailures }, null, 2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload regression screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-02-ui-regression
          path: artifacts/p0-02-ui-regression.png
          if-no-files-found: ignore
