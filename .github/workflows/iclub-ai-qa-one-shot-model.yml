name: iClub AI QA one real provider reply - isolated one shot
on:
  push:
    branches: [qa/iclub-ai-layer-v21-20261012]
    paths:
      - '.github/workflows/iclub-ai-qa-one-shot-model.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-real-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CI: 'true'
    steps:
      - name: Check out QA-only harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One synthetic Auth and at most one funded model reply
        run: node qa/ai-v21-live-one-shot-smoke.cjs
