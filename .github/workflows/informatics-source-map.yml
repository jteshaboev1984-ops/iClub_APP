name: Informatics source map

on:
  push:
    branches: [informatics-academic-audit]

permissions:
  contents: write

jobs:
  map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: informatics-academic-audit
          fetch-depth: 0
      - name: Extract chapter outlines and term evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl -L --fail --retry 3 \
            'https://mmmduffgpvwjdpruzikw.supabase.co/storage/v1/object/public/books/CS%20book%20%282%29.pdf' \
            -o /tmp/csbook.pdf
          pdftotext -layout /tmp/csbook.pdf /tmp/csbook.txt
          python - <<'PY'
          from pathlib import Path
          import re
          raw=Path('/tmp/csbook.txt').read_text(encoding='utf-8',errors='replace')
          pages=raw.split('\f')
          chapters={
            1:'Data representation',2:'Data transmission',3:'Hardware',4:'Software',
            5:'The internet and its uses',6:'Automated and emerging technologies',
            7:'Algorithm design and problem solving',8:'Programming',9:'Databases',10:'Boolean logic'
          }
          out=['COMPUTER SCIENCE SOURCE MAP','']
          for no,title in chapters.items():
              candidates=[]
              pat=re.compile(rf'\b{no}\s+{re.escape(title)}\b',re.I)
              for pno,page in enumerate(pages,1):
                  if pat.search(page): candidates.append(pno)
              start=None
              for pno in candidates:
                  low=pages[pno-1].lower()
                  if 'in this chapter' in low or 'you will learn about' in low:
                      start=pno; break
              if start is None and candidates: start=candidates[-1]
              out.append(f'\n## CHAPTER {no}: {title} — PDF page {start}; candidates={candidates[:8]}')
              if start:
                  text=' '.join(pages[start-1].split())
                  out.append(text[:8000])
          terms=['stack','queue','linked list','binary search tree','bubble sort','recursion','by reference','cloud computing','elastic scaling','deadlock','page fault','data minimisation','purpose limitation','SQL injection','parameterised query','supervised learning','confusion matrix','role-based access control','least privilege','ransomware','checksum','digital currency','expert system','machine learning','neural network','robotics','actuator','sensor']
          out.append('\n## TERM EVIDENCE')
          for term in terms:
              hits=[]
              for pno,page in enumerate(pages,1):
                  idx=page.lower().find(term.lower())
                  if idx>=0:
                      context=' '.join(page[max(0,idx-250):idx+700].split())
                      hits.append(f'PDF {pno}: {context}')
                      if len(hits)>=3: break
              out.append(f'\n### {term}: {len(hits)} hit(s) shown')
              out.extend(hits)
          Path('docs/informatics-source-map.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit report and remove workflow
        run: |
          rm -f .github/workflows/informatics-source-map.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Informatics textbook source map'
          git push origin HEAD:informatics-academic-audit
