name: Mathematics P1/P5 v2 Package 0 isolated cleanup guard

on:
  pull_request:
    paths:
      - 'supabase/tests/p1p5_v2_package0_*'
      - 'supabase/tests/p1p5_v2_package0_epoch_one_shot_disposable_only.sql'
      - 'scripts/p1p5-v2-package0-scope-guard.cjs'
      - 'scripts/p1p5-v2-package0-build-combined-probe.cjs'
      - 'scripts/p1p5-v2-package0-signed-old-epoch-http.cjs'
      - 'supabase/tests/p1p5_v2_package0_future_state_overlay_disposable.sql'
      - '.github/workflows/p1p5-v2-package0-cleanup-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-cleanup-rehearsal:
    name: Readonly guard and disposable PostgreSQL 17 FK rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: iclub_p1p5_package0_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iclub_p1p5_package0_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated_test_only
      PGDATABASE: iclub_p1p5_package0_test
    steps:
      - uses: actions/checkout@v4
      - name: Validate readonly production-audit scripts and 32-table provisional scope
        run: node scripts/p1p5-v2-package0-scope-guard.cjs
      - name: P0-10 static combined SQL dollar-quote and scope integrity
        env:
          P1P5_E2E_ISOLATED: 'true'
          PGDATABASE: postgres # script assembles text only; no DB connection in this step
        run: |
          set -euo pipefail
          dir="$(mktemp -d /tmp/p0-10-XXXXXX)"
          trap 'rm -rf "$dir"' EXIT
          node --check scripts/p1p5-v2-package0-build-combined-probe.cjs
          node scripts/p1p5-v2-package0-build-combined-probe.cjs "$dir/combined.sql"
          grep -Fq 'DO $' "$dir/combined.sql"
          ! grep -Eq '^DO \$' "$dir/combined.sql"
          echo "PASS: original SQL DO dollar quoting preserved and future-state test assembled"
      - name: Run isolated cycle, retained-Mentor blocker and rollback transaction
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p1p5_v2_package0_cleanup_isolated_fk_rehearsal.sql
      - name: P0-09 isolated one-shot epoch authorization and replay/rollback matrix
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p1p5_v2_package0_epoch_one_shot_disposable_only.sql
      - name: Prove synthetic schema fully rolled back
        run: |
          test "$(psql -At -c "SELECT count(*) FROM pg_namespace WHERE nspname='p1p5_package0_isolated';")" = "0"
          echo "PASS: disposable PostgreSQL has no Package-0 rehearsal schema"
