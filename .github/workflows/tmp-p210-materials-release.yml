name: TEMP P2-10 Materials Library Cache Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-p210-materials-release.yml'

permissions:
  contents: write

jobs:
  release-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch exactly one Exam Prep API cache key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old = 'exam-prep/exam-prep-api.js?v=p209map1'
          new = 'exam-prep/exam-prep-api.js?v=p210materials1'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one old cache key, found {count}')
          p.write_text(text.replace(old, new, 1))
          PY
          grep -q 'exam-prep/exam-prep-api.js?v=p210materials1' index.html
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'index.html'
          git diff --check

      - name: Static safety checks
        shell: bash
        run: |
          set -euo pipefail
          node --check exam-prep/exam-prep-api.js
          node --check exam-prep/exam-prep-materials.js
          node --check .github/scripts/p2_10_materials_ui_regression.js
          node --check .github/scripts/p0_14_legacy_off_regression.js
          grep -q 'exam-prep-materials.js?v=p210materials1' exam-prep/exam-prep-api.js
          ! grep -q '\.from(' exam-prep/exam-prep-materials.js
          ! grep -q 'localStorage' exam-prep/exam-prep-materials.js
          ! grep -q 'iclub_state_v1' exam-prep/exam-prep-materials.js
          ! grep -q 'correct_answer' exam-prep/exam-prep-materials.js
          ! grep -q 'source_level' exam-prep/exam-prep-materials.js
          ! grep -q 'rights_status' exam-prep/exam-prep-materials.js

      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Governed Materials Library browser regression
        run: node .github/scripts/p2_10_materials_ui_regression.js

      - name: Start local app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p210-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p210-http.log
          exit 1

      - name: Legacy OFF browser smoke with new cache key
        run: node .github/scripts/p0_14_legacy_off_regression.js

      - name: Commit tested cache bump only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'index.html'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(exam-prep): release P2-10 Materials Library cache'
          git push origin HEAD:main
