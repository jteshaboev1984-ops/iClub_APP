name: UX531 Academy OS B01-B08 full-screen safety

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'i18n.js'
      - 'visual/iclub-academy-v55-shell-b01.css'
      - 'visual/iclub-academy-ux531-b02b03.css'
      - 'visual/iclub-academy-ux531-b04b08.css'
      - 'visual/iclub-academy-ux531-interactions.js'
      - 'qa/ux531-academy-ui-parity.cjs'
      - 'qa/ux531-academy-browser.cjs'
      - 'qa/ux531-academy-all-screens.cjs'
      - 'qa/ux531-math-p1p5-plan-runtime.cjs'
      - 'exam-prep/exam-prep-api.js'
      - 'exam-prep/exam-prep-exam-map.js'
      - '.github/workflows/ux531-academy-ui-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Core syntax checks
        run: |
          node --check app.js
          node --check i18n.js
          node --check visual/iclub-academy-ux531-interactions.js
          node --check qa/ux531-academy-ui-parity.cjs
          node --check qa/ux531-academy-all-screens.cjs
          node --check qa/ux531-math-p1p5-plan-runtime.cjs
          node --check exam-prep/exam-prep-exam-map.js
      - name: UI source parity and contract
        run: node qa/ux531-academy-ui-parity.cjs
      - name: Install browser runtime (Ubuntu 24.04 compatible)
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Browser UI parity on real source DOM and CSS
        run: node qa/ux531-academy-browser.cjs
      - name: All-screen B04–B08 Chromium geometry and screenshots
        run: node qa/ux531-academy-all-screens.cjs
      - name: Live Mathematics P1/P5 after saved plan (in-memory only)
        run: node qa/ux531-math-p1p5-plan-runtime.cjs
      - name: Preserve review screenshots (no user data)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux531-academy-all-screen-review
          path: ux531-academy-all-screens/
          if-no-files-found: ignore
          retention-days: 7
