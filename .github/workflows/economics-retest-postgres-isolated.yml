name: Economics Retest Isolated PostgreSQL Runtime Gate
on:
  pull_request:
    paths:
      - 'docs/release-candidates/economics-private-retest-gated-v1.sql'
      - 'scripts/fixtures/economics-retest-postgres-fixture-v1.sql'
      - 'scripts/fixtures/economics-retest-postgres-e2e-v1.sql'
      - '.github/workflows/economics-retest-postgres-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-pg17-synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only-ci
          POSTGRES_DB: economics_retest_fictional
        options: >-
          --health-cmd "pg_isready -U postgres -d economics_retest_fictional"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify no protected bank, production env or learner data
        shell: bash
        run: |
          test ! -e Economics_9708_P1_P3_71_Same_Skill_Retest_Combined_PRIVATE_DRAFT_20261029.json
          test ! -e Economics_9708_P1_P3_71_Same_Skill_Retest_ACADEMIC_SEMANTIC_REV2_PRIVATE_HOLD_20261030.json
          test ! -e .env.production
      - name: Initialize synthetic schema, compile candidate, test authenticated runtime
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -U postgres -d economics_retest_fictional -v ON_ERROR_STOP=1 -f - < scripts/fixtures/economics-retest-postgres-fixture-v1.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d economics_retest_fictional -v ON_ERROR_STOP=1 -f - < docs/release-candidates/economics-private-retest-gated-v1.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d economics_retest_fictional -v ON_ERROR_STOP=1 -f - < scripts/fixtures/economics-retest-postgres-e2e-v1.sql
