name: UX531 previewless source release firewall (NO deployment)
on:
  push:
    branches:
      - draft/ux531-v58-b00-integrated-qa-20261115
  pull_request:
    paths:
      - app.js
      - index.html
      - registration-b00-ui.js
      - exam-prep/**
      - visual/**
      - qa/**
      - supabase/tests/**
      - docs/ui-redesign/**
      - .github/workflows/ux531-previewless-release-firewall.yml
permissions:
  contents: read
jobs:
  source-only-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify scoped UX531 release candidates
        id: ux531_scope
        env:
          UX531_BASE_SHA: ${{ github.event.pull_request.base.sha || 'b5cbf0c10e178c583aeb9c223cc25110cd10c65c' }}
          UX531_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # This full-release source gate is NOT a general PR validator. Keep
          # legacy reviewed release checks unchanged, but do not reject unrelated
          # AI/Practice/Math PRs merely for touching index.html or qa/*.
          branch_requires_guard() {
            case "$1" in
              draft/ux531-*|ux531/*|integration/math-ux531-*|integration/math562-ci563-release-candidate-*|fix/math-single-my-plan-legacy-map-*|feature/math-d3-hours-optional-*)
                return 0 ;;
              *) return 1 ;;
            esac
          }
          file_requires_guard() {
            case "$1" in
              visual/iclub-academy-*|qa/ux531-*|qa/math-ux-stage36-*|qa/math-d3-hours-*|docs/ui-redesign/*|registration-b00-ui.js|supabase/tests/p2_02_stage3_syllabus_closure_matrix.sql|.github/workflows/ux531-*|.github/workflows/math-ux-stage36-integration-source-gate.yml)
                return 0 ;;
              *) return 1 ;;
            esac
          }
          # Fast self-check: unrelated shared-source changes must not accidentally
          # count as UX531 full releases, while real UX531 files/branches remain guarded.
          branch_requires_guard draft/ux531-v58-b00-integrated-qa-20261115
          branch_requires_guard ux531/pinned-study-blue-hierarchy-20261117
          branch_requires_guard integration/math-ux531-stage36-20261117-v1
          branch_requires_guard feature/math-d3-hours-optional-20261118
          ! branch_requires_guard draft/ai-beta-screen-contract-20261120
          ! branch_requires_guard fix/practice-topic-history-20261120
          file_requires_guard visual/iclub-academy-ux531-b04b08.css
          file_requires_guard qa/ux531-previewless-release-firewall.cjs
          file_requires_guard .github/workflows/ux531-previewless-release-firewall.yml
          ! file_requires_guard supabase/tests/iclub_ai_finance_safety_v1_matrix.sql
          ! file_requires_guard qa/ai-tutor-source-regression.cjs
          ! file_requires_guard index.html

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "run_guard=true" >> "$GITHUB_OUTPUT"
            echo "UX531: original explicit push/manual candidate gate retained."
            exit 0
          fi

          test "$UX531_EXPECTED_SHA" = "$(git rev-parse HEAD)"
          git cat-file -e "${UX531_BASE_SHA}^{commit}"
          mapfile -t changed < <(git diff --name-only "$UX531_BASE_SHA" "$UX531_EXPECTED_SHA")

          # This dedicated one-file repair must test its new branch/file classifier.
          # If it touches anything other than the workflow, it FAILS CLOSED.
          if [[ "${GITHUB_HEAD_REF:-}" == "fix/ux531-ci-scope-20261120" ]]; then
            test "${#changed[@]}" -eq 1
            test "${changed[0]}" = ".github/workflows/ux531-previewless-release-firewall.yml"
            echo "run_guard=false" >> "$GITHUB_OUTPUT"
            echo "UX531: one-file workflow scope repair; classifier self-checks PASS."
            exit 0
          fi

          run_guard=false
          if branch_requires_guard "${GITHUB_HEAD_REF:-}"; then
            run_guard=true
          else
            for file in "${changed[@]}"; do
              if file_requires_guard "$file"; then
                run_guard=true
                break
              fi
            done
          fi
          echo "run_guard=$run_guard" >> "$GITHUB_OUTPUT"
          if [[ "$run_guard" == "true" ]]; then
            echo "UX531: protected release/source candidate; run unchanged full firewall."
          else
            echo "UX531: unrelated PR; skip original full-release-only source firewall."
          fi
      - name: Unrelated PRs are not UX531 release candidates
        if: steps.ux531_scope.outputs.run_guard == 'false'
        run: echo "PASS scope isolation. Unrelated PR is checked by its own targeted CI."
      - name: Enforce pinned source and absent production side effects
        if: steps.ux531_scope.outputs.run_guard == 'true'
        env:
          UX531_BASE_SHA: ${{ github.event.pull_request.base.sha || 'b5cbf0c10e178c583aeb9c223cc25110cd10c65c' }}
          UX531_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # The original integrated-candidate firewall remains unchanged.
          # Post-release tiny fixes from the exact owner-approved release SHA
          # have a narrower exact-file and source-hash gate of their own.
          # The narrow UX-only allowlist remains authoritative for every
          # ordinary UX PR. This ONE combined Math+UX+CI candidate must pass
          # the *stronger* exact-37-file integrated source firewall, not skip QA.
          # Exact, candidate-only D3 source review; legacy UX guards remain intact.
          # Targeted owner-requested UX531 postrelease repair. The old
          # Academy and D3 source gates still apply to their own branches.
          # Reject all other files and all drift from the reviewed main SHA.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" &&
                "${GITHUB_HEAD_REF:-}" == "fix/math-single-my-plan-legacy-map-20261118" ]]; then
            test "${GITHUB_BASE_REF:-}" = "main"
            test "$UX531_BASE_SHA" = "d69e8f7e2dcd287487a2926ccc5792e2dd0746ff"
            test "$UX531_EXPECTED_SHA" = "$(git rev-parse HEAD)"
            mapfile -t changed < <(git diff --name-only "$UX531_BASE_SHA" "$UX531_EXPECTED_SHA")
            test "${#changed[@]}" -eq 11
            for f in "${changed[@]}"; do
              case "$f" in
              ".github/workflows/p0-14-host-regression.yml") ;;
              ".github/workflows/p2-09-exam-map-revision.yml") ;;
              ".github/scripts/p2_09_exam_map_ui_regression.js") ;;
              ".github/workflows/exam-prep-weekly-profile-recovery.yml") ;;
              ".github/workflows/math-p1p5-d3-protected-recovery-review.yml") ;;
              ".github/workflows/ux531-academy-ui-source.yml") ;;
              ".github/workflows/ux531-previewless-release-firewall.yml") ;;
              "exam-prep/exam-prep-api.js") ;;
              "exam-prep/exam-prep-exam-map.js") ;;
              "index.html") ;;
              "qa/ux531-math-p1p5-plan-runtime.cjs") ;;
                *) echo "UNREVIEWED DEDUP FILE: $f"; exit 1 ;;
              esac
            done
          test "$(git hash-object exam-prep/exam-prep-exam-map.js)" = '4c54b9d774b56a843aa1b98454758ef60cdd56fa'
          test "$(git hash-object exam-prep/exam-prep-api.js)" = 'ddfb9f643d089c726ec5c84284359a5cea87b7f4'
          test "$(git hash-object index.html)" = '075b589d32fd22120ac79556df893b9a02f1344a'
          test "$(git hash-object qa/ux531-math-p1p5-plan-runtime.cjs)" = '53d4b24e99354e76ecb88c7af617ba4d556ec87f'
          test "$(git hash-object .github/workflows/ux531-academy-ui-source.yml)" = '051812918abf798fdaa63b9d96390b60fafdb565'
          test "$(git hash-object .github/workflows/exam-prep-weekly-profile-recovery.yml)" = 'f468142f6ab5614fa19548bd9f9009e4e2106db4'
          test "$(git hash-object .github/workflows/math-p1p5-d3-protected-recovery-review.yml)" = '33cf15c04ca5a290893e58d8b733883c31ce8b7f'
          test "$(git hash-object .github/workflows/p0-14-host-regression.yml)" = '3c9d1f5b0a31198b8f4c4947cba9697af6a1dd62'
          test "$(git hash-object .github/workflows/p2-09-exam-map-revision.yml)" = 'b63b2a4ba6e77e257c7397e2b770835085d07dc1'
          test "$(git hash-object .github/scripts/p2_09_exam_map_ui_regression.js)" = '538e3d334b00a0313fc2311924441fdf15fc3dff'
          test "$(git hash-object exam-prep/exam-prep-live.js)" = 'e875085e55b4580df9659b27e7f32c8490fcd06a'
          test "$(git hash-object exam-prep/exam-prep-recovery.js)" = '5ba398241b2e2055c72362c9fa660b9f0c8f34c5'
          node --check exam-prep/exam-prep-exam-map.js
          node --check exam-prep/exam-prep-api.js
          node --check qa/ux531-math-p1p5-plan-runtime.cjs
          grep -Fq 'hasUnifiedMyPlan(root)' exam-prep/exam-prep-exam-map.js
          echo 'PASS: strict 8-path single My plan repair; legacy guards unaffected.'
          exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" &&
                "${GITHUB_HEAD_REF:-}" == "feature/math-d3-hours-optional-20261118" ]]; then
            test "${GITHUB_BASE_REF:-}" = "main"
            test "$UX531_BASE_SHA" = "31f22796545c58382e7ac41c785000e736f8472b"
            test "$UX531_EXPECTED_SHA" = "$(git rev-parse HEAD)"
            node --check qa/math-d3-hours-source-firewall.cjs
            D3_BASE_SHA="$UX531_BASE_SHA" D3_HEAD_SHA="$UX531_EXPECTED_SHA" node qa/math-d3-hours-source-firewall.cjs
            echo "D3 strict reviewed-source gate PASS; UX-only guards preserved for other branches."
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" &&
                "${GITHUB_HEAD_REF:-}" == "integration/math562-ci563-release-candidate-20261117" ]]; then
            test "$UX531_BASE_SHA" = "f945228fefe0ec3a013f34b7d0ab9ac6c40cc2e4"
            test "$UX531_EXPECTED_SHA" = "$(git rev-parse HEAD)"
            node --check qa/math-ux-stage36-integration-source-guard.cjs
            MATH_UX_BASE_SHA="$UX531_BASE_SHA" \
            MATH_UX_HEAD_SHA="$UX531_EXPECTED_SHA" \
              node qa/math-ux-stage36-integration-source-guard.cjs
            echo 'PASS: combined-source guard. Original UX-only guard unchanged for all other branches.'
            exit 0
          fi
          RELEASE_SHA="464551650ae925ca3404feff4a5c4c506c49cd70"
          REVIEWED_PARENT_SHA="a17024ce1a1f17def4d69dd81c6d0daf9fa3c323"
          if [[ "$UX531_BASE_SHA" == "f945228fefe0ec3a013f34b7d0ab9ac6c40cc2e4" ]]; then
            node --check qa/ux531-math-history-plan-source-guard.cjs
            node qa/ux531-math-history-plan-source-guard.cjs
          elif [[ "$UX531_BASE_SHA" == "$RELEASE_SHA" ]]; then
            node --check qa/ux531-postrelease-source-guard.cjs
            node qa/ux531-postrelease-source-guard.cjs
          elif [[ "$UX531_BASE_SHA" == "$REVIEWED_PARENT_SHA" ]] &&
               git merge-base --is-ancestor "$RELEASE_SHA" "$REVIEWED_PARENT_SHA" &&
               git merge-base --is-ancestor "$REVIEWED_PARENT_SHA" "$UX531_EXPECTED_SHA"; then
            # Nested PR #556: validate ALL changes since published release, not just
            # child diff. Same strict 11-file boundary plus the exact colour-only
            # browser QA adjustment allowed by the postrelease source guard.
            UX531_BASE_SHA="$RELEASE_SHA" node --check qa/ux531-postrelease-source-guard.cjs
            UX531_BASE_SHA="$RELEASE_SHA" node qa/ux531-postrelease-source-guard.cjs
          else
            node --check qa/ux531-previewless-release-firewall.cjs
            node qa/ux531-previewless-release-firewall.cjs
          fi
