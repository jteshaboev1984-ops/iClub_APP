name: UX531 previewless source release firewall (NO deployment)
on:
  push:
    branches:
      - draft/ux531-v58-b00-integrated-qa-20261115
  pull_request:
    paths:
      - app.js
      - index.html
      - registration-b00-ui.js
      - exam-prep/**
      - visual/**
      - qa/**
      - supabase/tests/**
      - docs/ui-redesign/**
      - .github/workflows/ux531-previewless-release-firewall.yml
permissions:
  contents: read
jobs:
  source-only-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce pinned source and absent production side effects
        env:
          UX531_BASE_SHA: ${{ github.event.pull_request.base.sha || 'b5cbf0c10e178c583aeb9c223cc25110cd10c65c' }}
          UX531_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --check qa/ux531-previewless-release-firewall.cjs
          node qa/ux531-previewless-release-firewall.cjs
