name: TEMP Exam Prep Live CSS Gate

on:
  push:
    branches:
      - exam-prep-css-live-v1
    paths:
      - .github/workflows/tmp-exam-prep-live-css.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exam-prep-css-live-v1
          fetch-depth: 0

      - name: Stage centralized live flow styles
        run: python3 .github/scripts/tmp_exam_prep_live_css_patch.py

      - name: Static safety checks
        run: |
          node --check exam-prep/exam-prep-live.js
          node --check .github/scripts/p0_17_live_diagnostic_regression.js
          ! grep -q 'ensureStyle(' exam-prep/exam-prep-live.js
          ! grep -q 'ep-live-flow-style' exam-prep/exam-prep-live.js
          ! grep -q 'document.createElement("style")' exam-prep/exam-prep-live.js
          grep -q 'EXAM PREP CENTRALIZED LIVE FLOW v1' exam-prep/exam-prep-host.css
          grep -q '.ep-live-card{' exam-prep/exam-prep-host.css
          ! grep -q 'localStorage' exam-prep/exam-prep-live.js
          ! grep -q '\.from(' exam-prep/exam-prep-live.js
          git diff --check

      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Live entry-check regression
        run: node .github/scripts/p0_17_live_diagnostic_regression.js

      - name: Weekly plan regression
        run: node .github/scripts/p0_18_live_plan_regression.js

      - name: Timed readiness regression
        run: node .github/scripts/p0_19_live_timed_readiness_regression.js

      - name: Combined learner views regression
        run: node .github/scripts/p0_22_live_view_coexistence_regression.js

      - name: Host bridge regression
        run: node .github/scripts/p0_14_host_regression.js

      - name: Start local app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/live-css-http.log 2>&1 &
          echo $! >/tmp/live-css-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/live-css-http.log
          exit 1

      - name: Mathematics Exam Prep visual regression
        run: node .github/scripts/visual_v3_math_exam_prep_ux_regression.js

      - name: Commit product and regression only after green
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-prep/exam-prep-live.js exam-prep/exam-prep-host.css .github/scripts/p0_17_live_diagnostic_regression.js
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 1; }
          git commit -m 'refactor(ui): centralize Exam Prep live flow styles'
          git push origin HEAD:exam-prep-css-live-v1
