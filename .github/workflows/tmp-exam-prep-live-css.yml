name: TEMP Exam Prep Live CSS Gate

on:
  push:
    branches:
      - exam-prep-css-live-v1
    paths:
      - .github/workflows/tmp-exam-prep-live-css.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exam-prep-css-live-v1
          fetch-depth: 0

      - name: Stage centralized live flow styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('exam-prep/exam-prep-live.js')
          js = js_path.read_text()
          original = js
          js, n = re.subn(
              r'\n  function ensureStyle\(\) \{.*?\n  \}\n\n  function shell\(',
              '\n\n  function shell(',
              js,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected one live ensureStyle block, removed {n}')
          old_mount = '    ensureStyle(); renderLoading(); const profile = await internal.api.examProfile();'
          new_mount = '    renderLoading(); const profile = await internal.api.examProfile();'
          if js.count(old_mount) != 1:
              raise SystemExit(f'Expected one live ensureStyle mount call, found {js.count(old_mount)}')
          js = js.replace(old_mount, new_mount, 1)
          if 'ensureStyle(' in js or 'ep-live-flow-style' in js or 'document.createElement("style")' in js:
              raise SystemExit('Runtime live-flow style injection remains')
          if js == original:
              raise SystemExit('Live flow JS did not change')
          js_path.write_text(js)

          css_path = Path('exam-prep/exam-prep-host.css')
          css = css_path.read_text()
          marker = '/* ===== EXAM PREP CENTRALIZED LIVE FLOW v1 ===== */'
          if marker in css:
              raise SystemExit('Live flow CSS marker already exists')
          css += r'''

/* ===== EXAM PREP CENTRALIZED LIVE FLOW v1 ===== */
#exam-prep-host-root .ep-live {
  display: grid;
  gap: 14px;
}

#exam-prep-host-root .ep-live-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
}

#exam-prep-host-root .ep-live-safe {
  font-size: 12px;
  opacity: .72;
  max-width: 280px;
  text-align: right;
}

#exam-prep-host-root .ep-live-card {
  border: 1px solid rgba(127,127,127,.24);
  border-radius: 14px;
  padding: 14px;
  display: grid;
  gap: 10px;
  background: rgba(127,127,127,.04);
}

#exam-prep-host-root .ep-live-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 12px;
}

#exam-prep-host-root .ep-live-form {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px;
}

#exam-prep-host-root .ep-live-field {
  display: grid;
  gap: 5px;
  font-size: 13px;
}

#exam-prep-host-root .ep-live-field input,
#exam-prep-host-root .ep-live-input,
#exam-prep-host-root .ep-live-textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 10px 11px;
  border: 1px solid rgba(127,127,127,.35);
  border-radius: 10px;
  background: transparent;
  color: inherit;
}

#exam-prep-host-root .ep-live-textarea {
  min-height: 140px;
  resize: vertical;
}

#exam-prep-host-root .ep-live-btn {
  border: 0;
  border-radius: 11px;
  padding: 10px 14px;
  font-weight: 700;
  cursor: pointer;
  background: #111827;
  color: #fff;
}

#exam-prep-host-root .ep-live-btn:disabled {
  opacity: .55;
  cursor: default;
}

#exam-prep-host-root .ep-live-btn.secondary {
  background: transparent;
  color: inherit;
  border: 1px solid rgba(127,127,127,.35);
}

#exam-prep-host-root .ep-live-progress {
  height: 7px;
  border-radius: 999px;
  background: rgba(127,127,127,.18);
  overflow: hidden;
}

#exam-prep-host-root .ep-live-progress > span {
  display: block;
  height: 100%;
  background: currentColor;
  opacity: .7;
}

#exam-prep-host-root .ep-live-meta {
  font-size: 12px;
  opacity: .72;
}

#exam-prep-host-root .ep-live-options {
  display: grid;
  gap: 8px;
}

#exam-prep-host-root .ep-live-option {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  padding: 10px;
  border: 1px solid rgba(127,127,127,.25);
  border-radius: 10px;
}

#exam-prep-host-root .ep-live-notice {
  padding: 10px;
  border-radius: 10px;
  background: rgba(127,127,127,.1);
  font-size: 13px;
}

#exam-prep-host-root .ep-live-error {
  padding: 10px;
  border-radius: 10px;
  background: rgba(180,30,30,.12);
  font-size: 13px;
}

#exam-prep-host-root .ep-live-qtext {
  white-space: pre-wrap;
  line-height: 1.5;
}

#exam-prep-host-root .ep-live-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

#exam-prep-host-root .ep-live-plan-item,
#exam-prep-host-root .ep-live-timed-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 11px;
  border: 1px solid rgba(127,127,127,.2);
  border-radius: 11px;
}

#exam-prep-host-root .ep-live-priority {
  font-weight: 800;
  font-size: 18px;
}

#exam-prep-host-root .ep-live-due {
  font-size: 11px;
  opacity: .7;
}

#exam-prep-host-root .ep-live-stat {
  display: grid;
  gap: 3px;
  padding: 10px;
  border: 1px solid rgba(127,127,127,.18);
  border-radius: 10px;
}

#exam-prep-host-root .ep-live-stats {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 8px;
}

#exam-prep-host-root .ep-live-stat strong {
  font-size: 18px;
}

#exam-prep-host-root .ep-live-rubric {
  display: grid;
  gap: 7px;
}

#exam-prep-host-root .ep-live-rubric-row {
  padding: 8px;
  border-radius: 9px;
  background: rgba(127,127,127,.07);
  font-size: 13px;
}

#exam-prep-host-root .ep-live-answer {
  white-space: pre-wrap;
  padding: 10px;
  border-radius: 9px;
  background: rgba(127,127,127,.07);
}

#exam-prep-host-root .ep-live-timer {
  font-variant-numeric: tabular-nums;
  font-weight: 800;
}

#exam-prep-host-root .ep-live-action-row {
  display: grid;
  gap: 4px;
  padding: 10px;
  border: 1px solid rgba(127,127,127,.18);
  border-radius: 10px;
}

#exam-prep-host-root .ep-live-dashboard-intro {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
}

#exam-prep-host-root .ep-live-dashboard-eyebrow {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  opacity: .7;
}

#exam-prep-host-root .ep-live-dashboard-title {
  margin: 4px 0 5px;
  font-size: 19px;
  line-height: 1.2;
}

#exam-prep-host-root .ep-live-dashboard-text {
  margin: 0;
  max-width: 520px;
  font-size: 13px;
  line-height: 1.45;
  opacity: .76;
}

#exam-prep-host-root .ep-live-dashboard-profile {
  flex: 0 1 310px;
  display: grid;
  gap: 2px;
  padding: 7px 9px;
  border: 1px solid rgba(127,127,127,.24);
  border-radius: 10px;
  font-size: 10px;
  line-height: 1.35;
}

#exam-prep-host-root .ep-live-dashboard-profile strong {
  font-size: 10px;
}

#exam-prep-host-root .ep-live-dashboard-profile span {
  overflow-wrap: anywhere;
}

#exam-prep-host-root .ep-live-component-head {
  display: flex;
  align-items: center;
  gap: 10px;
}

#exam-prep-host-root .ep-live-component-code {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 34px;
  height: 28px;
  padding: 0 8px;
  border-radius: 999px;
  background: rgba(127,127,127,.1);
  font-size: 11px;
  font-weight: 800;
}

#exam-prep-host-root .ep-live-component-copy {
  display: grid;
  gap: 2px;
  min-width: 0;
}

#exam-prep-host-root .ep-live-component-copy > span {
  font-size: 11px;
  opacity: .68;
}

#exam-prep-host-root .ep-live-component-status {
  display: grid;
  gap: 7px;
}

@media (max-width: 680px) {
  #exam-prep-host-root .ep-live-grid,
  #exam-prep-host-root .ep-live-form,
  #exam-prep-host-root .ep-live-stats {
    grid-template-columns: 1fr;
  }

  #exam-prep-host-root .ep-live-head {
    display: grid;
  }

  #exam-prep-host-root .ep-live-safe {
    text-align: left;
    max-width: none;
  }

  #exam-prep-host-root .ep-live-dashboard-intro {
    display: grid;
  }

  #exam-prep-host-root .ep-live-dashboard-profile {
    width: max-content;
  }

  #exam-prep-host-root .ep-live-plan-item,
  #exam-prep-host-root .ep-live-timed-row {
    grid-template-columns: 1fr;
  }

  #exam-prep-host-root .ep-live-plan-item .ep-live-btn,
  #exam-prep-host-root .ep-live-timed-row .ep-live-btn {
    width: 100%;
  }
}
'''
          css_path.write_text(css)

          test_path = Path('.github/scripts/p0_17_live_diagnostic_regression.js')
          test = test_path.read_text()
          if "const fs = require('fs');" in test:
              raise SystemExit('P0-17 already has centralized live-flow assertions')
          insertion = """const fs = require('fs');\nconst liveSource = fs.readFileSync('exam-prep/exam-prep-live.js', 'utf8');\nconst hostCss = fs.readFileSync('exam-prep/exam-prep-host.css', 'utf8');\nif (liveSource.includes('ensureStyle(') || liveSource.includes('ep-live-flow-style') || liveSource.includes('document.createElement(\\\"style\\\")')) throw new Error('runtime live-flow style injection returned');\nif (!hostCss.includes('EXAM PREP CENTRALIZED LIVE FLOW v1') || !hostCss.includes('#exam-prep-host-root .ep-live-card')) throw new Error('centralized live-flow CSS contract missing');\n\n"""
          test = test.replace("const path = require('path');\n", "const path = require('path');\n" + insertion, 1)
          test_path.write_text(test)
          PY

      - name: Static safety checks
        run: |
          node --check exam-prep/exam-prep-live.js
          node --check .github/scripts/p0_17_live_diagnostic_regression.js
          ! grep -q 'ensureStyle(' exam-prep/exam-prep-live.js
          ! grep -q 'ep-live-flow-style' exam-prep/exam-prep-live.js
          ! grep -q 'document.createElement("style")' exam-prep/exam-prep-live.js
          grep -q 'EXAM PREP CENTRALIZED LIVE FLOW v1' exam-prep/exam-prep-host.css
          grep -q '#exam-prep-host-root .ep-live-card' exam-prep/exam-prep-host.css
          ! grep -q 'localStorage' exam-prep/exam-prep-live.js
          ! grep -q '\.from(' exam-prep/exam-prep-live.js
          git diff --check

      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Live entry-check regression
        run: node .github/scripts/p0_17_live_diagnostic_regression.js

      - name: Weekly plan regression
        run: node .github/scripts/p0_18_live_plan_regression.js

      - name: Timed readiness regression
        run: node .github/scripts/p0_19_live_timed_readiness_regression.js

      - name: Combined learner views regression
        run: node .github/scripts/p0_22_live_view_coexistence_regression.js

      - name: Host bridge regression
        run: node .github/scripts/p0_14_host_regression.js

      - name: Start local app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/live-css-http.log 2>&1 &
          echo $! >/tmp/live-css-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/live-css-http.log
          exit 1

      - name: Mathematics Exam Prep visual regression
        run: node .github/scripts/visual_v3_math_exam_prep_ux_regression.js

      - name: Commit product and regression only after green
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-prep/exam-prep-live.js exam-prep/exam-prep-host.css .github/scripts/p0_17_live_diagnostic_regression.js
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 1; }
          git commit -m 'refactor(ui): centralize Exam Prep live flow styles'
          git push origin HEAD:exam-prep-css-live-v1
