name: P2-04 Stage 4 Timed Consolidation

on:
  pull_request:
    branches:
      - main
    paths:
      - supabase/migrations/20261002050000_exam_prep_p2_04_stage4_consolidation_safe_v1.sql
      - supabase/tests/p2_04_stage4_consolidation_matrix.sql
      - exam-prep/exam-prep-api.js
      - exam-prep/exam-prep-live.js
      - .github/scripts/p2_04_stage4_consolidation_ui_regression.js
      - .github/scripts/p0_19_live_timed_readiness_regression.js
      - .github/workflows/p2-04-stage4-consolidation.yml
  push:
    branches:
      - main
    paths:
      - supabase/migrations/20261002050000_exam_prep_p2_04_stage4_consolidation_safe_v1.sql
      - supabase/tests/p2_04_stage4_consolidation_matrix.sql
      - exam-prep/exam-prep-api.js
      - exam-prep/exam-prep-live.js
      - .github/scripts/p2_04_stage4_consolidation_ui_regression.js
      - .github/scripts/p0_19_live_timed_readiness_regression.js
      - .github/workflows/p2-04-stage4-consolidation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static Stage 4 learner contract
        run: |
          node --check exam-prep/exam-prep-api.js
          node --check exam-prep/exam-prep-live.js
          node --check .github/scripts/p2_04_stage4_consolidation_ui_regression.js
          node .github/scripts/p2_04_stage4_consolidation_ui_regression.js

      - name: Browser Stage 4 learner flow
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node --check .github/scripts/p0_19_live_timed_readiness_regression.js
          node .github/scripts/p0_19_live_timed_readiness_regression.js
