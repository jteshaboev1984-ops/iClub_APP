name: One-shot Practice language preservation patch (draft branch only)
on:
  push:
    branches: ['fix/exam-prep-weekly-goal-flow-safe']
    paths: ['.github/workflows/practice-language-patch-once.yml']
permissions:
  contents: write
jobs:
  apply-draft-only:
    if: github.repository == 'jteshaboev1984-ops/iClub_APP' && github.ref == 'refs/heads/fix/exam-prep-weekly-goal-flow-safe' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exam-prep-weekly-goal-flow-safe
          fetch-depth: 1
      - name: Refuse if exact original files differ; no production credentials
        run: |
          set -euo pipefail
          test "$(git hash-object app.js)" = ef8fea3ed29937cdc8dbdc90395445280ececa9d
          test "$(git hash-object i18n.js)" = 3eb953a22d8bb33c5fd702bc485a91a0f83a006c
          test "$(git branch --show-current)" = fix/exam-prep-weekly-goal-flow-safe
      - name: Replace only confirmed destructive content-language handler and nine misleading strings
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          app=Path('app.js'); src=app.read_text()
          begin='      // 1) DB wipe (если есть Supabase + uid)'
          finish='      // 4) apply content language'
          assert src.count(begin)==1 and src.count(finish)==1, 'Exact original handler anchors drifted'
          a=src.index(begin); b=src.index(finish,a); section=src[a:b]
          assert section.count('practiceApi.resetProgress()')==1
          for required in ['localStorage.removeItem(LS.state)','localStorage.removeItem(LS.practiceDraft)',
                           'localStorage.removeItem(LS.myRecs)','localStorage.removeItem(LS.events)',
                           'localStorage.removeItem(LS.credentials)']:
              assert section.count(required)==1, 'Original deletion changed: '+required
          replacement='''      // Changing question language must preserve Practice, Tours and local drafts.
          // Update only this learner's language, and require server confirmation.
          try {
            const uid = await getAuthUid();
            if (!window.sb || !uid) throw new Error("content_language_save_unavailable");
            const { data, error } = await window.sb
              .from("users")
              .update({ language_code: nextLang })
              .eq("id", uid)
              .select("id,language_code")
              .maybeSingle();
            if (error || !data || data.language_code !== nextLang) {
              throw error || new Error("content_language_save_unconfirmed");
            }
          } catch (e) {
            try { trackEvent("content_lang_change_db_error", { message: String(e?.message || e) }); } catch {}
            showToast(t("save_failed_try_again"));
            return;
          }

          // 4) apply content language'''
          app.write_text(src[:a]+replacement+src[b+len(finish):])
          file=Path('i18n.js'); txt=file.read_text()
          substitutions=[
          ('Смена этого языка удалит весь прогресс (туры, практика, ответы). Используйте только при необходимости.',
           'Меняет язык заданий в турах и практике. Все результаты и ответы сохраняются.'),
          ('Смена языка туров и практики удалит весь прогресс. Продолжить?',
           'Изменить язык заданий? Ваши результаты и ответы сохранятся.'),
          ('Язык туров и практики изменён. Прогресс сброшен.',
           'Язык заданий изменён. Весь прогресс сохранён.'),
          ('Bu tilni o‘zgartirish barcha progressni (turlar, amaliyot, javoblar) o‘chiradi. Faqat zarurat bo‘lsa foydalaning.',
           'Turlar va amaliyotdagi savollar tili o‘zgaradi. Barcha natijalar va javoblar saqlanadi.'),
          ('Turlar va amaliyot tilini o‘zgartirish barcha progressni o‘chiradi. Davom etilsinmi?',
           'Savollar tilini o‘zgartirasizmi? Natijalar va javoblar saqlanadi.'),
          ('Turlar va amaliyot tili o‘zgartirildi. Progress o‘chirildi.',
           'Savollar tili o‘zgartirildi. Barcha natijalar saqlandi.'),
          ('Changing this language will delete all progress (tours, practice, answers). Use only if necessary.',
           'Changes the language of questions in Tours and Practice. All results and answers stay saved.'),
          ('Changing the tours and practice language will delete all progress. Continue?',
           'Change the question language? Your results and answers will be preserved.'),
          ('Tours and practice language updated. Progress has been reset.',
           'Question language updated. All progress has been preserved.')]
          for old,new in substitutions:
              assert txt.count(old)==1, 'Original unique translation changed: '+old
              txt=txt.replace(old,new)
          file.write_text(txt)
          print('Patched only draft app.js handler and nine i18n strings. No DB operation.')
          PY
      - name: Prove behavior and syntax before committing
        run: |
          set -euo pipefail
          node --check app.js
          node --check i18n.js
          node --check scripts/practice-content-language-preservation.cjs
          node scripts/practice-content-language-preservation.cjs
          git diff --check
      - name: Push only two source files, never workflow modifications or production
        shell: bash
        run: |
          set -euo pipefail
          git add app.js i18n.js
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          test "$(git diff --cached --name-only)" = $'app.js\ni18n.js'
          git config user.name 'iClub guarded CI patch'
          git config user.email 'iclub-ci-patch@users.noreply.github.com'
          git commit -m 'fix: changing content language preserves Practice and local learner progress'
          git push origin HEAD:refs/heads/fix/exam-prep-weekly-goal-flow-safe
