name: Chemistry source audit

on:
  push:
    branches: [chemistry-academic-audit]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chemistry-academic-audit
          fetch-depth: 0
      - name: Download and extract Chemistry source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl -L --fail --retry 3 \
            'https://mmmduffgpvwjdpruzikw.supabase.co/storage/v1/object/public/books/Cambridge_International_AS_A_Level_Chemistry_Coursebook_3e_by_Lawrie%20%282%29.pdf' \
            -o /tmp/chemistry.pdf
          pdfinfo /tmp/chemistry.pdf > /tmp/pdfinfo.txt
          pdftotext -layout /tmp/chemistry.pdf /tmp/chemistry.txt
          python - <<'PY'
          from pathlib import Path
          import re

          raw = Path('/tmp/chemistry.txt').read_text(encoding='utf-8', errors='replace')
          pages = raw.split('\f')
          out = []
          out.append('CHEMISTRY COURSEBOOK 3E — SOURCE AUDIT INDEX')
          out.append('')
          out.append(Path('/tmp/pdfinfo.txt').read_text(encoding='utf-8', errors='replace'))
          out.append('=== FRONT MATTER / CONTENTS (PDF pages 1-35) ===')
          for i, page in enumerate(pages[:35], start=1):
              compact = re.sub(r'[ \t]+', ' ', page).strip()
              out.append(f'\n--- PDF PAGE {i} ---\n{compact[:5000]}')

          terms = [
              'successive ionisation energies', 'isoelectronic', 'enthalpy of neutralisation',
              'mean bond energies', 'methyl orange', 'reaction quotient', 'silicon tetrachloride',
              'thermal stability', 'bromine water', '2,3-dibromobutane', 'iodoform',
              'lattice enthalpy of formation', 'entropy', 'half-life', 'standard electrode potential',
              'ethanoyl chloride', 'phenylamine', 'molecular ion peak', 'carboxylic acid',
              'coordination number', 'Sc3+', 'transition element'
          ]
          out.append('\n=== CONCEPT SEARCH CONTEXTS ===')
          for term in terms:
              hits = []
              tl = term.lower()
              for pno, page in enumerate(pages, start=1):
                  idx = page.lower().find(tl)
                  if idx >= 0:
                      context = re.sub(r'\s+', ' ', page[max(0, idx-900):idx+2300]).strip()
                      hits.append((pno, context))
                      if len(hits) == 4:
                          break
              out.append(f'\n## {term} — {len(hits)} shown')
              for pno, context in hits:
                  out.append(f'PDF page {pno}: {context}')

          Path('docs/chemistry-source-audit.txt').parent.mkdir(parents=True, exist_ok=True)
          Path('docs/chemistry-source-audit.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
      - name: Commit report and remove workflow
        run: |
          rm -f .github/workflows/chemistry-source-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Chemistry textbook source audit index'
          git push origin HEAD:chemistry-academic-audit
