name: TEMP Activate Premium Visual v3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-visual-v3-premium-activate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate-premium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch only the premium stylesheet link
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '  <link rel="stylesheet" href="visual/iclub-visual-v3.css?v=v3foundation1" />\n'
          new = old + '  <link rel="stylesheet" href="visual/iclub-premium-v3.css?v=premium1" />\n'
          if s.count(old) != 1:
              raise SystemExit(f'premium anchor count={s.count(old)}')
          if 'visual/iclub-premium-v3.css' in s:
              raise SystemExit('premium stylesheet already linked')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Static safety checks
        shell: bash
        run: |
          set -euo pipefail
          test -f visual/iclub-premium-v3.css
          grep -q 'visual/iclub-premium-v3.css?v=premium1' index.html
          ! grep -Eiq 'localStorage|sessionStorage|supabase|\.rpc\s*\(|\.from\s*\(|data-tab="study"' visual/iclub-premium-v3.css
          node --check app.js
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = 'index.html'

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run existing live-shell regression before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/premium-v3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.2
          done
          node .github/scripts/visual_v3_live_regression.js

      - name: Commit tested premium link
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          test "$(git diff --cached --name-only)" = 'index.html'
          git commit -m 'feat(ui): activate premium Visual v3 screens'
          git push origin HEAD:main
