name: P3-18 Tutor v3 Audit Repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/exam-prep-tutor-content-v3-audit-repair.md'
      - 'supabase/migrations/20261006010000_tutor_content_v3_stage.sql'
      - 'supabase/migrations/20261006011000_tutor_content_v3_promote.sql'
      - 'supabase/migrations/20261006013000_tutor_v3_whitespace_normalization.sql'
      - 'supabase/reversions/20261006011000_tutor_content_v3_promote_revert.sql'
      - 'supabase/tests/p3_18_tutor_content_v3_repair.sql'
      - '.github/workflows/p3-18-tutor-content-v3-repair.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261006010000_tutor_content_v3_stage.sql'
      - 'supabase/migrations/20261006011000_tutor_content_v3_promote.sql'
      - 'supabase/migrations/20261006013000_tutor_v3_whitespace_normalization.sql'
      - 'supabase/tests/p3_18_tutor_content_v3_repair.sql'
      - '.github/workflows/p3-18-tutor-content-v3-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tutor-v3-repair:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair-package diff firewall
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t changed < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          for f in "${changed[@]}"; do
            case "$f" in
              docs/exam-prep-tutor-content-v3-audit-repair.md|              supabase/migrations/20261006010000_tutor_content_v3_stage.sql|              supabase/migrations/20261006011000_tutor_content_v3_promote.sql|              supabase/reversions/20261006011000_tutor_content_v3_promote_revert.sql|              supabase/tests/p3_18_tutor_content_v3_repair.sql|              .github/workflows/p3-18-tutor-content-v3-repair.yml)
                ;;
              *)
                echo "Tutor v3 repair PR contains out-of-scope file: $f" >&2
                exit 1
                ;;
            esac
          done

      - name: Bootstrap prerequisites
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql
          for stage in 04 05 06 07 08 09 10 11 12 13 15 16; do
            for f in $(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p0_${stage}_*.sql" | sort); do
              psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null
            done
          done
          for pat in '*exam_prep_p1_01_*.sql' '*exam_prep_p1_04_*.sql'; do
            for f in $(find supabase/migrations -maxdepth 1 -type f -name "$pat" | sort); do
              psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null
            done
          done

      - name: Seed approved source-card stubs
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into private.exam_prep_ai_source_cards(
            source_card_key,component_code,skill_code,card_type,locale,source_version,title,body_text,
            approval_status,rights_status,is_runtime_allowed,content_hash,approved_at
          )
          select lower(n.component_code)||':'||n.skill_code||':theory:'||l.locale||':v1',
                 n.component_code,n.skill_code,'theory',l.locale,'ci_global_stub_v1',
                 n.skill_code||' '||l.locale,'CI source stub for Tutor v3 governance.',
                 'approved','original_iclub',true,md5(n.component_code||n.skill_code||l.locale),now()
          from (
            select distinct component_code,skill_code
            from private.exam_prep_syllabus_nodes
            where component_code in ('P1','P5')
          ) n
          cross join (values ('en'),('ru'),('uz')) l(locale);
          SQL

      - name: Build the historical Tutor v2 corpus
        shell: bash
        run: |
          set -euo pipefail
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '20261004*_exam_prep_ai_tutor_cards*.sql' | sort); do
            psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null
          done
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '2026100506*_tutor_block5_*.sql' | sort); do psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '2026100507*_tutor_block6_*.sql' | sort); do psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '2026100508*_tutor_block7_*.sql' | sort); do psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '20261005*_tutor_block8_*.sql' | sort); do psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '2026100511*_tutor_block9_*.sql' | sort); do psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '20261005*_tutor_block10_*.sql' | sort); do psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '20261005*_tutor_block11_*.sql' | sort); do psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '20261005*_tutor_block12_*.sql' | sort); do psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '20261005*_tutor_block13_*.sql' | sort); do psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '20261005*_tutor_block14_*.sql' | sort); do psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p3_15_tutor_global_243_review.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261005150000_tutor_243_approval_runtime_ready_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p3_16_tutor_243_approval_runtime_ready.sql

      - name: Stage Tutor v3 and atomic source v2
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006010000_tutor_content_v3_stage.sql

      - name: Promote Tutor v3
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006011000_tutor_content_v3_promote.sql

      - name: Normalize Tutor v3 learner-facing whitespace
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006013000_tutor_v3_whitespace_normalization.sql

      - name: Validate Tutor v3 repair
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p3_18_tutor_content_v3_repair.sql

      - name: Verify emergency reversion
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/reversions/20261006011000_tutor_content_v3_promote_revert.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p3_16_tutor_243_approval_runtime_ready.sql
          test "$(psql -Atqc "select count(*) from private.exam_prep_ai_tutor_cards where content_version='tutor_v3_learner_first' and approval_status='retired' and not is_runtime_allowed")" = "243"
