name: AI-2 Economics Practice Source Pack

on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20260925170000_practice_ai2_economics_source_pack_v1.sql
      - supabase/tests/ai2_economics_source_pack_fixture.sql
      - supabase/tests/ai2_economics_source_pack_matrix.sql
      - .github/workflows/ai2-economics-practice-source-pack.yml
  push:
    branches: [main]
    paths:
      - supabase/migrations/20260925170000_practice_ai2_economics_source_pack_v1.sql
      - supabase/tests/ai2_economics_source_pack_fixture.sql
      - supabase/tests/ai2_economics_source_pack_matrix.sql
      - .github/workflows/ai2-economics-practice-source-pack.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economics-source-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap isolated legacy contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql

      - name: Build AI-2 Practice fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ai2_practice_foundation_fixture.sql

      - name: Apply AI-2 Practice foundation
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260925160000_practice_ai2_foundation_v1.sql

      - name: Seed Economics source-pack question references
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ai2_economics_source_pack_fixture.sql

      - name: Apply governed Economics source pack
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260925170000_practice_ai2_economics_source_pack_v1.sql

      - name: Verify AI stays default OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -Atqc "select rollout_state from private.practice_ai_policy where id=1")" = 'off'
          test "$(psql -Atqc "select enabled from private.practice_ai_policy where id=1")" = 'f'
          test "$(psql -Atqc "select generation_enabled from private.practice_ai_policy where id=1")" = 'f'
          test "$(psql -Atqc "select count(*) from private.practice_ai_entitlements")" = '0'

      - name: Validate governed source pack
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ai2_economics_source_pack_matrix.sql
