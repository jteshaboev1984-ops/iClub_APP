name: Mathematics P1 P5 Stage D consolidated evidence gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/p1p5-stage-d-release-gate.cjs'
      - 'scripts/p1p5-stage-d-release-gate.test.cjs'
      - '.github/workflows/p1p5-stage-d-consolidated-release-gate.yml'
      - '.github/workflows/exam-prep-p1p5-isolated-http-e2e.yml'
      - '.github/workflows/p2-78-concurrency-service-transitions.yml'
      - '.github/workflows/p2-79-recovery-rollback-disaster.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character PR HEAD SHA already independently tested by all three workflows"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  consolidate:
    name: Exact-SHA 3-workflow release evidence; human gate remains NO_GO
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - name: Verify the fail-closed evidence classification itself
        run: |
          set -euo pipefail
          node --check scripts/p1p5-stage-d-release-gate.cjs
          node --check scripts/p1p5-stage-d-release-gate.test.cjs
          node scripts/p1p5-stage-d-release-gate.test.cjs
      - name: Aggregate live workflow runs and completed job-step evidence for exact PR SHA
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
        with:
          script: |
            const fs=require('node:fs');
            const gate=require('./scripts/p1p5-stage-d-release-gate.cjs');
            const sha=process.env.CANDIDATE_SHA;
            if(!/^[a-f0-9]{40}$/.test(sha))throw Error('REFUSED non-SHA candidate');
            const {owner,repo}=context.repo;
            let report;
            // Poll the three independent workflows as a set; completed
            // GREEN runs from different SHAs NEVER substitute.
            for(let attempt=0;attempt<36;attempt++){
              const runs=await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {owner,repo,head_sha:sha,event:'pull_request',per_page:100}
              );
              const details={};
              const requiredNames=Object.keys(gate.REQUIRED);
              for(const name of requiredNames){
                const matching=runs.filter(r=>r.name===name&&
                  r.head_sha===sha&&r.event==='pull_request')
                  .sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))||
                    (b.run_attempt||1)-(a.run_attempt||1)||b.id-a.id);
                const latest=matching[0];
                if(latest&&latest.status==='completed'&&latest.conclusion==='success'){
                  details[String(latest.id)]=await github.paginate(
                    github.rest.actions.listJobsForWorkflowRun,
                    {owner,repo,run_id:latest.id,per_page:100}
                  );
                }
              }
              report=gate.evaluate(sha,runs,details);
              if(report.engine_verdict!=='PENDING')break;
              if(attempt<35)await new Promise(resolve=>setTimeout(resolve,15000));
            }
            report={...report,source_repository:owner+'/'+repo,
              observed_at_utc:new Date().toISOString(),
              workflow_run_url:context.serverUrl+'/'+owner+'/'+repo+
                '/actions/runs/'+context.runId,
              pr_number:context.payload.pull_request?.number||null};
            fs.mkdirSync('stage-d-evidence',{recursive:true});
            fs.writeFileSync('stage-d-evidence/result.json',
              JSON.stringify(report,null,2)+'\n');
            const md=gate.markdown(report);
            fs.writeFileSync('stage-d-evidence/summary.md',md);
            await core.summary.addRaw(md).write();
            if(report.engine_verdict!=='PASS'){
              core.setFailed('Math P1/P5 Stage D engineering evidence not GREEN on exact SHA: '+
                report.engine_verdict+' pending='+report.pending.join(',')+
                ' failed='+report.failures.join(','));
            }
      - name: Preserve inspectable four-verdict evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-p1p5-stage-d-evidence
          path: stage-d-evidence/
          retention-days: 30
          if-no-files-found: warn
