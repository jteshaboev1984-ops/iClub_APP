name: TEMP Exam Prep Materials CSS Gate

on:
  push:
    branches:
      - exam-prep-css-threshold-v1
    paths:
      - exam-prep/exam-prep-materials.js
      - exam-prep/exam-prep-host.css
      - .github/scripts/p2_10_materials_ui_regression.js
      - .github/workflows/tmp-exam-prep-materials-css.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static safety checks
        run: |
          set -euo pipefail
          node --check exam-prep/exam-prep-materials.js
          node --check .github/scripts/p2_10_materials_ui_regression.js
          ! grep -q 'ep-materials-style' exam-prep/exam-prep-materials.js
          ! grep -q 'document.createElement("style")' exam-prep/exam-prep-materials.js
          ! grep -q 'localStorage' exam-prep/exam-prep-materials.js
          ! grep -q '\.from(' exam-prep/exam-prep-materials.js
          grep -q 'EXAM PREP CENTRALIZED MATERIALS v1' exam-prep/exam-prep-host.css
      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Materials learner regression
        run: node .github/scripts/p2_10_materials_ui_regression.js
      - name: Host bridge regression
        run: node .github/scripts/p0_14_host_regression.js
      - name: Combined learner views regression
        run: node .github/scripts/p0_22_live_view_coexistence_regression.js
