name: Mathematics contents OCR

on:
  push:
    branches: [mathematics-academic-audit]

permissions:
  contents: write

jobs:
  ocr:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathematics-academic-audit
          fetch-depth: 0
      - name: OCR front matter and contents
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr
          curl -L --fail --retry 3 \
            'https://mmmduffgpvwjdpruzikw.supabase.co/storage/v1/object/public/books/Complete_Pure_Mathematics_1_for_Cambridge_International_AS_%26_A_Level%20%282%29.pdf' \
            -o /tmp/mathematics.pdf
          mkdir -p /tmp/math_pages
          pdftoppm -f 1 -l 30 -r 180 -png /tmp/mathematics.pdf /tmp/math_pages/page >/dev/null 2>&1
          python - <<'PY'
          from pathlib import Path
          import subprocess
          out=['PURE MATHEMATICS 1 — FRONT MATTER OCR','']
          for p in sorted(Path('/tmp/math_pages').glob('page-*.png')):
              page_no=int(p.stem.split('-')[-1])
              proc=subprocess.run(['tesseract',str(p),'stdout','--psm','6'],capture_output=True,text=True)
              text=proc.stdout.strip()
              out.append(f'\n--- PDF PAGE {page_no} ---\n{text}')
          Path('docs/mathematics-front-matter-ocr.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit OCR result and remove workflow
        run: |
          rm -f .github/workflows/mathematics-toc-ocr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Mathematics front matter OCR'
          git push origin HEAD:mathematics-academic-audit
