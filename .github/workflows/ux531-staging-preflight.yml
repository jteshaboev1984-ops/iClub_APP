name: UX531 staging isolation preflight (NO deployment)
on:
  pull_request:
    paths:
      - 'qa/ux531-staging-preflight.cjs'
      - '.github/workflows/ux531-staging-preflight.yml'
      - 'docs/ui-redesign/24-ux531-staging-isolation-gate-20261115.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate fail-closed checker
        run: |
          node --check qa/ux531-staging-preflight.cjs
          node qa/ux531-staging-preflight.cjs --self-test
      - name: Inventory runtime production-backend references (read-only)
        run: node qa/ux531-staging-preflight.cjs --audit
      # --enforce intentionally NOT run here: no isolated backend or
      # approved SHA-pinned staging artifact exists yet. A green job
      # is NOT staging ready and must never be described as Work E2E.
