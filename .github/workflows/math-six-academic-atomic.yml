      - "scripts/math-six-academic-atomic-regression.cjs"
      - "scripts/fixtures/math-six-academic-post-publish-readonly.sql"
      - ".github/workflows/math-six-academic-atomic.yml"
  workflow_dispatch:
jobs:
  six-math-fixes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
