name: P2-55 Full Learner Journey

on:
  pull_request:
    branches:
      - main
    paths:
      - exam-prep/exam-prep-api.js
      - exam-prep/exam-prep-host.js
      - exam-prep/exam-prep-live.js
      - supabase/migrations/20260911141111_exam_prep_p2_41_active_assessment_feedback_guard_v1.sql
      - .github/scripts/p2_55_full_learner_journey_regression.js
      - .github/workflows/p2-55-full-learner-journey.yml
  push:
    branches:
      - main
    paths:
      - exam-prep/exam-prep-api.js
      - exam-prep/exam-prep-host.js
      - exam-prep/exam-prep-live.js
      - supabase/migrations/20260911141111_exam_prep_p2_41_active_assessment_feedback_guard_v1.sql
      - .github/scripts/p2_55_full_learner_journey_regression.js
      - .github/workflows/p2-55-full-learner-journey.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-learner-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate syntax and non-destructive boundary
        run: |
          set -euo pipefail
          node --check exam-prep/exam-prep-api.js
          node --check exam-prep/exam-prep-host.js
          node --check exam-prep/exam-prep-live.js
          node --check .github/scripts/p2_55_full_learner_journey_regression.js
          ! grep -q '\.from(' exam-prep/exam-prep-api.js
          ! grep -q '\.from(' exam-prep/exam-prep-host.js
          ! grep -q '\.from(' exam-prep/exam-prep-live.js
          ! grep -q 'localStorage' exam-prep/exam-prep-api.js
          ! grep -q 'localStorage' exam-prep/exam-prep-host.js
          ! grep -q 'localStorage' exam-prep/exam-prep-live.js
          grep -q 'feedback_deferred' .github/scripts/p2_55_full_learner_journey_regression.js
          grep -q 'P1 journey must not mutate independent P5 progress/state' .github/scripts/p2_55_full_learner_journey_regression.js
          grep -q 'Exam Prep journey must not mutate legacy localStorage state' .github/scripts/p2_55_full_learner_journey_regression.js

      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run full Stage 0 to 6 learner journey
        run: node .github/scripts/p2_55_full_learner_journey_regression.js
