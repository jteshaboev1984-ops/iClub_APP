name: Apply credential safe sync cutover

on:
  push:
    branches:
      - iclub-v3-implementation
    paths:
      - scripts/p0-credential-safe-sync-cutover.mjs
      - .github/workflows/apply-p0-credential-safe-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  credential-safe-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iclub-v3-implementation
          fetch-depth: 0

      - name: Apply guarded credential sync cutover
        run: node scripts/p0-credential-safe-sync-cutover.mjs

      - name: Syntax and security checks
        run: |
          node --check app.js
          node --check scripts/p0-credential-safe-sync-cutover.mjs
          git diff --check
          grep -q 'app.js?v=support4-p0credsafe1' index.html
          grep -q 'sync_user_credentials_safe_v1' app.js
          grep -q '__credDbReady = false' app.js
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { range } from './scripts/p0-02-aux-patcher.mjs';
          const app = fs.readFileSync('app.js','utf8');
          const fn = range(app,'syncCredentialsToSupabaseOnce').text;
          if (!fn.includes('window.sb.rpc("sync_user_credentials_safe_v1"')) throw new Error('safe credential RPC missing');
          if (fn.includes('.from("user_credentials")') || fn.includes('.upsert(') || fn.includes('.insert(') || fn.includes('.update(') || fn.includes('.delete(')) {
            throw new Error('credential sync still contains direct persistence');
          }
          if (!fn.includes('await ensureCredentialsDbSynced()')) throw new Error('authoritative rehydrate missing');
          NODE

      - name: Commit safe credential frontend
        run: |
          if git diff --quiet -- app.js index.html; then
            echo 'No credential frontend changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Use server-authoritative credential sync'
          git push origin HEAD:iclub-v3-implementation
