name: Exam Prep written equivalence and beta isolated E2E
on:
  pull_request:
    paths:
      - "scripts/exam-prep-written-beta-isolated-browser-acceptance.cjs"
      - "scripts/exam-prep-written-equivalent-methods-noncredit-regression.cjs"
      - "scripts/fixtures/exam-prep-written-companion-180-acceptance-readonly.sql"
      - "scripts/fixtures/exam-prep-controlled-beta-real-user-readiness-readonly.sql"
      - ".github/workflows/exam-prep-written-beta-isolated-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  academic-authority-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert fixtures never mutate learner state
        run: |
          set -euo pipefail
          node --check scripts/exam-prep-written-beta-isolated-browser-acceptance.cjs
          node --check scripts/exam-prep-written-equivalent-methods-noncredit-regression.cjs
          ! grep -Eiq '(SUPABASE_SERVICE_ROLE|SUPABASE_SECRET|service_role.*key|process\.env|https?://)' scripts/exam-prep-written-beta-isolated-browser-acceptance.cjs scripts/exam-prep-written-equivalent-methods-noncredit-regression.cjs
      - name: Equivalent method variants cannot create written grades
        run: node scripts/exam-prep-written-equivalent-methods-noncredit-regression.cjs
      - name: Governed non-grading contract
        run: node scripts/qa-exam-prep-written-lab-no-grading-v1.cjs
      - name: Written Core idempotence and network recovery
        run: node scripts/qa-written-core-controller-v1.cjs
      - name: Written contract static guard
        run: node scripts/qa-written-learning-contract-v1.cjs
  isolated-authenticated-ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned isolated Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Real Written Core view and controller, 3 languages and device sizes
        run: node scripts/exam-prep-written-beta-isolated-browser-acceptance.cjs
      - name: Existing real learner renderer with synthetic authorized RPC
        run: node scripts/progress-ux-authorized-journey.cjs
      - name: Existing timed answer ACK, offline and recovery browser matrix
        run: node scripts/exam-prep-timed-answer-ack-browser.cjs
