name: Exam Prep guarded answer recovery isolated browser
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/weekly-flow-answer-recovery-cutover.cjs'
      - 'scripts/weekly-flow-answer-loss-browser.cjs'
      - 'exam-prep/exam-prep-live.js'
      - '.github/workflows/exam-prep-weekly-answer-recovery.yml'
  push:
    branches: ['fix/exam-prep-weekly-goal-flow-safe']
    paths:
      - 'scripts/weekly-flow-answer-recovery-cutover.cjs'
      - 'scripts/weekly-flow-answer-loss-browser.cjs'
      - 'exam-prep/exam-prep-live.js'
      - '.github/workflows/exam-prep-weekly-answer-recovery.yml'
permissions:
  contents: read
jobs:
  isolated-answer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current audited source and immutable answer recovery fallback
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/weekly-flow-answer-recovery-cutover.cjs
          # Math #450 2026-11-17: reviewed exactly 69 additive Stage3-6 readiness lines
          # on released UX; all original answer-ACK/retry code and checks unchanged.
          # Preserve a strict *exact whole-file* pin, not a relaxed substring guard.
          # Math #450 fail-closed RPC handling is the only additional source edit.
          # Strict reviewed blob: 8a5bed9adf545ad03a3db7c30ff4fb48c6baffe3; legacy ACK/retry invariants unchanged.
          test "$(git hash-object exam-prep/exam-prep-live.js)" = '8a5bed9adf545ad03a3db7c30ff4fb48c6baffe3'
          grep -Fq 'data-ep-result-item-order=' exam-prep/exam-prep-live.js
          grep -Fq 'data-ep-result-session-type=' exam-prep/exam-prep-live.js
          grep -Fq 'async function reconcilePendingAnswer(pending)' exam-prep/exam-prep-live.js
          grep -Fq 'pending.idempotencyKey' exam-prep/exam-prep-live.js
          grep -Fq "['learning','mixed','retest'].includes(state.session.session_type)" exam-prep/exam-prep-live.js
          grep -Fq 'localization_status === "unavailable"' exam-prep/exam-prep-live.js
          node --check exam-prep/exam-prep-live.js
          git diff --exit-code
      - name: Install isolated browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Lost acknowledgments before and after commit, all three languages and two widths
        run: |
          node --check scripts/weekly-flow-answer-loss-browser.cjs
          node scripts/weekly-flow-answer-loss-browser.cjs
          node scripts/weekly-flow-native-browser-journey.cjs
          node scripts/weekly-flow-adapter-regression.cjs
          echo 'GREEN: no repository, production, or student writes.'
