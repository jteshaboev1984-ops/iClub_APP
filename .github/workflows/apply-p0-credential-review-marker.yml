name: Apply credential review marker cutover

on:
  push:
    branches:
      - iclub-v3-implementation
    paths:
      - scripts/p0-credential-review-marker-cutover.mjs
      - .github/workflows/apply-p0-credential-review-marker.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review-marker-cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iclub-v3-implementation
          fetch-depth: 0

      - name: Apply guarded review marker cutover
        run: node scripts/p0-credential-review-marker-cutover.mjs

      - name: Syntax and safety checks
        run: |
          node --check app.js
          node --check security/legacy-assessment-safe-api.js
          node --check scripts/p0-credential-review-marker-cutover.mjs
          git diff --check
          grep -q 'security/legacy-assessment-safe-api.js?v=p002v4cred1' index.html
          grep -q 'app.js?v=support4-p0credreview1' index.html
          grep -q 'record_practice_review_opened_safe_v1' security/legacy-assessment-safe-api.js
          grep -q 'safeApi.reviewOpened(dbAttemptId)' app.js
          grep -q 'const safeRows = await safeApi.review(dbAttemptId)' app.js
          ! grep -q '\.from("practice_review_events_v1")' app.js

      - name: Commit frontend cutover
        run: |
          if git diff --quiet -- app.js index.html security/legacy-assessment-safe-api.js; then
            echo 'No review marker frontend changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html security/legacy-assessment-safe-api.js
          git commit -m 'Record canonical Practice review evidence'
          git push origin HEAD:iclub-v3-implementation
