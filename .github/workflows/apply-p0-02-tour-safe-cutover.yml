name: Apply P0-02 Tour safe cutover

on:
  push:
    branches:
      - iclub-v3-implementation
    paths:
      - scripts/p0-02-tour-safe-cutover.mjs
      - scripts/run-p0-02-tour-safe-cutover.mjs
      - security/legacy-assessment-safe-api.js
      - .github/workflows/apply-p0-02-tour-safe-cutover.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-tour:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: iclub-v3-implementation
          fetch-depth: 0

      - name: Apply guarded active Tour cutover
        run: node scripts/run-p0-02-tour-safe-cutover.mjs

      - name: Syntax and Tour security checks
        run: |
          node --check app.js
          node --check security/legacy-assessment-safe-api.js
          node --check scripts/p0-02-tour-safe-cutover.mjs
          node --check scripts/run-p0-02-tour-safe-cutover.mjs
          git diff --check
          grep -q 'security/legacy-assessment-safe-api.js?v=p002v4tour1' index.html
          grep -q 'app.js?v=support4-p002v4tour1' index.html
          grep -q 'get_tour_preflight_questions_safe_v4' security/legacy-assessment-safe-api.js
          grep -q 'get_tour_review_full_safe_v4' security/legacy-assessment-safe-api.js
          grep -q 'tour_safe_preflight_error' app.js
          grep -q 'tour_safe_submit_error' app.js
          grep -q 'tour_safe_finalize_error' app.js
          grep -q 'tour_safe_review_error' app.js
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { range } from './scripts/p0-02-aux-patcher.mjs';
          const app = fs.readFileSync('app.js','utf8');
          const checks = [
            ['loadTourQuestionsDB', ['.from("tour_questions")','correct_answer']],
            ['fetchQuestionRuntimeSecrets', ['.from("questions")','correct_answer','explanation']],
            ['restoreActiveTourQuestionSecrets', ['.from("questions")']],
            ['upsertTourAnswer', ['.from("tour_answers")']],
            ['updateTourAttempt', ['.from("tour_attempts")']],
            ['renderTourReview', ['.from("tour_answers")','question:questions(']],
            ['openTourQuiz', ['createTourAttempt(','hasTourAttempt(']]
          ];
          for (const [name, banned] of checks) {
            const fn = range(app,name).text;
            for (const needle of banned) {
              if (fn.includes(needle)) throw new Error(`${name} still contains ${needle}`);
            }
          }
          const submit = range(app,'submitTourAnswer').text;
          if (!submit.includes('isCorrect: null') || submit.includes('restoreActiveTourQuestionSecrets(')) throw new Error('active Tour submit is not server-authoritative');
          const open = range(app,'openTourQuiz').text;
          if (!open.includes('tourApi.start(') || !open.includes('tourApi.questions(')) throw new Error('safe Tour start/questions missing');
          NODE

      - name: Commit patched Tour frontend
        run: |
          if git diff --quiet -- app.js index.html; then
            echo 'No Tour frontend changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Use safe v4 path for active Tours'
          git push origin HEAD:iclub-v3-implementation
