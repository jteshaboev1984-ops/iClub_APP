name: P1-06 Expanded Beta Readiness Gate

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/*exam_prep_p0_*.sql'
      - 'supabase/migrations/*exam_prep_p1_01_*.sql'
      - 'supabase/migrations/*exam_prep_p1_02_*.sql'
      - 'supabase/migrations/*exam_prep_p1_03_*.sql'
      - 'supabase/migrations/*exam_prep_p1_04_*.sql'
      - supabase/migrations/20260907103000_exam_prep_ai_initial_context_source_pack_v1.sql
      - supabase/migrations/20260907112000_exam_prep_p1_05_legacy_reference_adapter_v1.sql
      - supabase/tests/p0_15_contract_bootstrap.sql
      - supabase/tests/p0_15_internal_alpha_matrix.sql
      - supabase/tests/p1_03_ephemeral_legacy_helpers.sql
      - supabase/tests/p1_05_ephemeral_legacy_fixture.sql
      - supabase/tests/p1_05_legacy_reference_adapter_matrix.sql
      - supabase/tests/p1_06_expanded_beta_readiness_matrix.sql
      - .github/workflows/p1-06-expanded-beta-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expanded-beta-readiness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Initialize diagnostic log
        run: printf 'P1-06 expanded beta synthetic readiness gate\n' > p106-expanded-beta.log

      - name: Bootstrap minimum legacy and Supabase contract
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql 2>&1 | tee -a p106-expanded-beta.log

      - name: Mirror production answer helpers in ephemeral DB
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_03_ephemeral_legacy_helpers.sql 2>&1 | tee -a p106-expanded-beta.log

      - name: Apply real Exam Prep P0 foundation
        shell: bash
        run: |
          set -euo pipefail
          for stage in 04 05 06 07 08 09 10 11 12 13 15 16; do
            mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p0_${stage}_*.sql" | sort)
            test "${#files[@]}" -ge 1
            for f in "${files[@]}"; do
              echo "=== Applying $f ===" | tee -a p106-expanded-beta.log
              psql -v ON_ERROR_STOP=1 -f "$f" >>p106-expanded-beta.log 2>&1
            done
          done

      - name: Apply P1-01 through P1-03 production migrations
        shell: bash
        run: |
          set -euo pipefail
          for stage in 01 02 03; do
            mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p1_${stage}_*.sql" | sort)
            test "${#files[@]}" -ge 1
            for f in "${files[@]}"; do
              echo "=== Applying $f ===" | tee -a p106-expanded-beta.log
              psql -v ON_ERROR_STOP=1 -f "$f" >>p106-expanded-beta.log 2>&1
            done
          done

      - name: Apply P1-04 AI safety foundation and source pack
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*exam_prep_p1_04_*.sql' | sort)
          test "${#files[@]}" -ge 2
          for f in "${files[@]}"; do
            echo "=== Applying $f ===" | tee -a p106-expanded-beta.log
            psql -v ON_ERROR_STOP=1 -f "$f" >>p106-expanded-beta.log 2>&1
          done
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907103000_exam_prep_ai_initial_context_source_pack_v1.sql >>p106-expanded-beta.log 2>&1

      - name: Apply P1-05 read-only legacy adapter
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_05_ephemeral_legacy_fixture.sql 2>&1 | tee -a p106-expanded-beta.log
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907112000_exam_prep_p1_05_legacy_reference_adapter_v1.sql 2>&1 | tee -a p106-expanded-beta.log

      - name: Verify fail-closed ephemeral baseline
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql -Atqc "select rollout_state||'|'||core_enabled||'|'||ai_enabled||'|'||mentor_enabled||'|'||kill_switch from private.exam_prep_feature_config where id=1")"
          cards="$(psql -Atqc "select count(*) from private.exam_prep_ai_source_cards where approval_status='approved' and is_runtime_allowed and rights_status='original_iclub'")"
          generation="$(psql -Atqc "select generation_enabled from private.exam_prep_ai_policy where id=1")"
          echo "P106_BASELINE_STATE=$state" | tee -a p106-expanded-beta.log
          echo "P106_AI_CARDS=$cards" | tee -a p106-expanded-beta.log
          test "$state" = 'off|false|false|false|true'
          test "$cards" = '12'
          test "$generation" = 'f'

      - name: Re-run 600 learners / 10 mentor isolation drill on current schema
        shell: bash
        env:
          PGOPTIONS: '-c p015.isolated_db=true'
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_internal_alpha_matrix.sql 2>&1 | tee -a p106-expanded-beta.log

      - name: Validate P1-05 legacy reference remains non-crediting
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_05_legacy_reference_adapter_matrix.sql 2>&1 | tee -a p106-expanded-beta.log

      - name: Run P1-06 7 Core / 7 AI / 4 Mentor service-shape matrix
        shell: bash
        env:
          PGOPTIONS: '-c p106.isolated_db=true'
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_06_expanded_beta_readiness_matrix.sql 2>&1 | tee -a p106-expanded-beta.log

      - name: Prove zero synthetic residue
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql -Atqc "select rollout_state||'|'||core_enabled||'|'||ai_enabled||'|'||mentor_enabled||'|'||kill_switch from private.exam_prep_feature_config where id=1")"
          users="$(psql -Atqc "select count(*) from auth.users where email like 'p015-%@invalid.example' or email like 'p105-%@invalid.example' or email like 'p106-%@invalid.example'")"
          recs="$(psql -Atqc "select count(*) from private.exam_prep_human_review_recommendations where source_object_type in ('p015_scale','p106_expanded')")"
          queues="$(psql -Atqc "select count(*) from private.exam_prep_mentor_queue_items")"
          evidence="$(psql -Atqc "select count(*) from private.exam_prep_evidence_events")"
          cards="$(psql -Atqc "select count(*) from private.exam_prep_ai_source_cards where approval_status='approved' and is_runtime_allowed")"
          echo "P106_POST_STATE=$state" | tee -a p106-expanded-beta.log
          echo "P106_POST_SYNTHETIC_USERS=$users" | tee -a p106-expanded-beta.log
          echo "P106_POST_RECOMMENDATIONS=$recs" | tee -a p106-expanded-beta.log
          echo "P106_POST_MENTOR_QUEUE=$queues" | tee -a p106-expanded-beta.log
          echo "P106_POST_EVIDENCE=$evidence" | tee -a p106-expanded-beta.log
          test "$state" = 'off|false|false|false|true'
          test "$users" = '0'
          test "$recs" = '0'
          test "$queues" = '0'
          test "$evidence" = '0'
          test "$cards" = '12'
          echo 'P1-06 expanded beta readiness gate: GREEN' | tee -a p106-expanded-beta.log

      - name: Upload P1-06 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-06-expanded-beta-readiness-diagnostics
          path: p106-expanded-beta.log
          if-no-files-found: error
          retention-days: 3
