name: TEMP Activate Math Exam Prep UX Architecture

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-math-exam-prep-ux-activate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  math-exam-prep-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged UX architecture patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tmp_math_exam_prep_ux_patch.py

          # Keep existing public cache keys and permanent workflows untouched in
          # the bot commit. Permanent gate wiring is updated separately after
          # the tested UI commit lands.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('visual/iclub-premium-v3.css?v=premium2', 'visual/iclub-premium-v3.css?v=premium1')
          s = s.replace('exam-prep/exam-prep-host.css?v=p014ux2', 'exam-prep/exam-prep-host.css?v=p014h1')
          s = s.replace('exam-prep/exam-prep-host.js?v=p014ux2', 'exam-prep/exam-prep-host.js?v=p014h1')
          p.write_text(s, encoding='utf-8')
          PY
          git checkout -- .github/workflows/visual-v3-premium.yml \
            .github/workflows/p0-14-host-regression.yml \
            .github/scripts/visual_v3_premium_regression.js \
            .github/scripts/p0_14_legacy_off_regression.js

      - name: Static safety and architecture checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check exam-prep/exam-prep-host.js
          node --check exam-prep/exam-prep-live.js
          node --check .github/scripts/visual_v3_math_exam_prep_ux_regression.js
          grep -q 'exam-prep-feature-card' index.html
          grep -q 'id="subject-hub-exam-prep-entry"[^>]*hidden[^>]*aria-hidden="true"' index.html
          grep -q 'data-action="open-exam-prep"' index.html
          grep -q 'exam-prep-available' exam-prep/exam-prep-host.js
          grep -q 'ep-live-dashboard-intro' exam-prep/exam-prep-live.js
          grep -q 'ep-live-component-card' exam-prep/exam-prep-live.js
          grep -q 'PREMIUM MATHEMATICS EXAM PREP UX v3' visual/iclub-premium-v3.css
          ! grep -q 'localStorage' exam-prep/exam-prep-host.js
          ! grep -q 'localStorage' exam-prep/exam-prep-live.js
          ! grep -q '\.from(' exam-prep/exam-prep-host.js
          ! grep -q '\.from(' exam-prep/exam-prep-live.js

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run existing Exam Prep regression matrix
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/p0_14_host_regression.js
          node .github/scripts/p0_17_live_diagnostic_regression.js
          node .github/scripts/p0_18_live_plan_regression.js
          node .github/scripts/p0_19_live_timed_readiness_regression.js
          node .github/scripts/p0_20_live_tracker_corrections_regression.js
          node .github/scripts/p0_21_live_overview_placement_regression.js
          node .github/scripts/p0_22_live_view_coexistence_regression.js
          node .github/scripts/p2_09_exam_map_ui_regression.js
          node .github/scripts/p2_10_materials_ui_regression.js
          node .github/scripts/p2_13_stage0_workflow_ui_regression.js

      - name: Run premium UX regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/math-exam-prep-ux-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.2
          done
          node .github/scripts/visual_v3_premium_regression.js
          node .github/scripts/visual_v3_premium_extended_regression.js
          node .github/scripts/visual_v3_assessment_regression.js
          node .github/scripts/visual_v3_math_exam_prep_ux_regression.js

      - name: Commit only tested UI architecture files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html \
            exam-prep/exam-prep-host.js \
            exam-prep/exam-prep-live.js \
            exam-prep/exam-prep-host.css \
            visual/iclub-premium-v3.css \
            .github/scripts/visual_v3_math_exam_prep_ux_regression.js
          if git diff --cached --quiet; then
            echo 'No UI changes to commit.'
            exit 0
          fi
          git commit -m 'feat(ui): redesign Mathematics Exam Prep experience'
          git push origin HEAD:main
