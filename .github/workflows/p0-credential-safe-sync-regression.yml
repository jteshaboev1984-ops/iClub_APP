name: Credential safe sync regression

on:
  push:
    branches:
      - iclub-v3-implementation
    paths:
      - .github/workflows/p0-credential-safe-sync-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iclub-v3-implementation

      - name: Static credential boundary checks
        run: |
          grep -q 'security/legacy-assessment-safe-api.js?v=p002v4cred1' index.html
          grep -q 'app.js?v=support4-p0credsafe1' index.html
          grep -q 'sync_user_credentials_safe_v1' app.js
          grep -q 'record_practice_review_opened_safe_v1' security/legacy-assessment-safe-api.js
          grep -q 'safeApi.reviewOpened(dbAttemptId)' app.js
          node --check app.js
          node --check security/legacy-assessment-safe-api.js
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { range } from './scripts/p0-02-aux-patcher.mjs';
          const app = fs.readFileSync('app.js','utf8');
          const fn = range(app,'syncCredentialsToSupabaseOnce').text;
          if (!fn.includes('window.sb.rpc("sync_user_credentials_safe_v1"')) throw new Error('safe credential RPC missing');
          if (fn.includes('.from("user_credentials")') || fn.includes('.upsert(') || fn.includes('.insert(') || fn.includes('.update(') || fn.includes('.delete(')) throw new Error('direct credential persistence remains');
          if (!fn.includes('await ensureCredentialsDbSynced()')) throw new Error('authoritative rehydrate missing');
          NODE

      - name: Install Chromium harness
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/iclub-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/iclub-http.log
          exit 1

      - name: Browser smoke
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            const pageErrors = [];
            const localFailures = [];
            page.on('pageerror', e => pageErrors.push(String(e?.stack || e?.message || e)));
            page.on('requestfailed', req => {
              try {
                const u = new URL(req.url());
                if (u.hostname === '127.0.0.1' || u.hostname === 'localhost') localFailures.push(`${req.method()} ${req.url()} :: ${req.failure()?.errorText || 'failed'}`);
              } catch {}
            });
            const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            assert(response?.ok(), `root response not OK: ${response?.status()}`);
            await page.waitForTimeout(5000);
            const result = await page.evaluate(() => ({
              bodyTextLen: (document.body?.innerText || '').trim().length,
              hasApp: !!document.querySelector('#app'),
              hasActiveView: !!document.querySelector('.view.is-active'),
              scripts: Array.from(document.scripts).map(s => s.getAttribute('src') || ''),
              safeApi: !!window.iclubSafeAssessment,
              reviewOpened: typeof window.iclubSafeAssessment?.practice?.reviewOpened === 'function'
            }));
            assert(result.bodyTextLen > 20, 'blank page');
            assert(result.hasApp && result.hasActiveView, 'app shell missing');
            assert(result.scripts.some(x => x.includes('security/legacy-assessment-safe-api.js?v=p002v4cred1')), 'safe API cache key missing');
            assert(result.scripts.some(x => x.includes('app.js?v=support4-p0credsafe1')), 'app cache key missing');
            assert(result.safeApi && result.reviewOpened, 'safe credential/review API not available');
            assert(pageErrors.length === 0, `page errors: ${JSON.stringify(pageErrors)}`);
            assert(localFailures.length === 0, `asset failures: ${JSON.stringify(localFailures)}`);
            console.log(JSON.stringify({ok:true,...result,pageErrors,localFailures}, null, 2));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
