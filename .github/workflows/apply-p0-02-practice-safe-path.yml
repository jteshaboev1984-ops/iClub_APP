name: Apply P0-02 Practice safe path

on:
  push:
    branches:
      - iclub-v3-implementation
    paths:
      - scripts/p0-02-aux-patcher.mjs
      - scripts/p0-02-aux-step1.mjs
      - scripts/p0-02-aux-step2.mjs
      - scripts/p0-02-aux-step3.mjs
      - scripts/p0-02-aux-step4.mjs
      - scripts/p0-02-aux-step5.mjs
      - .github/workflows/apply-p0-02-practice-safe-path.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-practice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: iclub-v3-implementation
          fetch-depth: 0

      - name: Apply guarded auxiliary Practice cutover
        run: |
          node scripts/p0-02-aux-step5.mjs

      - name: Syntax and security checks
        run: |
          node --check app.js
          node --check security/legacy-assessment-safe-api.js
          node --check scripts/p0-02-aux-step5.mjs
          git diff --check
          grep -q 'security/legacy-assessment-safe-api.js?v=p002v4aux1' index.html
          grep -q 'app.js?v=support4-p002v4aux2' index.html
          grep -q 'subject_hub_safe_v4' app.js
          grep -q 'handlePracticeSubmitSafe' app.js
          grep -q 'handlePracticeDrillSubmitSafe' app.js
          grep -q 'safeDrillSessionId' app.js
          grep -q 'practiceSafeReviewRowsToDetails' app.js
          grep -q 'practice_drill_safe_submit_error' app.js
          test "$(grep -c 'buildPracticeSetByQuestionIds' app.js)" -eq 1
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { range } from './scripts/p0-02-aux-patcher.mjs';
          const app = fs.readFileSync('app.js', 'utf8');
          const fn = range(app, 'buildPracticeSetByQuestionIds').text;
          if (fn.includes('.from("questions")') || fn.includes('correct_answer')) process.exit(1);
          NODE

      - name: Commit patched frontend
        run: |
          if git diff --quiet -- app.js index.html; then
            echo 'No frontend changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Remove final legacy Practice answer-key builder'
          git push origin HEAD:iclub-v3-implementation
