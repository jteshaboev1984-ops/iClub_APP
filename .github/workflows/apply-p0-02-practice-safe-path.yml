name: Apply P0-02 Practice safe path

on:
  push:
    branches:
      - iclub-v3-implementation
    paths:
      - scripts/apply-p0-02-practice-safe-path.mjs
      - .github/workflows/apply-p0-02-practice-safe-path.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-practice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: iclub-v3-implementation
          fetch-depth: 0

      - name: Apply guarded Practice patch
        run: node scripts/apply-p0-02-practice-safe-path.mjs

      - name: Syntax and whitespace checks
        run: |
          node --check app.js
          node --check security/legacy-assessment-safe-api.js
          git diff --check
          grep -q 'security/legacy-assessment-safe-api.js?v=p002v4' index.html
          grep -q 'subject_hub_safe_v4' app.js
          grep -q 'handlePracticeSubmitSafe' app.js
          grep -q 'finishPracticeSafe' app.js

      - name: Commit patched frontend
        run: |
          if git diff --quiet -- app.js index.html; then
            echo 'No frontend changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Use safe v4 path for main Practice'
          git push origin HEAD:iclub-v3-implementation
