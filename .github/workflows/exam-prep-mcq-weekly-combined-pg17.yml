name: Exam Prep MCQ + weekly flow combined PG17
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/exam-prep-mcq-weekly-combined-pg17.yml'
      - 'supabase/migrations/*exam_prep*.sql'
      - 'supabase/tests/exam_prep_mcq_feature_on_rollback_v1.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GITHUB_ACTIONS: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGOPTIONS: '-c weekly_goal.isolated_db=true -c mcq_on.isolated_db=true'
      WEEKLY_PIN: b0bc1aab47f8d34c1b4aae629a4b5a317986d683
    steps:
      - name: Checkout MCQ candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable weekly-flow candidate separately
        uses: actions/checkout@v4
        with:
          ref: b0bc1aab47f8d34c1b4aae629a4b5a317986d683
          path: weekly-source
          persist-credentials: false
      - name: Prove immutable weekly lineage and current released assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C weekly-source rev-parse HEAD)" = "$WEEKLY_PIN"
          test ! -e weekly-source/supabase/migrations/20260921220000_exam_prep_mcq_server_frozen_order_v1.sql
          test -f docs/patch-proposals/20260920_weekly_flow_preinstall_rpc_backup_v1.sql
          test -f supabase/tests/exam_prep_frozen_goal_continuity_isolated_matrix.sql
          test -f supabase/migrations/20260923111304_exam_prep_weekly_flow_release_v1.sql
          test -f supabase/migrations/20260921220100_exam_prep_mcq_order_strict_validation_v1.sql
      - name: Rehearse released weekly package rollback with MCQ migrations
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/weekly-flow-review-rollback-isolated.sh
      - name: Run actual MCQ feature-ON scoring through weekly RPC wrappers and rollback
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE private.exam_prep_feature_config SET rollout_state='controlled_beta',core_enabled=true,ai_enabled=false,mentor_enabled=false,kill_switch=false WHERE id=1"
          psql -X -v ON_ERROR_STOP=1 -v mcq_git_sha="$(git rev-parse HEAD)" -f supabase/tests/exam_prep_mcq_feature_on_rollback_v1.sql
      - name: Rehearse enrolled noncredit review, scored answer and frozen-goal lineage WITH MCQ ON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('supabase/tests/exam_prep_frozen_goal_continuity_isolated_matrix.sql').read_text()
          begin='\nBEGIN;\n'
          point=" review_session:=(v_result->>'session_id')::uuid;"
          decl=' version_no integer; v_result jsonb; v_count integer;'
          assert source.count(begin)==source.count(point)==source.count(decl)==1, 'Weekly fixture changed: fail closed'
          source=source.replace(begin,begin+"UPDATE private.exam_prep_mcq_order_rollout_v1 SET enabled=true,enabled_at=now() WHERE singleton;\n",1)
          source=source.replace(decl,decl+"\n review_mcq private.exam_prep_session_items%rowtype;\n review_source_letter text; review_display_index integer; review_response jsonb;",1)
          addition="""
          IF (SELECT count(*) FROM private.exam_prep_session_items si JOIN public.questions q ON q.id=si.question_id AND q.qtype='mcq'
              WHERE si.session_id=review_session AND si.display_to_source IS NOT NULL)<>3 THEN
            RAISE EXCEPTION 'Combined integration: review lacks three server-frozen MCQs';
          END IF;
          IF EXISTS(SELECT 1 FROM private.exam_prep_session_items si JOIN public.questions q ON q.id=si.question_id AND q.qtype='mcq'
              WHERE si.session_id=review_session AND (array_length(si.display_to_source,1)<>4
                OR NOT si.display_to_source @> ARRAY[0,1,2,3]::smallint[])) THEN
            RAISE EXCEPTION 'Combined integration: review permutation invalid';
          END IF;
          SELECT si.* INTO STRICT review_mcq FROM private.exam_prep_session_items si
          JOIN public.questions q ON q.id=si.question_id AND q.qtype='mcq'
          WHERE si.session_id=review_session ORDER BY si.item_order LIMIT 1;
          SELECT correct_answer INTO STRICT review_source_letter FROM public.questions WHERE id=review_mcq.question_id;
          review_display_index:=array_position(review_mcq.display_to_source,
            (ascii(review_source_letter)-65)::smallint)-1;
          IF review_display_index NOT BETWEEN 0 AND 3 THEN
            RAISE EXCEPTION 'Combined integration: correct source choice not in frozen display';
          END IF;
          review_response:=public.submit_exam_prep_response_safe_v1(
            review_session,review_mcq.item_order,jsonb_build_object('picked_index',review_display_index),
            'combined-review-answer-0001',1000,'ru');
          IF review_response->>'selected_answer' IS DISTINCT FROM chr(65+review_display_index)
          OR NOT EXISTS(SELECT 1 FROM private.exam_prep_responses r
              JOIN private.exam_prep_evidence_events e ON e.response_id=r.id
              WHERE r.session_id=review_session AND r.item_order=review_mcq.item_order
              AND r.is_correct IS TRUE
              AND r.picked_index=review_mcq.display_to_source[review_display_index+1])
          OR EXISTS(SELECT 1 FROM private.exam_prep_sessions s
              JOIN private.exam_prep_session_authorizations a ON a.id=s.authorization_id
              WHERE s.id=review_session AND (a.academic_credit IS TRUE OR a.credit_context<>'learning_review'))
          THEN RAISE EXCEPTION 'Combined integration: review scoring or noncredit boundary drift'; END IF;
          review_response:=public.submit_exam_prep_response_safe_v1(
            review_session,review_mcq.item_order,jsonb_build_object('picked_index',review_display_index),
            'combined-review-answer-0001',1000,'uz');
          IF review_response->>'selected_answer' IS DISTINCT FROM chr(65+review_display_index)
          OR (review_response->>'replayed')::boolean IS DISTINCT FROM true
          OR (SELECT count(*) FROM private.exam_prep_responses r
              WHERE r.session_id=review_session AND r.item_order=review_mcq.item_order)<>1
          THEN RAISE EXCEPTION 'Combined integration: saved answer replay/locale changed'; END IF;
          """
          source=source.replace(point,point+addition,1)
          Path('/tmp/mcq-weekly-both-on.sql').write_text(source)
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/mcq-weekly-both-on.sql
      - name: Assert both rollout and evidence remain clean after all transactions
        shell: bash
        run: |
          set -euo pipefail
          psql -X -At -v ON_ERROR_STOP=1 <<'SQL'
          DO $$BEGIN
            IF (SELECT enabled FROM private.exam_prep_mcq_order_rollout_v1 WHERE singleton) IS DISTINCT FROM false
               OR EXISTS(SELECT 1 FROM private.exam_prep_synthetic_identities WHERE run_id='SV-MCQ-ON-ROLLBACK')
               OR EXISTS(SELECT 1 FROM private.exam_prep_session_items WHERE display_to_source IS NOT NULL)
               OR EXISTS(SELECT 1 FROM public.users WHERE first_name='FrozenGoalContinuityFixture')
            THEN RAISE EXCEPTION 'Cross-branch rehearsal left synthetic residue'; END IF;
          END$$;
          SQL
          echo 'GREEN: PR121+PR141 enrolled noncredit scored review, locale retry, original goal, no legacy mutations, full rollback on isolated PG17.'