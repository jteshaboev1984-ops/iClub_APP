name: Written Understanding Checks v1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/*exam_prep*.sql'
      - supabase/tests/written_understanding_checks_v1_matrix.sql
      - supabase/tests/written_understanding_learning_only_gate.sql
      - exam-prep/exam-prep-api.js
      - exam-prep/exam-prep-written-understanding-ui.js
      - .github/scripts/written_understanding_checks_v1_regression.js
      - .github/scripts/written_understanding_single_copy_regression.js
      - .github/workflows/written-understanding-checks-v1.yml
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/*exam_prep*.sql'
      - supabase/tests/written_understanding_checks_v1_matrix.sql
      - supabase/tests/written_understanding_learning_only_gate.sql
      - exam-prep/exam-prep-api.js
      - exam-prep/exam-prep-written-understanding-ui.js
      - .github/scripts/written_understanding_checks_v1_regression.js
      - .github/scripts/written_understanding_single_copy_regression.js
      - .github/workflows/written-understanding-checks-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  written-understanding:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Static JavaScript checks
        run: |
          set -euo pipefail
          node --check exam-prep/exam-prep-api.js
          node --check exam-prep/exam-prep-written-understanding-ui.js
          node --check .github/scripts/written_understanding_checks_v1_regression.js
          node --check .github/scripts/written_understanding_single_copy_regression.js
          grep -q 'exam-prep-written-understanding-ui.js?v=written3' exam-prep/exam-prep-api.js
          grep -q 'check_version' exam-prep/exam-prep-written-understanding-ui.js
          ! grep -q 'correct_index' exam-prep/exam-prep-written-understanding-ui.js
          ! grep -q 'localStorage' exam-prep/exam-prep-written-understanding-ui.js
          ! grep -q 'iclub_state_v1' exam-prep/exam-prep-written-understanding-ui.js

      - name: Bootstrap isolated legacy and Supabase contract
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_03_ephemeral_legacy_helpers.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_05_ephemeral_legacy_fixture.sql

      - name: Apply complete current Exam Prep migration stack
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*exam_prep*.sql' | sort)
          test "${#files[@]}" -ge 1

          apply_one() {
            local f="$1"
            local b
            b="$(basename "$f")"
            if [[ "$b" == '20260907061000_exam_prep_stage3_key_registry_v1.sql' ]]; then
              psql -v ON_ERROR_STOP=1 -c "update private.exam_prep_feature_config set rollout_state='controlled_beta',core_enabled=true,ai_enabled=false,mentor_enabled=false,kill_switch=false,updated_at=now() where id=1" >/dev/null
            fi
            if [[ "$b" == '20260911114829_exam_prep_p2_34_stage4_timed_section_majority_gate_v1.sql' ]]; then
              psql -v ON_ERROR_STOP=1 -f supabase/tests/p2_36_current_schema_replay_compat.sql >/dev/null
            fi
            if [[ "$b" == '20260911121959_exam_prep_p2_36_real_expansion_governance_gate_v1.sql' ]]; then
              psql -v ON_ERROR_STOP=1 -c "insert into private.exam_prep_beta_cohorts(cohort_key,program_key,cohort_status,planned_size,current_wave,monitoring_hours,notes) values('written-understanding-ci','math_as_p1_p5','draft',12,0,72,'isolated written understanding dependency') on conflict(cohort_key) do nothing" >/dev/null
            fi
            echo "=== Applying $b ==="
            psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null
          }

          recent=(
            '20260910121500_exam_prep_p2_17_preserve_learning_priority_v1.sql'
            '20260910160000_exam_prep_mixed_same_section_transfer_fix.sql'
            '20260910162000_exam_prep_retention_authorizer_reconcile.sql'
            '20260910164500_exam_prep_p2_18_weekly_plan_actionability_v1.sql'
            '20260910121001_exam_prep_p2_19_fresh_retest_and_plan_binding_v1.sql'
            '20260910130529_exam_prep_p2_20_mixed_mastery_area_guard_v1.sql'
          )

          for f in "${files[@]}"; do
            b="$(basename "$f")"
            case "$b" in
              '20260910121500_exam_prep_p2_17_preserve_learning_priority_v1.sql'|\
              '20260910160000_exam_prep_mixed_same_section_transfer_fix.sql'|\
              '20260910162000_exam_prep_retention_authorizer_reconcile.sql'|\
              '20260910164500_exam_prep_p2_18_weekly_plan_actionability_v1.sql'|\
              '20260910121001_exam_prep_p2_19_fresh_retest_and_plan_binding_v1.sql'|\
              '20260910130529_exam_prep_p2_20_mixed_mastery_area_guard_v1.sql')
                if [[ "$b" == '20260910164500_exam_prep_p2_18_weekly_plan_actionability_v1.sql' ]]; then
                  for rb in "${recent[@]}"; do apply_one "supabase/migrations/$rb"; done
                fi
                continue
                ;;
            esac
            apply_one "$f"
          done

      - name: Run database security and authority matrix
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/written_understanding_checks_v1_matrix.sql

      - name: Prove understanding checks remain learning-only
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/written_understanding_learning_only_gate.sql

      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Prove established no-check written flow is unchanged
        run: node .github/scripts/p0_18_live_plan_regression.js

      - name: Run written understanding browser regression
        run: node .github/scripts/written_understanding_checks_v1_regression.js

      - name: Run single/plural learner copy regression
        run: node .github/scripts/written_understanding_single_copy_regression.js
