  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-http-auth:
    name: actual Math UI JWT PostgREST PG17
    # Playwright 1.55 supports Ubuntu 24.04, not ubuntu-latest's 26.04.
    # Fixed OS only for disposable CI, no production hosting change.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      P1P5_E2E_ISOLATED: 'true'
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert only exact current candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -f supabase/tests/p0_15_contract_bootstrap.sql
      - name: Bootstrap isolated legacy and Supabase contract
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql 2>&1 | tee -a p273-rehearsal.log
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_03_ephemeral_legacy_helpers.sql 2>&1 | tee -a p273-rehearsal.log
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_05_ephemeral_legacy_fixture.sql 2>&1 | tee -a p273-rehearsal.log

      - name: Apply complete current Exam Prep migration stack
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*exam_prep*.sql' | sort)
          test "${#files[@]}" -ge 1

          apply_one() {
            local f="$1"
            local b
            b="$(basename "$f")"
            if [[ "$b" == '20260907061000_exam_prep_stage3_key_registry_v1.sql' ]]; then
              echo '=== Replaying production Core-only controlled-beta boundary ===' | tee -a p273-rehearsal.log
              psql -v ON_ERROR_STOP=1 -c "update private.exam_prep_feature_config set rollout_state='controlled_beta',core_enabled=true,ai_enabled=false,mentor_enabled=false,kill_switch=false,updated_at=now() where id=1" >>p273-rehearsal.log 2>&1
            fi
            if [[ "$b" == '20260911114829_exam_prep_p2_34_stage4_timed_section_majority_gate_v1.sql' ]]; then
              echo '=== Normalizing historical Stage-4 patch anchors in isolated CI only ===' | tee -a p273-rehearsal.log
              psql -v ON_ERROR_STOP=1 -f supabase/tests/p2_36_current_schema_replay_compat.sql >>p273-rehearsal.log 2>&1
            fi
            if [[ "$b" == '20260911121959_exam_prep_p2_36_real_expansion_governance_gate_v1.sql' ]]; then
              echo '=== Seeding isolated production-shaped cohort dependency ===' | tee -a p273-rehearsal.log
              psql -v ON_ERROR_STOP=1 -c "insert into private.exam_prep_beta_cohorts(cohort_key,program_key,cohort_status,planned_size,current_wave,monitoring_hours,notes) values('p236-ci-cohort','math_as_p1_p5','draft',12,0,72,'isolated P2-73 rehearsal dependency') on conflict(cohort_key) do nothing" >>p273-rehearsal.log 2>&1
            fi
            echo "=== Applying $f ===" | tee -a p273-rehearsal.log
            psql -v ON_ERROR_STOP=1 -f "$f" >>p273-rehearsal.log 2>&1
          }

          recent=(
            '20260910121500_exam_prep_p2_17_preserve_learning_priority_v1.sql'
            '20260910160000_exam_prep_mixed_same_section_transfer_fix.sql'
            '20260910162000_exam_prep_retention_authorizer_reconcile.sql'
            '20260910164500_exam_prep_p2_18_weekly_plan_actionability_v1.sql'
            '20260910121001_exam_prep_p2_19_fresh_retest_and_plan_binding_v1.sql'
            '20260910130529_exam_prep_p2_20_mixed_mastery_area_guard_v1.sql'
          )

          for f in "${files[@]}"; do
            b="$(basename "$f")"
            case "$b" in
              '20260910121500_exam_prep_p2_17_preserve_learning_priority_v1.sql'|\
              '20260910160000_exam_prep_mixed_same_section_transfer_fix.sql'|\
              '20260910162000_exam_prep_retention_authorizer_reconcile.sql'|\
              '20260910164500_exam_prep_p2_18_weekly_plan_actionability_v1.sql'|\
              '20260910121001_exam_prep_p2_19_fresh_retest_and_plan_binding_v1.sql'|\
              '20260910130529_exam_prep_p2_20_mixed_mastery_area_guard_v1.sql')
                if [[ "$b" == '20260910164500_exam_prep_p2_18_weekly_plan_actionability_v1.sql' ]]; then
                  echo '=== Replaying P2-17..P2-20 in production migration order ===' | tee -a p273-rehearsal.log
                  for rb in "${recent[@]}"; do
                    apply_one "supabase/migrations/$rb"
                  done
                fi
                continue
                ;;
            esac
            apply_one "$f"
          done

          echo '=== Reset isolated harness to fail-closed baseline ===' | tee -a p273-rehearsal.log
          psql -v ON_ERROR_STOP=1 -c "update private.exam_prep_feature_config set rollout_state='off',core_enabled=false,ai_enabled=false,mentor_enabled=false,kill_switch=true,updated_at=now() where id=1" >>p273-rehearsal.log 2>&1


      - name: Seed ONLY disposable authenticated learners
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1p5_isolated_http_auth_e2e_seed.sql > /tmp/p1p5-e2e-seed.log
          echo "Disposable seed applied; no live project, token or account involved"
      - name: D10-10 versioned 5 protected P1 drafts and 6 assessments (CI synthetic-only ROLLBACK)
        shell: bash
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          test "$P1P5_E2E_ISOLATED" = "true"
          test "$PGDATABASE" = "postgres"
          node --check scripts/ops/p1p5-d10-10-private-five-versioned-stage.cjs
          node --check scripts/p1p5-d10-10-private-five-versioned-stage-isolated-test.cjs
          node scripts/p1p5-d10-10-private-five-versioned-stage-isolated-test.cjs | tee /tmp/d10-10-versioned-private-five.log
          grep -Fq 'D10-10 SOURCE VERSIONED FIVE PASS:' /tmp/d10-10-versioned-private-five.log

      - name: Generate ephemeral JWT signing key and start local PostgREST
        shell: bash
        run: |
          set -euo pipefail
          disposable_jwt_secret="$(openssl rand -hex 48)"
          echo "::add-mask::$disposable_jwt_secret"
          echo "P1P5_E2E_JWT_SECRET=$disposable_jwt_secret" >> "$GITHUB_ENV"
          docker pull postgrest/postgrest:v12.2.3
      - name: Start disposable HTTP API
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name iclub-p1p5-local-postgrest --network host \
            -e PGRST_DB_URI="postgres://postgres:postgres@127.0.0.1:5432/postgres" \
            -e PGRST_DB_SCHEMA="public" -e PGRST_DB_ANON_ROLE="anon" \
            -e PGRST_JWT_SECRET="$P1P5_E2E_JWT_SECRET" \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 45); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/ || true)"
            if [[ "$status" =~ ^(200|400|401|404)$ ]]; then
              echo "Local PostgREST responding with HTTP $status"
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 30 iclub-p1p5-local-postgrest
          exit 1
      - name: Install isolated Chromium and validate test syntax
        run: |
          set -euo pipefail
          node --check scripts/p1p5-isolated-http-auth-e2e.cjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run ACTUAL authenticated HTTP P1 and P5 browser diagnostic, owned resume, security denial
        run: |
          set -euo pipefail
          node scripts/p1p5-isolated-http-auth-e2e.cjs
      - name: D09-04 original plan week plus independent P1 P5 diagnostic weeks (RU UZ EN Chromium)
        run: |
          set -euo pipefail
          test "$P1P5_E2E_ISOLATED" = "true"
          node --check exam-prep/exam-prep-live.js
          node --check exam-prep/exam-prep-weekly-flow-adapter.js
          node --check scripts/p1p5-d09-04-academic-week-label-browser.cjs
          node scripts/p1p5-d09-04-academic-week-label-browser.cjs | tee /tmp/p1p5-d09-04-week-label.log
          grep -Fq 'PASS D09-04 native ru 390px' /tmp/p1p5-d09-04-week-label.log
          grep -Fq 'PASS D09-04 native uz 1280px' /tmp/p1p5-d09-04-week-label.log
          grep -Fq 'PASS D09-04 native en 1280px' /tmp/p1p5-d09-04-week-label.log
      - name: Extra Hard owner-only noncredit protected-key HTTP with disposable example
        run: |
          set -euo pipefail
          node --check scripts/p1p5-extra-hard-real-http.cjs
          node scripts/p1p5-extra-hard-real-http.cjs
          node --check scripts/ops/p1p5-extra-hard-private-full42-check-v3.cjs
          node --check scripts/p1p5-extra-hard-topic-progress-browser.cjs
          node scripts/p1p5-extra-hard-topic-progress-browser.cjs | tee /tmp/extra-hard-topic-ui.log
          grep -Fq 'EXTRA HARD TOPIC PROGRESS BROWSER PASS:' /tmp/extra-hard-topic-ui.log
          node --check scripts/ops/p1p5-extra-hard-private-bank-v2.cjs
          PGOPTIONS="-c iclub.e2e_isolated=true" psql -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/p1p5_extra_hard_new_bank_v2_disposable.sql \
            2>&1 | tee /tmp/extra-hard-new-bank-v2.log
          grep -Fq 'EXTRA HARD NEW BANK V2 PASS:' /tmp/extra-hard-new-bank-v2.log
          node --check scripts/p1p5-extra-hard-private-stage-v2-isolated-test.cjs
          node scripts/p1p5-extra-hard-private-stage-v2-isolated-test.cjs | tee /tmp/extra-hard-v2-private-staging.log
          grep -Fq 'EXTRA HARD V2 PRIVATE STAGING PASS:' /tmp/extra-hard-v2-private-staging.log
          grep -Fq 'EXTRA HARD V2 SYNTHETIC CLEANUP PASS:' /tmp/extra-hard-v2-private-staging.log
          node --check scripts/ops/p1p5-extra-hard-private-full42-stage-v3.cjs
          node --check scripts/p1p5-extra-hard-full42-stage-v3-isolated-test.cjs
          node scripts/p1p5-extra-hard-full42-stage-v3-isolated-test.cjs | tee /tmp/extra-hard-v3-42-staging.log
          grep -Fq 'EXTRA HARD V3 42-ROW PRIVATE COPY ROLLBACK PASS:' /tmp/extra-hard-v3-42-staging.log
          node --check scripts/ops/p1p5-extra-hard-private-full42-stage-v4.cjs
          node --check scripts/p1p5-v41-source-pin-regression.cjs
          node scripts/p1p5-v41-source-pin-regression.cjs | tee /tmp/math-v41-source-pin.log
          grep -Fq 'V4.1 SOURCE-PIN REGRESSION PASS:' /tmp/math-v41-source-pin.log
          node --check scripts/p1p5-extra-hard-full42-stage-v4-isolated-test.cjs
          node scripts/p1p5-extra-hard-full42-stage-v4-isolated-test.cjs | tee /tmp/extra-hard-v4-42-pending-stage.log
          grep -Fq 'EXTRA HARD V4 42-ROW PRIVATE DRAFT COPY ROLLBACK PASS:' /tmp/extra-hard-v4-42-pending-stage.log
          node --check scripts/ops/p1p5-extra-hard-v3-release-gate.cjs
          node scripts/ops/p1p5-extra-hard-v3-release-gate.cjs dry-run-isolated | tee /tmp/extra-hard-full42-release-dryrun.log
          grep -Fq 'EXTRA HARD FULL42 PUBLIC RELEASE GATE ROLLBACK PASS:' /tmp/extra-hard-full42-release-dryrun.log
          # Attack the actual synthetic stored prompt while leaving its hash
          # untouched: the source-fidelity check must refuse publication.
          node scripts/ops/p1p5-extra-hard-v3-release-gate.cjs dry-run-tampered-isolated | tee /tmp/extra-hard-full42-stale-hash-negative.log
          grep -Fq 'EXTRA HARD FULL42 DB CONTENT TAMPER DENIED:' /tmp/extra-hard-full42-stale-hash-negative.log
          # P4-14: V4.1 is a DIFFERENT source from historical V3; the staged
          # live rows remain draft/pending. Exercise ONLY synthetic 42 records.
          node --check scripts/ops/p1p5-extra-hard-v41-reviewed-release-gate.cjs
          if node scripts/ops/p1p5-extra-hard-v41-reviewed-release-gate.cjs publish; then
            echo 'UNSAFE: V4.1 release accepted without separate owner GO' >&2
            exit 1
          fi
          node scripts/ops/p1p5-extra-hard-v41-reviewed-release-gate.cjs dry-run-isolated |
            tee /tmp/extra-hard-v41-release-rollback.log
          grep -Fq 'EXTRA HARD FULL42 PUBLIC RELEASE GATE ROLLBACK PASS:' /tmp/extra-hard-v41-release-rollback.log
          node scripts/ops/p1p5-extra-hard-v41-reviewed-release-gate.cjs dry-run-tampered-isolated |
            tee /tmp/extra-hard-v41-content-tamper.log
          grep -Fq 'EXTRA HARD FULL42 DB CONTENT TAMPER DENIED:' /tmp/extra-hard-v41-content-tamper.log
          node scripts/ops/p1p5-extra-hard-v41-reviewed-release-gate.cjs dry-run-partial-qa-isolated |
            tee /tmp/extra-hard-v41-partial-qa.log
          grep -Fq 'EXTRA HARD V4.1 PARTIAL QA DENIED:' /tmp/extra-hard-v41-partial-qa.log
      - name: Assert correction, retry boundary, delayed retest and timed stage deny over REAL HTTP
        run: |
          set -euo pipefail
          node --check scripts/p1p5-isolated-http-correction-faults.cjs
          node scripts/p1p5-isolated-http-correction-faults.cjs
      - name: Reconcile lost ACK and resume Math P5 in NEW browser over real signed HTTP
        run: |
          set -euo pipefail
          node --check scripts/p1p5-isolated-http-browser-resume.cjs
          node scripts/p1p5-isolated-http-browser-resume.cjs
      - name: Postflight assert only synthetic isolated users and both paper sessions
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -At -c "
            DO \$\$
            BEGIN
              IF (SELECT COUNT(*) FROM public.users) <> 2 THEN
                RAISE EXCEPTION 'unexpected learner rows in CI sandbox';
              END IF;
              IF (SELECT COUNT(DISTINCT component_code)
                  FROM private.exam_prep_sessions
                  WHERE user_id='11111111-1111-4111-8111-111111111191'::uuid
                    AND status='finalized') <> 2 THEN
                RAISE EXCEPTION 'P1/P5 real HTTP finalization missing';
              END IF;
            END
            \$\$;
          "
      - name: Seed guarded canonical-only synthetic clock learner in disposable CI
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
