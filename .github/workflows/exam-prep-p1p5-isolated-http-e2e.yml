name: Mathematics P1 P5 disposable real HTTP Auth diagnostic E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'exam-prep/**'
      - 'supabase/migrations/*exam_prep*.sql'
      - 'supabase/tests/p1p5_isolated_http_auth_e2e_seed.sql'
      - 'supabase/tests/p1p5_v2_package0_full_schema_fk_rollback.sql'
      - 'supabase/tests/p1p5_v2_package0_32table_disposable_rollback_only.sql'
      - 'supabase/tests/p1p5_v2_package0_future_state_overlay_disposable.sql'
      - 'scripts/p1p5-v2-package0-build-combined-probe.cjs'
      - 'supabase/tests/p1p5_v2_package0_signed_epoch_http_disposable.sql'
      - 'scripts/p1p5-v2-package0-signed-old-epoch-http.cjs'
      - 'scripts/p1p5-v2-package0-concurrent-epoch-lock.cjs'
      - 'supabase/tests/p1p5_v2_package0_actual_rpc_epoch_shadow_disposable.sql'
      - 'scripts/p1p5-v2-package0-real-rpc-epoch-http.cjs'
      - 'supabase/tests/p1p5_v2_package0_actual_core_writer_30_shadow_disposable.sql'
      - 'scripts/p1p5-v2-package0-real-core30-epoch-http.cjs'
      - 'supabase/tests/p1p5_v2_package0_draft469_three_writers_epoch_shadow_disposable.sql'
      - 'scripts/p1p5-v2-package0-draft469-old-jwt-http.cjs'
      - 'supabase/tests/p1p5_v2_package0_draft470_new_dates_weekly_epoch_shadow_disposable.sql'
      - 'scripts/p1p5-v2-package0-draft470-old-jwt-http.cjs'
      - 'scripts/p1p5-v2-package0-synthetic-backup-restore.sh'
      - 'scripts/p1p5-isolated-http-auth-e2e.cjs'
      - 'scripts/p1p5-isolated-http-correction-faults.cjs'
      - 'scripts/p1p5-isolated-http-browser-resume.cjs'
      - 'scripts/p1p5-isolated-http-postdue-retest.cjs'
      - 'supabase/tests/p1p5_isolated_http_postdue_retest_seed.sql'
      - 'supabase/tests/p1p5_isolated_http_postdue_retest_cleanup.sql'
      - 'supabase/tests/p1p5_isolated_http_mixed_timed_stage3_prep.sql'
      - 'supabase/tests/p1p5_isolated_http_mixed_timed_cleanup.sql'
      - 'scripts/p1p5-isolated-http-positive-mixed-timed.cjs'
      - 'supabase/tests/p1p5_isolated_http_written_browser_allowlist.sql'
      - 'scripts/p1p5-isolated-http-written-criteria-next-browser.cjs'
      - 'scripts/p1p5-isolated-http-stage-c-security-race.cjs'
      - 'supabase/tests/p1p5_stage_c_33_independent_stage0_rollbacks.sql'
      - 'supabase/tests/p1p5_stage_c_asymmetric_learning_correction_rollback.sql'
      - 'supabase/tests/p1p5_stage_c_recovery_plan_revalidation_batched.sql'
      - 'supabase/tests/p1p5_stage_c_real_http_stale_content_fixture.sql'
      - 'scripts/p1p5-isolated-http-retired-content-recovery.cjs'
      - '.github/workflows/exam-prep-p1p5-isolated-http-e2e.yml'
      - .github/workflows/p1p5-stage-d-consolidated-release-gate.yml
      - scripts/p1p5-stage-d-release-gate.cjs
      - scripts/p1p5-stage-d-release-gate.test.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-http-auth:
    name: actual Math UI JWT PostgREST PG17
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      P1P5_E2E_ISOLATED: 'true'
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert only exact current candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -f supabase/tests/p0_15_contract_bootstrap.sql
      - name: Bootstrap isolated legacy and Supabase contract
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql 2>&1 | tee -a p273-rehearsal.log
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_03_ephemeral_legacy_helpers.sql 2>&1 | tee -a p273-rehearsal.log
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_05_ephemeral_legacy_fixture.sql 2>&1 | tee -a p273-rehearsal.log

      - name: Apply complete current Exam Prep migration stack
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*exam_prep*.sql' | sort)
          test "${#files[@]}" -ge 1

          apply_one() {
            local f="$1"
            local b
            b="$(basename "$f")"
            if [[ "$b" == '20260907061000_exam_prep_stage3_key_registry_v1.sql' ]]; then
              echo '=== Replaying production Core-only controlled-beta boundary ===' | tee -a p273-rehearsal.log
              psql -v ON_ERROR_STOP=1 -c "update private.exam_prep_feature_config set rollout_state='controlled_beta',core_enabled=true,ai_enabled=false,mentor_enabled=false,kill_switch=false,updated_at=now() where id=1" >>p273-rehearsal.log 2>&1
            fi
            if [[ "$b" == '20260911114829_exam_prep_p2_34_stage4_timed_section_majority_gate_v1.sql' ]]; then
              echo '=== Normalizing historical Stage-4 patch anchors in isolated CI only ===' | tee -a p273-rehearsal.log
              psql -v ON_ERROR_STOP=1 -f supabase/tests/p2_36_current_schema_replay_compat.sql >>p273-rehearsal.log 2>&1
            fi
            if [[ "$b" == '20260911121959_exam_prep_p2_36_real_expansion_governance_gate_v1.sql' ]]; then
              echo '=== Seeding isolated production-shaped cohort dependency ===' | tee -a p273-rehearsal.log
              psql -v ON_ERROR_STOP=1 -c "insert into private.exam_prep_beta_cohorts(cohort_key,program_key,cohort_status,planned_size,current_wave,monitoring_hours,notes) values('p236-ci-cohort','math_as_p1_p5','draft',12,0,72,'isolated P2-73 rehearsal dependency') on conflict(cohort_key) do nothing" >>p273-rehearsal.log 2>&1
            fi
            echo "=== Applying $f ===" | tee -a p273-rehearsal.log
            psql -v ON_ERROR_STOP=1 -f "$f" >>p273-rehearsal.log 2>&1
          }

          recent=(
            '20260910121500_exam_prep_p2_17_preserve_learning_priority_v1.sql'
            '20260910160000_exam_prep_mixed_same_section_transfer_fix.sql'
            '20260910162000_exam_prep_retention_authorizer_reconcile.sql'
            '20260910164500_exam_prep_p2_18_weekly_plan_actionability_v1.sql'
            '20260910121001_exam_prep_p2_19_fresh_retest_and_plan_binding_v1.sql'
            '20260910130529_exam_prep_p2_20_mixed_mastery_area_guard_v1.sql'
          )

          for f in "${files[@]}"; do
            b="$(basename "$f")"
            case "$b" in
              '20260910121500_exam_prep_p2_17_preserve_learning_priority_v1.sql'|\
              '20260910160000_exam_prep_mixed_same_section_transfer_fix.sql'|\
              '20260910162000_exam_prep_retention_authorizer_reconcile.sql'|\
              '20260910164500_exam_prep_p2_18_weekly_plan_actionability_v1.sql'|\
              '20260910121001_exam_prep_p2_19_fresh_retest_and_plan_binding_v1.sql'|\
              '20260910130529_exam_prep_p2_20_mixed_mastery_area_guard_v1.sql')
                if [[ "$b" == '20260910164500_exam_prep_p2_18_weekly_plan_actionability_v1.sql' ]]; then
                  echo '=== Replaying P2-17..P2-20 in production migration order ===' | tee -a p273-rehearsal.log
                  for rb in "${recent[@]}"; do
                    apply_one "supabase/migrations/$rb"
                  done
                fi
                continue
                ;;
            esac
            apply_one "$f"
          done

          echo '=== Reset isolated harness to fail-closed baseline ===' | tee -a p273-rehearsal.log
          psql -v ON_ERROR_STOP=1 -c "update private.exam_prep_feature_config set rollout_state='off',core_enabled=false,ai_enabled=false,mentor_enabled=false,kill_switch=true,updated_at=now() where id=1" >>p273-rehearsal.log 2>&1


      - name: Seed ONLY disposable authenticated learners
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1p5_isolated_http_auth_e2e_seed.sql > /tmp/p1p5-e2e-seed.log
          echo "Disposable seed applied; no live project, token or account involved"
      - name: P0-13 prepare DISPOSABLE signed HTTP epoch fixture only
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          test "$P1P5_E2E_ISOLATED" = "true"
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/p1p5_v2_package0_signed_epoch_http_disposable.sql >/tmp/p0-13-epoch-setup.log
          echo "PASS: test-only epoch fixture installed in disposable PostgreSQL"
      - name: Package 0 actual-migrations P1/P5 session/authorization FK rollback
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          test "$P1P5_E2E_ISOLATED" = "true"
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1p5_v2_package0_full_schema_fk_rollback.sql
          echo "PASS: full migration schema retained and fake FK probe rolled back"
      - name: Generate ephemeral JWT signing key and start local PostgREST
        shell: bash
        run: |
          set -euo pipefail
          disposable_jwt_secret="$(openssl rand -hex 48)"
          echo "::add-mask::$disposable_jwt_secret"
          echo "P1P5_E2E_JWT_SECRET=$disposable_jwt_secret" >> "$GITHUB_ENV"
          docker pull postgrest/postgrest:v12.2.3
      - name: Start disposable HTTP API
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name iclub-p1p5-local-postgrest --network host \
            -e PGRST_DB_URI="postgres://postgres:postgres@127.0.0.1:5432/postgres" \
            -e PGRST_DB_SCHEMA="public" -e PGRST_DB_ANON_ROLE="anon" \
            -e PGRST_JWT_SECRET="$P1P5_E2E_JWT_SECRET" \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 45); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/ || true)"
            if [[ "$status" =~ ^(200|400|401|404)$ ]]; then
              echo "Local PostgREST responding with HTTP $status"
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 30 iclub-p1p5-local-postgrest
          exit 1
      - name: Install isolated Chromium and validate test syntax
        run: |
          set -euo pipefail
          node --check scripts/p1p5-isolated-http-auth-e2e.cjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run ACTUAL authenticated HTTP P1 and P5 browser diagnostic, owned resume, security denial
        run: |
          set -euo pipefail
          node scripts/p1p5-isolated-http-auth-e2e.cjs
      - name: P0-13 signed old-device HTTP epoch, idempotency and maintenance denial
        shell: bash
        run: |
          set -euo pipefail
          test "$P1P5_E2E_ISOLATED" = "true"
          export P0_13_FIXED_IAT="$(date -u +%s)" # same signed JWT reused after epoch transition
          node --check scripts/p1p5-v2-package0-signed-old-epoch-http.cjs
          node scripts/p1p5-v2-package0-signed-old-epoch-http.cjs before
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE private.p0_13_epoch_gate SET paused=true WHERE program='math_as_p1_p5';"
          node scripts/p1p5-v2-package0-signed-old-epoch-http.cjs during
          psql -X -v ON_ERROR_STOP=1 -c "
            BEGIN;
            UPDATE private.p0_13_epoch_gate SET epoch=2,paused=false WHERE program='math_as_p1_p5';
            INSERT INTO private.p0_13_fake_authorizations(user_id,program,request_key,issued_epoch)
              VALUES('11111111-1111-4111-8111-111111111191'::uuid,'math_as_p1_p5','epoch-two-request',2);
            COMMIT;
          "
          node scripts/p1p5-v2-package0-signed-old-epoch-http.cjs after
          psql -X -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF (SELECT count(*) FROM private.p0_13_fake_write_events) <> 2 OR
                 (SELECT count(*) FROM private.p0_13_fake_write_events WHERE epoch=1) <> 1 OR
                 (SELECT count(*) FROM private.p0_13_fake_write_events WHERE epoch=2) <> 1 OR
                 (SELECT count(*) FROM private.p0_13_fake_authorizations WHERE issued_epoch=1) <> 3 OR
                 (SELECT count(*) FROM private.p0_13_fake_authorizations WHERE issued_epoch=2) <> 1 OR
                 (SELECT epoch FROM private.p0_13_epoch_gate WHERE program='economics_as') <> 1
              THEN RAISE EXCEPTION 'P0-13 fake write count or other program mutated'; END IF;
              RAISE NOTICE 'PASS P0-13 real signed-JWT fake epoch guard, no other program mutation';
            END
            \$\$;"
      - name: P0-14 real two-session PG17 epoch maintenance lock race
        shell: bash
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          test "$P1P5_E2E_ISOLATED" = "true"
          test "$PGDATABASE" = "postgres"
          node --check scripts/p1p5-v2-package0-concurrent-epoch-lock.cjs
          node scripts/p1p5-v2-package0-concurrent-epoch-lock.cjs
      - name: Assert correction, retry boundary, delayed retest and timed stage deny over REAL HTTP
        run: |
          set -euo pipefail
          node --check scripts/p1p5-isolated-http-correction-faults.cjs
          node scripts/p1p5-isolated-http-correction-faults.cjs
      - name: Reconcile lost ACK and resume Math P5 in NEW browser over real signed HTTP
        run: |
          set -euo pipefail
          node --check scripts/p1p5-isolated-http-browser-resume.cjs
          node scripts/p1p5-isolated-http-browser-resume.cjs
      - name: Postflight assert only synthetic isolated users and both paper sessions
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -At -c "
            DO \$\$
            BEGIN
              IF (SELECT COUNT(*) FROM public.users) <> 2 THEN
                RAISE EXCEPTION 'unexpected learner rows in CI sandbox';
              END IF;
              IF (SELECT COUNT(DISTINCT component_code)
                  FROM private.exam_prep_sessions
                  WHERE user_id='11111111-1111-4111-8111-111111111191'::uuid
                    AND status='finalized') <> 2 THEN
                RAISE EXCEPTION 'P1/P5 real HTTP finalization missing';
              END IF;
            END
            \$\$;
          "
      - name: Seed guarded canonical-only synthetic clock learner in disposable CI
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          test "$P1P5_E2E_ISOLATED" = "true"
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1p5_isolated_http_postdue_retest_seed.sql > /tmp/p1p5-postdue-canonical-seed.log
      - name: Complete genuine post-due retest using signed HTTP and P2-68 governed clock
        run: |
          set -euo pipefail
          node --check scripts/p1p5-isolated-http-postdue-retest.cjs
          node scripts/p1p5-isolated-http-postdue-retest.cjs
      - name: Postflight canonical synthetic run has no real-user or legacy data
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -At -c "
            DO \$\$
            BEGIN
              IF (SELECT COUNT(*) FROM public.users) <> 3 OR
                 (SELECT COUNT(*) FROM auth.users) <> 3 OR
                 (SELECT COUNT(*) FROM private.exam_prep_synthetic_identities WHERE run_id='SV-P1P5-RETEST-HTTP-CI-01') <> 1 OR
                 EXISTS (SELECT 1 FROM private.exam_prep_beta_weekly_reviews) OR
                 EXISTS (SELECT 1 FROM public.practice_attempts) OR
                 EXISTS (SELECT 1 FROM public.tour_attempts) OR
                 EXISTS (SELECT 1 FROM public.certificates)
              THEN
                RAISE EXCEPTION 'canonical fake-learner spillover or fabricated release evidence';
              END IF;
            END
            \$\$;
          "
      - name: Complete and clean canonical synthetic run without touching legacy
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1p5_isolated_http_postdue_retest_cleanup.sql > /tmp/p1p5-postdue-governed-cleanup.log
          echo "Governed synthetic identity cleanup and zero legacy spillover assertions: PASS"
      - name: Prepare authentic Stage 3 P1/P5 academic evidence in disposable PG17
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          # Reuse only P2-69 helper function DEFINITIONS, never its rollback
          # transaction/main synthetic scenario or invented mastery result.
          awk '/^-- Complete a normal non-timed/{copy=1} copy && /^DO /{exit} copy{print}' \
            supabase/tests/p2_69_full_stage0_6_core_simulation.sql > /tmp/p1p5-stage3-published-helpers.sql
          test "$(wc -c </tmp/p1p5-stage3-published-helpers.sql)" -gt 8000
          cat /tmp/p1p5-stage3-published-helpers.sql \
            supabase/tests/p1p5_isolated_http_mixed_timed_stage3_prep.sql \
            | psql -v ON_ERROR_STOP=1 > /tmp/p1p5-stage3-server-graded-prep.log
          echo "Stage 3 earned by server-graded published learning evidence: PASS"
      - name: Run real signed HTTP governed mixed and full-paper attempt with noncredit written self-marks
        run: |
          set -euo pipefail
          node --check scripts/p1p5-isolated-http-positive-mixed-timed.cjs
          node scripts/p1p5-isolated-http-positive-mixed-timed.cjs
      - name: Complete and cleanup canonical mixed/full-paper synthetic learner
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1p5_isolated_http_mixed_timed_cleanup.sql > /tmp/p1p5-timed-cleanup.log
          echo "Governed real signed HTTP paper learner cleanup: PASS"
      - name: Enable paper-based Core only for disposable owner A in local PG17
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1p5_isolated_http_written_browser_allowlist.sql > /tmp/p1p5-written-allowlist-test.log
      - name: True Chromium P1/P5 written criteria, three languages, Next, lost ACK and browser reopen
        run: |
          set -euo pipefail
          node --check scripts/p1p5-isolated-http-written-criteria-next-browser.cjs
          node scripts/p1p5-isolated-http-written-criteria-next-browser.cjs
      - name: Stage C signed HTTP JWT expiry, two-paper parallel retries, owner security and kill-switch safety
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          node --check scripts/p1p5-isolated-http-stage-c-security-race.cjs
          node scripts/p1p5-isolated-http-stage-c-security-race.cjs
      - name: Stage C run 33 source-mapped synthetic actors through real P1/P5 server-graded Stage0 and atomic rollback
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          test "$P1P5_E2E_ISOLATED" = "true"
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "postgres"
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/p1p5_stage_c_33_independent_stage0_rollbacks.sql \
            | tee /tmp/p1p5-stage-c-33-baselines-summary.log
          grep -q 'STAGE C 33 INDEPENDENT SERVER-GRADED STAGE0 BASELINES PASS' /tmp/p1p5-stage-c-33-baselines-summary.log
          grep -q 'STAGE C 33 ROLLBACK RESTORED TWO ORIGINAL FAKE USERS: PASS' /tmp/p1p5-stage-c-33-baselines-summary.log
      - name: Stage C earn independent P1/P5 objective levels and real wrong-learning corrections, then atomic rollback
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          test "$P1P5_E2E_ISOLATED" = "true"
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "postgres"
          test -s /tmp/p1p5-stage3-published-helpers.sql
          cat /tmp/p1p5-stage3-published-helpers.sql \
            supabase/tests/p1p5_stage_c_asymmetric_learning_correction_rollback.sql \
            | psql -X -v ON_ERROR_STOP=1 \
            | tee /tmp/p1p5-stage-c-asymmetric-progress.log
          grep -q 'STAGE C SOURCE-ANCHORED P1 P5 ASYMMETRIC LEARNING CORRECTION PASS' /tmp/p1p5-stage-c-asymmetric-progress.log
          grep -q 'STAGE C ASYMMETRIC LEARNING + CORRECTION ROLLBACK RESTORED TWO USERS PASS' /tmp/p1p5-stage-c-asymmetric-progress.log
          grep -q 'STAGE C ACTUAL P1 DELAYED PASS P5 FAILED REOPENED RETEST PASS' /tmp/p1p5-stage-c-asymmetric-progress.log
      - name: Stage C consolidated 16 recovery cases, governed noncredit revalidation, stale plan and profile revision with atomic rollback
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          test "$P1P5_E2E_ISOLATED" = "true"
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "postgres"
          test -s /tmp/p1p5-stage3-published-helpers.sql
          cat /tmp/p1p5-stage3-published-helpers.sql \
            supabase/tests/p1p5_stage_c_recovery_plan_revalidation_batched.sql \
            | psql -X -v ON_ERROR_STOP=1 \
            | tee /tmp/p1p5-stage-c-recovery-batch.log
          grep -q 'STAGE C BATCH 16 RECOVERY TZ DAYBAND P1P5 PRESERVATION PASS' /tmp/p1p5-stage-c-recovery-batch.log
          grep -q 'STAGE C BATCH ZERO SYNTHETIC RESIDUE RESTORED TWO ORIGINAL CI USERS PASS' /tmp/p1p5-stage-c-recovery-batch.log
      - name: Stage C real signed learner HTTP stale content, expired authorization, feedback and exactly-once retry
        env:
          PGOPTIONS: -c iclub.e2e_isolated=true
        run: |
          set -euo pipefail
          test "$P1P5_E2E_ISOLATED" = "true"
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "postgres"
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/p1p5_stage_c_real_http_stale_content_fixture.sql > /tmp/p1p5-stage-c-stale-content-seed.log
