name: P2-03 Past Paper Companion

on:
  push:
    branches:
      - main
    paths:
      - supabase/migrations/20260908044500_exam_prep_p2_03_past_paper_companion_v1.sql
      - supabase/tests/p2_03_past_paper_companion_matrix.sql
      - .github/scripts/p2_03_past_paper_ui_regression.js
      - exam-prep/exam-prep-api.js
      - exam-prep/exam-prep-past-paper.js
      - exam-prep/exam-prep-host.css
      - .github/workflows/p2-03-past-paper-companion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static learner UI contract
        run: |
          node --check exam-prep/exam-prep-api.js
          node --check exam-prep/exam-prep-past-paper.js
          node --check .github/scripts/p2_03_past_paper_ui_regression.js
          node .github/scripts/p2_03_past_paper_ui_regression.js

      - name: Supabase contract matrix
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not configured; skipping live SQL matrix."
            exit 0
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/p2_03_past_paper_companion_matrix.sql
