name: Math P1/P5 P0-16B read-only trigger catalog source guard

on:
  push:
    branches:
      - audit/math-p1p5-p0-16b-trigger-writer-catalog-20261105
    paths:
      - 'supabase/tests/p1p5_v2_package0_trigger_*_readonly.sql'
      - 'docs/math-p1p5-p0-16b-trigger-write-reachability-20261105.md'
      - 'scripts/p1p5-p0-16b-trigger-catalog-static-guard.cjs'
      - '.github/workflows/p1p5-p0-16b-trigger-catalog-readonly.yml'
  pull_request:
    paths:
      - 'supabase/tests/p1p5_v2_package0_trigger_*_readonly.sql'
      - 'docs/math-p1p5-p0-16b-trigger-write-reachability-20261105.md'
      - 'scripts/p1p5-p0-16b-trigger-catalog-static-guard.cjs'
      - '.github/workflows/p1p5-p0-16b-trigger-catalog-readonly.yml'

permissions:
  contents: read

jobs:
  no-production-credentials:
    name: Read-only catalog static and negative mutation guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/p1p5-p0-16b-trigger-catalog-static-guard.cjs
      - run: node scripts/p1p5-p0-16b-trigger-catalog-static-guard.cjs
