name: P1-01 Weekly Governance Gate

on:
  push:
    branches:
      - exam-prep-p0-host
    paths:
      - 'supabase/migrations/*exam_prep_p0_*.sql'
      - 'supabase/migrations/*exam_prep_p1_01_*.sql'
      - 'supabase/migrations/*exam_prep_p1_02_*.sql'
      - 'supabase/migrations/*exam_prep_p1_03_*.sql'
      - supabase/tests/p0_15_contract_bootstrap.sql
      - supabase/tests/p0_16_learner_consent_matrix.sql
      - supabase/tests/p1_01_weekly_governance_matrix.sql
      - supabase/tests/p1_03_ephemeral_legacy_helpers.sql
      - .github/workflows/p1-01-weekly-governance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-governance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Initialize diagnostic log
        run: printf 'P1-01 weekly governance full-current-schema + learner-consent CI\n' > p101-governance.log

      - name: Bootstrap minimum legacy/Supabase contract
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql 2>&1 | tee -a p101-governance.log

      - name: Mirror pre-existing production answer helpers in ephemeral DB
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_03_ephemeral_legacy_helpers.sql 2>&1 | tee -a p101-governance.log

      - name: Apply real Exam Prep P0-04 through P0-16 migrations except learner-consent overlay
        shell: bash
        run: |
          set -euo pipefail
          applied=0
          deferred=0
          for stage in 04 05 06 07 08 09 10 11 12 13 15 16; do
            mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p0_${stage}_*.sql" | sort)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No migration files found for P0-${stage}" | tee -a p101-governance.log >&2
              exit 1
            fi
            for f in "${files[@]}"; do
              if [[ "$f" == *"exam_prep_p0_16_learner_consent_gate.sql" ]]; then
                echo "=== Deferring learner-consent overlay until after weekly-governance matrix: $f ===" | tee -a p101-governance.log
                deferred=$((deferred+1))
                continue
              fi
              echo "=== Applying $f ===" | tee -a p101-governance.log
              if ! psql -v ON_ERROR_STOP=1 -f "$f" >>p101-governance.log 2>&1; then
                echo "FAILED_MIGRATION=$f" | tee -a p101-governance.log >&2
                tail -n 220 p101-governance.log
                exit 1
              fi
              applied=$((applied+1))
            done
          done
          test "$deferred" = '1'
          echo "Applied $applied P0 Exam Prep migration files; deferred consent overlays=$deferred" | tee -a p101-governance.log

      - name: Apply current P1-01 through P1-03 migrations
        shell: bash
        run: |
          set -euo pipefail
          applied=0
          for stage in 01 02 03; do
            mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p1_${stage}_*.sql" | sort)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No migration files found for P1-${stage}" | tee -a p101-governance.log >&2
              exit 1
            fi
            for f in "${files[@]}"; do
              echo "=== Applying $f ===" | tee -a p101-governance.log
              if ! psql -v ON_ERROR_STOP=1 -f "$f" >>p101-governance.log 2>&1; then
                echo "FAILED_MIGRATION=$f" | tee -a p101-governance.log >&2
                tail -n 300 p101-governance.log
                exit 1
              fi
              applied=$((applied+1))
            done
          done
          echo "Applied $applied P1 Exam Prep migration files" | tee -a p101-governance.log

      - name: Verify deployment remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql -Atqc "select rollout_state||'|'||core_enabled||'|'||ai_enabled||'|'||mentor_enabled||'|'||kill_switch from private.exam_prep_feature_config where id=1")"
          cohorts="$(psql -Atqc "select count(*) from private.exam_prep_beta_cohorts")"
          reviews="$(psql -Atqc "select count(*) from private.exam_prep_beta_weekly_reviews")"
          timed_results="$(psql -Atqc "select count(*) from private.exam_prep_timed_attempt_results")"
          self_marks="$(psql -Atqc "select count(*) from private.exam_prep_timed_written_self_marks")"
          ai_status="$(psql -Atqc "select runtime_status from private.exam_prep_optional_capability_status where capability_code='ai_assist'")"
          echo "PRE_P101_STATE=$state" | tee -a p101-governance.log
          echo "PRE_P101_COHORTS=$cohorts" | tee -a p101-governance.log
          echo "PRE_P101_REVIEWS=$reviews" | tee -a p101-governance.log
          echo "PRE_P101_TIMED_RESULTS=$timed_results" | tee -a p101-governance.log
          echo "PRE_P101_SELF_MARKS=$self_marks" | tee -a p101-governance.log
          echo "PRE_P101_AI_RUNTIME=$ai_status" | tee -a p101-governance.log
          test "$state" = 'off|false|false|false|true'
          test "$cohorts" = '0'
          test "$reviews" = '0'
          test "$timed_results" = '0'
          test "$self_marks" = '0'
          test "$ai_status" = 'not_deployed'

      - name: Run P1-01 weekly governance matrix on full pre-consent current schema
        shell: bash
        env:
          PGOPTIONS: '-c p101.isolated_db=true'
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_01_weekly_governance_matrix.sql 2>&1 | tee -a p101-governance.log

      - name: Prove weekly-governance matrix rolled back cleanly
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql -Atqc "select rollout_state||'|'||core_enabled||'|'||ai_enabled||'|'||mentor_enabled||'|'||kill_switch from private.exam_prep_feature_config where id=1")"
          users="$(psql -Atqc "select count(*) from auth.users where email like 'p101-%@invalid.example'")"
          cohorts="$(psql -Atqc "select count(*) from private.exam_prep_beta_cohorts")"
          reviews="$(psql -Atqc "select count(*) from private.exam_prep_beta_weekly_reviews")"
          ai_status="$(psql -Atqc "select runtime_status from private.exam_prep_optional_capability_status where capability_code='ai_assist'")"
          test "$state" = 'off|false|false|false|true'
          test "$users" = '0'
          test "$cohorts" = '0'
          test "$reviews" = '0'
          test "$ai_status" = 'not_deployed'

      - name: Apply learner-consent overlay on full P1-01 through P1-03 schema
        shell: bash
        run: |
          set -euo pipefail
          f="supabase/migrations/20260904196400_exam_prep_p0_16_learner_consent_gate.sql"
          test -f "$f"
          echo "=== Applying deferred learner-consent overlay: $f ===" | tee -a p101-governance.log
          psql -v ON_ERROR_STOP=1 -f "$f" >>p101-governance.log 2>&1
          state="$(psql -Atqc "select rollout_state||'|'||core_enabled||'|'||ai_enabled||'|'||mentor_enabled||'|'||kill_switch from private.exam_prep_feature_config where id=1")"
          consents="$(psql -Atqc "select count(*) from private.exam_prep_beta_consents")"
          trigger_count="$(psql -Atqc "select count(*) from pg_trigger where tgname='exam_prep_beta_member_consent_guard_v1' and not tgisinternal and tgenabled<>'D'")"
          echo "POST_P101_CONSENT_OVERLAY_STATE=$state" | tee -a p101-governance.log
          echo "POST_P101_CONSENT_OVERLAY_ROWS=$consents" | tee -a p101-governance.log
          echo "POST_P101_CONSENT_OVERLAY_TRIGGER=$trigger_count" | tee -a p101-governance.log
          test "$state" = 'off|false|false|false|true'
          test "$consents" = '0'
          test "$trigger_count" = '1'

      - name: Run learner-consent integration matrix on final governance schema
        shell: bash
        env:
          PGOPTIONS: '-c p016.current_schema=true'
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_16_learner_consent_matrix.sql 2>&1 | tee -a p101-governance.log

      - name: Prove rollback and zero synthetic residue on final schema
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql -Atqc "select rollout_state||'|'||core_enabled||'|'||ai_enabled||'|'||mentor_enabled||'|'||kill_switch from private.exam_prep_feature_config where id=1")"
          users="$(psql -Atqc "select count(*) from auth.users where email like 'p101-%@invalid.example' or email like 'p016g-%@invalid.example'")"
          cohorts="$(psql -Atqc "select count(*) from private.exam_prep_beta_cohorts")"
          consents="$(psql -Atqc "select count(*) from private.exam_prep_beta_consents")"
          reviews="$(psql -Atqc "select count(*) from private.exam_prep_beta_weekly_reviews")"
          timed_results="$(psql -Atqc "select count(*) from private.exam_prep_timed_attempt_results")"
          self_marks="$(psql -Atqc "select count(*) from private.exam_prep_timed_written_self_marks")"
          ai_status="$(psql -Atqc "select runtime_status from private.exam_prep_optional_capability_status where capability_code='ai_assist'")"
          echo "POST_P101_STATE=$state" | tee -a p101-governance.log
          echo "POST_P101_SYNTHETIC_USERS=$users" | tee -a p101-governance.log
          echo "POST_P101_COHORTS=$cohorts" | tee -a p101-governance.log
          echo "POST_P101_CONSENTS=$consents" | tee -a p101-governance.log
          echo "POST_P101_REVIEWS=$reviews" | tee -a p101-governance.log
          echo "POST_P101_TIMED_RESULTS=$timed_results" | tee -a p101-governance.log
          echo "POST_P101_SELF_MARKS=$self_marks" | tee -a p101-governance.log
          echo "POST_P101_AI_RUNTIME=$ai_status" | tee -a p101-governance.log
          test "$state" = 'off|false|false|false|true'
          test "$users" = '0'
          test "$cohorts" = '0'
          test "$consents" = '0'
          test "$reviews" = '0'
          test "$timed_results" = '0'
          test "$self_marks" = '0'
          test "$ai_status" = 'not_deployed'
          echo 'P1-01 weekly governance + learner-consent final-schema gate: GREEN' | tee -a p101-governance.log

      - name: Upload P1-01 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-01-weekly-governance-diagnostics
          path: p101-governance.log
          if-no-files-found: error
          retention-days: 3
