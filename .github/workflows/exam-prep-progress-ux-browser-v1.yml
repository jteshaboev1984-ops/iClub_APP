name: Exam Prep Progress UX Browser v1

on:
  push:
    branches:
      - feature/exam-prep-progress-ux-v1
    paths:
      - 'exam-prep/exam-prep-api.js'
      - 'exam-prep/exam-prep-progress-ux-*.js'
      - 'exam-prep/exam-prep-progress-ux.css'
      - 'scripts/progress-ux-browser-regression.cjs'
      - 'scripts/progress-ux-boot-regression.cjs'
      - 'scripts/progress-ux-real-loader-regression.cjs'
      - '.github/workflows/exam-prep-progress-ux-browser-v1.yml'
  pull_request:
    paths:
      - 'exam-prep/exam-prep-api.js'
      - 'exam-prep/exam-prep-progress-ux-*.js'
      - 'exam-prep/exam-prep-progress-ux.css'
      - 'scripts/progress-ux-browser-regression.cjs'
      - 'scripts/progress-ux-boot-regression.cjs'
      - 'scripts/progress-ux-real-loader-regression.cjs'
      - '.github/workflows/exam-prep-progress-ux-browser-v1.yml'

permissions:
  contents: read

jobs:
  isolated-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and isolated boundary
        run: |
          set -euo pipefail
          node --check exam-prep/exam-prep-api.js
          node --check exam-prep/exam-prep-progress-ux-api.js
          node --check exam-prep/exam-prep-progress-ux-model.js
          node --check exam-prep/exam-prep-progress-ux-ui.js
          node --check exam-prep/exam-prep-progress-ux-boot.js
          node --check scripts/progress-ux-browser-regression.cjs
          node --check scripts/progress-ux-boot-regression.cjs
          node --check scripts/progress-ux-real-loader-regression.cjs
          ! grep -Eq 'localStorage|sessionStorage|\.from\(|\.rpc\(|fetch\(' exam-prep/exam-prep-progress-ux-ui.js
          ! grep -Eq 'correct_answer|service_role|private\.exam_prep' exam-prep/exam-prep-progress-ux-ui.js
          ! grep -Fq 'exam-prep-progress-ux-ui.js' index.html
          ! grep -Fq 'exam-prep-progress-ux-ui.js' exam-prep/exam-prep-materials.js
          grep -Fq 'window.iClubExamPrepProgressUxEnabled === true' exam-prep/exam-prep-api.js
      - name: Install isolated browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Progress presentation browser regression
        run: node scripts/progress-ux-browser-regression.cjs
      - name: Optional bootstrap and revocation regression
        run: node scripts/progress-ux-boot-regression.cjs
      - name: Actual Exam Prep loader OFF/ON regression
        run: node scripts/progress-ux-real-loader-regression.cjs
      - name: Existing flow and navigation regression
        run: node .github/scripts/exam_prep_flow_clarity_regression.js
