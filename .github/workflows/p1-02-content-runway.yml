name: P1-02 Content Runway Gate

on:
  push:
    branches:
      - exam-prep-p0-host
    paths:
      - 'supabase/migrations/*exam_prep_p0_*.sql'
      - 'supabase/migrations/*exam_prep_p1_01_*.sql'
      - 'supabase/migrations/*exam_prep_p1_02_*.sql'
      - supabase/tests/p0_15_contract_bootstrap.sql
      - supabase/tests/p1_02_content_runway_contract_matrix.sql
      - .github/workflows/p1-02-content-runway.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-runway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Initialize diagnostic log
        run: printf 'P1-02 content runway CI\n' > p102-runway.log

      - name: Bootstrap minimum legacy/Supabase contract
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql 2>&1 | tee -a p102-runway.log

      - name: Apply real Exam Prep P0-04 through P0-16 migrations
        shell: bash
        run: |
          set -euo pipefail
          for stage in 04 05 06 07 08 09 10 11 12 13 15 16; do
            mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p0_${stage}_*.sql" | sort)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No migration files found for P0-${stage}" | tee -a p102-runway.log >&2
              exit 1
            fi
            for f in "${files[@]}"; do
              echo "=== Applying $f ===" | tee -a p102-runway.log
              if ! psql -v ON_ERROR_STOP=1 -f "$f" >>p102-runway.log 2>&1; then
                echo "FAILED_MIGRATION=$f" | tee -a p102-runway.log >&2
                tail -n 220 p102-runway.log
                exit 1
              fi
            done
          done

      - name: Apply real P1-01 migrations
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*exam_prep_p1_01_*.sql' | sort)
          for f in "${files[@]}"; do
            echo "=== Applying $f ===" | tee -a p102-runway.log
            psql -v ON_ERROR_STOP=1 -f "$f" >>p102-runway.log 2>&1
          done

      - name: Apply P1-02 runway migrations
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*exam_prep_p1_02_*.sql' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No P1-02 migrations found' | tee -a p102-runway.log >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "=== Applying $f ===" | tee -a p102-runway.log
            if ! psql -v ON_ERROR_STOP=1 -f "$f" >>p102-runway.log 2>&1; then
              echo "FAILED_MIGRATION=$f" | tee -a p102-runway.log >&2
              tail -n 260 p102-runway.log
              exit 1
            fi
          done

      - name: Run P1-02 runway contract matrix
        shell: bash
        env:
          PGOPTIONS: '-c p102.isolated_db=true'
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_02_content_runway_contract_matrix.sql 2>&1 | tee -a p102-runway.log

      - name: Verify zero activation residue
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql -Atqc "select rollout_state||'|'||core_enabled||'|'||ai_enabled||'|'||mentor_enabled||'|'||kill_switch from private.exam_prep_feature_config where id=1")"
          cohorts="$(psql -Atqc "select count(*) from private.exam_prep_beta_cohorts")"
          members="$(psql -Atqc "select count(*) from private.exam_prep_beta_members")"
          echo "POST_P102_STATE=$state" | tee -a p102-runway.log
          echo "POST_P102_COHORTS=$cohorts" | tee -a p102-runway.log
          echo "POST_P102_MEMBERS=$members" | tee -a p102-runway.log
          test "$state" = 'off|false|false|false|true'
          test "$cohorts" = '0'
          test "$members" = '0'
          echo 'P1-02 content runway contract gate: GREEN' | tee -a p102-runway.log

      - name: Upload P1-02 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-02-content-runway-diagnostics
          path: p102-runway.log
          if-no-files-found: error
          retention-days: 3
