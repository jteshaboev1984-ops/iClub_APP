name: P0-02 Tour inspect

on:
  push:
    branches:
      - iclub-v3-implementation
    paths:
      - .github/workflows/p0-02-tour-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-tour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iclub-v3-implementation
      - name: Print exact Tour function sections
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('app.js','utf8').split(/\r?\n/);
          const specs = [
            ['submitTourAnswer',260],
            ['finishTour',300],
            ['initTourSession',90],
            ['renderTourReview',180],
            ['flushPendingTourAnswers',90]
          ];
          for (const [name, span] of specs) {
            const idx = lines.findIndex(l => new RegExp(`(?:async\\s+)?function\\s+${name}\\s*\\(`).test(l));
            console.log(`\n===== ${name} line=${idx+1} =====`);
            if (idx < 0) { console.log('NOT FOUND'); continue; }
            console.log(lines.slice(idx, Math.min(lines.length, idx + span)).map((l,i)=>`${idx+i+1}: ${l}`).join('\n'));
            console.log(`===== END ${name} =====`);
          }
          NODE
