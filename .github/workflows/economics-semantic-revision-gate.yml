name: Economics Retest Semantic Revision Gate (Synthetic)
on:
  pull_request:
    paths:
      - 'scripts/qa-economics-private-retest-semantic-revision-v2.cjs'
      - 'scripts/qa-economics-private-retest-semantic-revision-v2.test.cjs'
      - 'scripts/qa-economics-private-retest-sql-contract-v1.test.cjs'
      - '.github/workflows/economics-semantic-revision-gate.yml'
      - 'docs/release-candidates/economics-private-retest-gated-v1.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-data-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test semantic revision gates on synthetic items
        run: node --test scripts/qa-economics-private-retest-semantic-revision-v2.test.cjs scripts/qa-economics-private-retest-sql-contract-v1.test.cjs
      - name: Assert no private answer bank or source snapshots were committed
        run: |
          test ! -e Economics_9708_P1_P3_71_Same_Skill_Retest_Combined_PRIVATE_DRAFT_20261029.json
          test ! -e Economics_9708_P1_P3_71_Same_Skill_Retest_ACADEMIC_SEMANTIC_REV2_PRIVATE_HOLD_20261030.json
