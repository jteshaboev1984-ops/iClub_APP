name: P0-15 Isolated Alpha

on:
  push:
    branches:
      - exam-prep-p0-host
    paths:
      - 'supabase/migrations/*exam_prep_p0_*.sql'
      - supabase/tests/p0_15_contract_bootstrap.sql
      - supabase/tests/p0_15_internal_alpha_matrix.sql
      - .github/workflows/p0-15-isolated-alpha.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-alpha:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap minimum legacy/Supabase contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql

      - name: Apply real Exam Prep P0-04 through P0-13 migrations
        shell: bash
        run: |
          set -euo pipefail
          applied=0
          for stage in 04 05 06 07 08 09 10 11 12 13; do
            mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p0_${stage}_*.sql" | sort)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No migration files found for P0-${stage}" >&2
              exit 1
            fi
            for f in "${files[@]}"; do
              echo "Applying $f"
              psql -v ON_ERROR_STOP=1 -f "$f"
              applied=$((applied+1))
            done
          done
          echo "Applied $applied Exam Prep migration files"

      - name: Verify fail-closed pre-alpha baseline
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql -Atqc "select rollout_state||'|'||core_enabled||'|'||ai_enabled||'|'||mentor_enabled||'|'||kill_switch from private.exam_prep_feature_config where id=1")"
          test "$state" = 'off|f|f|f|t'
          bad_rls="$(psql -Atqc "select count(*) from pg_tables where schemaname='private' and tablename like 'exam_prep%' and not rowsecurity")"
          test "$bad_rls" = '0'

      - name: Run full P0-15 service/security/integrity/rollback matrix
        env:
          PGOPTIONS: '-c p015.isolated_db=true'
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_internal_alpha_matrix.sql

      - name: Prove sandbox returned to fail-closed state
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql -Atqc "select rollout_state||'|'||core_enabled||'|'||ai_enabled||'|'||mentor_enabled||'|'||kill_switch from private.exam_prep_feature_config where id=1")"
          test "$state" = 'off|f|f|f|t'
          test "$(psql -Atqc "select count(*) from auth.users where email like 'p015-%@invalid.example'")" = '0'
          echo 'P0-15 isolated alpha gate: GREEN'
