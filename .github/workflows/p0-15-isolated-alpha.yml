name: P0-15 Isolated Alpha

on:
  push:
    branches:
      - exam-prep-p0-host
    paths:
      - 'supabase/migrations/*exam_prep_p0_*.sql'
      - 'supabase/migrations/*exam_prep_p1_01_*.sql'
      - 'supabase/migrations/*exam_prep_p1_02_*.sql'
      - 'supabase/migrations/*exam_prep_p1_03_*.sql'
      - supabase/tests/p0_15_contract_bootstrap.sql
      - supabase/tests/p0_15_internal_alpha_matrix.sql
      - .github/workflows/p0-15-isolated-alpha.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-alpha:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Initialize diagnostic log
        run: printf 'P0-15 isolated alpha current-schema CI\n' > p015-isolated.log

      - name: Bootstrap minimum legacy/Supabase contract
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql 2>&1 | tee -a p015-isolated.log

      - name: Apply real Exam Prep P0-04 through P0-16 migrations
        shell: bash
        run: |
          set -euo pipefail
          applied=0
          for stage in 04 05 06 07 08 09 10 11 12 13 15 16; do
            mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p0_${stage}_*.sql" | sort)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No migration files found for P0-${stage}" | tee -a p015-isolated.log >&2
              exit 1
            fi
            for f in "${files[@]}"; do
              echo "=== Applying $f ===" | tee -a p015-isolated.log
              if ! psql -v ON_ERROR_STOP=1 -f "$f" >>p015-isolated.log 2>&1; then
                echo "FAILED_MIGRATION=$f" | tee -a p015-isolated.log >&2
                tail -n 180 p015-isolated.log
                exit 1
              fi
              applied=$((applied+1))
            done
          done
          echo "Applied $applied Exam Prep P0 migration files" | tee -a p015-isolated.log

      - name: Apply current P1-01 through P1-03 migrations
        shell: bash
        run: |
          set -euo pipefail
          applied=0
          for stage in 01 02 03; do
            mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p1_${stage}_*.sql" | sort)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No migration files found for P1-${stage}" | tee -a p015-isolated.log >&2
              exit 1
            fi
            for f in "${files[@]}"; do
              echo "=== Applying $f ===" | tee -a p015-isolated.log
              if ! psql -v ON_ERROR_STOP=1 -f "$f" >>p015-isolated.log 2>&1; then
                echo "FAILED_MIGRATION=$f" | tee -a p015-isolated.log >&2
                tail -n 240 p015-isolated.log
                exit 1
              fi
              applied=$((applied+1))
            done
          done
          echo "Applied $applied Exam Prep P1 migration files" | tee -a p015-isolated.log

      - name: Verify fail-closed pre-alpha baseline on current schema
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql -Atqc "select rollout_state||'|'||core_enabled||'|'||ai_enabled||'|'||mentor_enabled||'|'||kill_switch from private.exam_prep_feature_config where id=1")"
          cohorts="$(psql -Atqc "select count(*) from private.exam_prep_beta_cohorts")"
          timed_results="$(psql -Atqc "select count(*) from private.exam_prep_timed_attempt_results")"
          self_marks="$(psql -Atqc "select count(*) from private.exam_prep_timed_written_self_marks")"
          bad_rls="$(psql -Atqc "select count(*) from pg_tables where schemaname='private' and tablename like 'exam_prep%' and not rowsecurity")"
          echo "PRE_ALPHA_STATE=$state" | tee -a p015-isolated.log
          echo "PRE_ALPHA_COHORTS=$cohorts" | tee -a p015-isolated.log
          echo "PRE_ALPHA_TIMED_RESULTS=$timed_results" | tee -a p015-isolated.log
          echo "PRE_ALPHA_SELF_MARKS=$self_marks" | tee -a p015-isolated.log
          echo "BAD_RLS_TABLES=$bad_rls" | tee -a p015-isolated.log
          test "$state" = 'off|false|false|false|true'
          test "$cohorts" = '0'
          test "$timed_results" = '0'
          test "$self_marks" = '0'
          test "$bad_rls" = '0'

      - name: Run full P0-15 service/security/integrity/rollback matrix
        shell: bash
        env:
          PGOPTIONS: '-c p015.isolated_db=true'
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_internal_alpha_matrix.sql 2>&1 | tee -a p015-isolated.log

      - name: Prove current-schema sandbox returned to fail-closed state
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql -Atqc "select rollout_state||'|'||core_enabled||'|'||ai_enabled||'|'||mentor_enabled||'|'||kill_switch from private.exam_prep_feature_config where id=1")"
          synthetic="$(psql -Atqc "select count(*) from auth.users where email like 'p015-%@invalid.example'")"
          cohorts="$(psql -Atqc "select count(*) from private.exam_prep_beta_cohorts")"
          members="$(psql -Atqc "select count(*) from private.exam_prep_beta_members")"
          reviews="$(psql -Atqc "select count(*) from private.exam_prep_beta_weekly_reviews")"
          timed_results="$(psql -Atqc "select count(*) from private.exam_prep_timed_attempt_results")"
          self_marks="$(psql -Atqc "select count(*) from private.exam_prep_timed_written_self_marks")"
          echo "POST_ALPHA_STATE=$state" | tee -a p015-isolated.log
          echo "SYNTHETIC_USERS_AFTER=$synthetic" | tee -a p015-isolated.log
          echo "POST_ALPHA_COHORTS=$cohorts" | tee -a p015-isolated.log
          echo "POST_ALPHA_MEMBERS=$members" | tee -a p015-isolated.log
          echo "POST_ALPHA_REVIEWS=$reviews" | tee -a p015-isolated.log
          echo "POST_ALPHA_TIMED_RESULTS=$timed_results" | tee -a p015-isolated.log
          echo "POST_ALPHA_SELF_MARKS=$self_marks" | tee -a p015-isolated.log
          test "$state" = 'off|false|false|false|true'
          test "$synthetic" = '0'
          test "$cohorts" = '0'
          test "$members" = '0'
          test "$reviews" = '0'
          test "$timed_results" = '0'
          test "$self_marks" = '0'
          echo 'P0-15 isolated alpha current-schema gate: GREEN' | tee -a p015-isolated.log

      - name: Upload isolated diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-15-isolated-diagnostics
          path: p015-isolated.log
          if-no-files-found: error
          retention-days: 3
