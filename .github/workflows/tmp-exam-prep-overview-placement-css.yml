name: TEMP Exam Prep Overview Placement CSS Gate

on:
  push:
    branches:
      - exam-prep-css-overview-placement-v1
    paths:
      - .github/workflows/tmp-exam-prep-overview-placement-css.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exam-prep-css-overview-placement-v1
          fetch-depth: 0

      - name: Stage centralized overview placement styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('exam-prep/exam-prep-overview-placement.js')
          js = js_path.read_text()
          js, n = re.subn(r'\n  function ensureStyle\(\) \{.*?\n  \}\n\n  function stageLabel\(', '\n\n  function stageLabel(', js, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one ensureStyle block, removed {n}')
          js = js.replace('    ensureStyle();\n    renderPlacementLoading(component);', '    renderPlacementLoading(component);')
          js = js.replace('    ensureStyle();\n    root.querySelectorAll(".ep-live-card")', '    root.querySelectorAll(".ep-live-card")')
          if 'ensureStyle(' in js or 'ep-overview-placement-style' in js or 'document.createElement("style")' in js:
              raise SystemExit('Runtime overview/placement style injection remains')
          js_path.write_text(js)

          css_path = Path('exam-prep/exam-prep-host.css')
          css = css_path.read_text()
          marker = '/* ===== EXAM PREP CENTRALIZED OVERVIEW PLACEMENT v1 ===== */'
          if marker in css:
              raise SystemExit('Overview/placement CSS marker already exists')
          css += r'''

/* ===== EXAM PREP CENTRALIZED OVERVIEW PLACEMENT v1 ===== */
#exam-prep-host-root .ep-overview-strip {
  display: grid;
  gap: 9px;
  border-top: 1px solid rgba(127,127,127,.14);
  padding-top: 10px;
}

#exam-prep-host-root .ep-overview-mini {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 8px;
}

#exam-prep-host-root .ep-overview-stat {
  display: grid;
  gap: 3px;
  padding: 8px;
  border-radius: 10px;
  background: rgba(127,127,127,.055);
}

#exam-prep-host-root .ep-overview-stat span {
  font-size: 10px;
  opacity: .7;
}

#exam-prep-host-root .ep-overview-stat strong {
  font-size: 13px;
  line-height: 1.25;
}

#exam-prep-host-root .ep-overview-last {
  font-size: 11px;
  opacity: .76;
  line-height: 1.35;
}

#exam-prep-host-root .ep-placement-shell {
  display: grid;
  gap: 12px;
}

#exam-prep-host-root .ep-placement-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}

#exam-prep-host-root .ep-placement-title {
  font-size: 20px;
  font-weight: 800;
}

#exam-prep-host-root .ep-placement-sub {
  font-size: 12px;
  opacity: .72;
  margin-top: 3px;
}

#exam-prep-host-root .ep-placement-card {
  display: grid;
  gap: 10px;
  border: 1px solid rgba(127,127,127,.22);
  border-radius: 14px;
  padding: 13px;
  background: rgba(127,127,127,.035);
}

#exam-prep-host-root .ep-placement-summary {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 8px;
}

#exam-prep-host-root .ep-placement-stat {
  display: grid;
  gap: 3px;
  border: 1px solid rgba(127,127,127,.16);
  border-radius: 10px;
  padding: 10px;
}

#exam-prep-host-root .ep-placement-stat span {
  font-size: 11px;
  opacity: .72;
}

#exam-prep-host-root .ep-placement-stat strong {
  font-size: 15px;
  line-height: 1.3;
}

#exam-prep-host-root .ep-placement-note {
  padding: 10px;
  border-radius: 10px;
  background: rgba(127,127,127,.08);
  font-size: 12px;
  line-height: 1.45;
}

#exam-prep-host-root .ep-placement-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

#exam-prep-host-root .ep-placement-btn {
  border: 1px solid rgba(127,127,127,.28);
  border-radius: 10px;
  padding: 8px 10px;
  background: transparent;
  color: inherit;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

#exam-prep-host-root .ep-placement-btn.primary {
  background: #111827;
  color: #fff;
  border-color: #111827;
}

#exam-prep-host-root .ep-placement-error {
  padding: 10px;
  border-radius: 10px;
  background: rgba(180,30,30,.12);
  font-size: 13px;
}

@media (max-width: 680px) {
  #exam-prep-host-root .ep-overview-mini,
  #exam-prep-host-root .ep-placement-summary {
    grid-template-columns: 1fr;
  }

  #exam-prep-host-root .ep-placement-top {
    display: grid;
  }

  #exam-prep-host-root .ep-placement-actions .ep-placement-btn {
    flex: 1 1 auto;
  }
}
'''
          css_path.write_text(css)

          reg_path = Path('.github/scripts/p0_21_live_overview_placement_regression.js')
          reg = reg_path.read_text()
          reg = reg.replace("const page = await browser.newPage();", "const page = await browser.newPage({ viewport: { width: 390, height: 844 } });", 1)
          goto = "  await page.goto('http://iclub.test/');\n"
          if goto not in reg:
              raise SystemExit('p0_21 goto anchor missing')
          reg = reg.replace(goto, goto + "  await page.addStyleTag({ path: path.resolve('exam-prep/exam-prep-host.css') });\n", 1)
          anchor = "  assert(!visible.includes('pending_evidence') && !visible.includes('objective_state_v1'), 'overview must hide internal state codes');\n"
          if anchor not in reg:
              raise SystemExit('p0_21 assertion anchor missing')
          extra = """  const overviewPresentation = await page.evaluate(() => {\n    const root = document.querySelector('#exam-prep-host-root');\n    const strip = root.querySelector('[data-ep-overview-strip=\"P1\"]');\n    const mini = strip.querySelector('.ep-overview-mini');\n    return { runtimeStyle: Boolean(document.querySelector('#ep-overview-placement-style')), stripDisplay: getComputedStyle(strip).display, miniColumns: getComputedStyle(mini).gridTemplateColumns, rootWidth: root.getBoundingClientRect().width, scrollWidth: root.scrollWidth };\n  });\n  assert(overviewPresentation.runtimeStyle === false, 'Overview/placement must not inject a runtime style tag');\n  assert(overviewPresentation.stripDisplay === 'grid', 'Centralized overview CSS did not apply');\n  assert(overviewPresentation.rootWidth + 1 >= overviewPresentation.scrollWidth, `Overview overflow: ${overviewPresentation.scrollWidth} > ${overviewPresentation.rootWidth}`);\n"""
          reg = reg.replace(anchor, anchor + extra, 1)
          anchor2 = "  assert(!visible.includes('pending_evidence') && !visible.includes('advanced_skip_requires_human'), 'placement result must hide internal route/field names');\n"
          if anchor2 not in reg:
              raise SystemExit('p0_21 placement assertion anchor missing')
          extra2 = """  const placementPresentation = await page.evaluate(() => {\n    const root = document.querySelector('#exam-prep-host-root');\n    const shell = root.querySelector('.ep-placement-shell');\n    const card = root.querySelector('.ep-placement-card');\n    return { runtimeStyle: Boolean(document.querySelector('#ep-overview-placement-style')), shellDisplay: getComputedStyle(shell).display, cardRadius: getComputedStyle(card).borderRadius, rootWidth: root.getBoundingClientRect().width, scrollWidth: root.scrollWidth };\n  });\n  assert(placementPresentation.runtimeStyle === false, 'Placement runtime style tag appeared');\n  assert(placementPresentation.shellDisplay === 'grid', 'Centralized placement CSS did not apply');\n  assert(placementPresentation.cardRadius === '14px', 'Placement card geometry changed during CSS centralization');\n  assert(placementPresentation.rootWidth + 1 >= placementPresentation.scrollWidth, `Placement overflow: ${placementPresentation.scrollWidth} > ${placementPresentation.rootWidth}`);\n"""
          reg_path.write_text(reg.replace(anchor2, anchor2 + extra2, 1))
          PY

      - name: Static safety checks
        run: |
          set -euo pipefail
          node --check exam-prep/exam-prep-overview-placement.js
          node --check .github/scripts/p0_21_live_overview_placement_regression.js
          ! grep -q 'ep-overview-placement-style' exam-prep/exam-prep-overview-placement.js
          ! grep -q 'document.createElement("style")' exam-prep/exam-prep-overview-placement.js
          ! grep -q 'localStorage' exam-prep/exam-prep-overview-placement.js
          ! grep -q '\.from(' exam-prep/exam-prep-overview-placement.js
          grep -q 'EXAM PREP CENTRALIZED OVERVIEW PLACEMENT v1' exam-prep/exam-prep-host.css

      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Overview placement regression
        run: node .github/scripts/p0_21_live_overview_placement_regression.js

      - name: Stage-0 workflow regression
        run: node .github/scripts/p2_13_stage0_workflow_ui_regression.js

      - name: Combined learner views regression
        run: node .github/scripts/p0_22_live_view_coexistence_regression.js

      - name: Host bridge regression
        run: node .github/scripts/p0_14_host_regression.js

      - name: Commit product and regression only after green
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exam-prep/exam-prep-overview-placement.js exam-prep/exam-prep-host.css .github/scripts/p0_21_live_overview_placement_regression.js
          git diff --cached --check
          git commit -m "refactor(ui): centralize Exam Prep overview placement styles"
          git push origin HEAD:exam-prep-css-overview-placement-v1
