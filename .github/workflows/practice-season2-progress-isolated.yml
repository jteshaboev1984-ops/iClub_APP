name: Practice Season 2 progress read-only PostgreSQL17
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/candidates/practice_season2_progress_safe_v1.sql'
      - 'supabase/tests/practice_season2_progress_safe_isolated.sql'
      - '.github/workflows/practice-season2-progress-isolated.yml'
      - 'scripts/practice-season2-progress-signed-http.cjs'
      - 'scripts/practice-season2-history-chromium.cjs'
      - 'practice-results-tabs.js'
      - 'practice-results-tabs.css'
      - 'app.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: practice-season2-progress-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  isolated-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Season 2 scoped Practice progress without touching history
        env:
          PGPASSWORD: isolated-test-only
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d postgres \
            -f supabase/tests/practice_season2_progress_safe_isolated.sql
      - name: Activate fixture period and launch signed local PostgREST
        shell: bash
        env:
          PGPASSWORD: isolated-test-only
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -c "UPDATE public.seasons SET status='current',start_date='2026-11-01' WHERE id=2;"
          secret="$(openssl rand -hex 48)"
          echo "::add-mask::$secret"
          echo "PRACTICE_SEASON2_JWT_SECRET=$secret" >> "$GITHUB_ENV"
          echo "PRACTICE_SEASON2_ISOLATED=true" >> "$GITHUB_ENV"
          echo "PGHOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "PGDATABASE=postgres" >> "$GITHUB_ENV"
          docker pull postgrest/postgrest:v12.2.3
          docker run -d --rm --name iclub-practice-s2-pgrst --network host \
            -e PGRST_DB_URI="postgres://postgres:isolated-test-only@127.0.0.1:5432/postgres" \
            -e PGRST_DB_SCHEMA="public" -e PGRST_DB_ANON_ROLE="anon" \
            -e PGRST_JWT_SECRET="$secret" \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 40); do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)"
            if [[ "$status" =~ ^(200|400|401|404)$ ]]; then exit 0; fi
            sleep 2
          done
          docker logs --tail 25 iclub-practice-s2-pgrst
          exit 1

      - name: Signed JWT owner/subject and archive E2E
        run: |
          set -euo pipefail
          node --check scripts/practice-season2-progress-signed-http.cjs
          node scripts/practice-season2-progress-signed-http.cjs

      - name: Chromium validation of accepted 3+5 Practice history UI
        env:
          PRACTICE_S2_SCREENSHOT_DIR: artifacts/practice-season2-owner-acceptance
        run: |
          set -euo pipefail
          node --check app.js
          node --check practice-results-tabs.js
          node --check scripts/practice-season2-history-chromium.cjs
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node scripts/practice-season2-history-chromium.cjs

      - name: Save visual acceptance screenshots (synthetic test data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-season2-owner-acceptance-${{ github.sha }}
          path: artifacts/practice-season2-owner-acceptance/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: No production access
        run: echo 'Synthetic PostgreSQL 17 only. No live Supabase or Vercel integration.'
