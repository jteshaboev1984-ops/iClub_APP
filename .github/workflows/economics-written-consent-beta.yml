name: Economics Written Consent Beta Isolated Gate

on:
  pull_request:
    paths:
      - 'exam-prep/exam-prep-economics-native.js'
      - 'supabase/migrations/*iclub_econ_written_consent_beta_wave1_off_v1.sql'
      - 'scripts/qa-economics-consent-written-beta.cjs'
      - 'scripts/qa-economics-four-papers-navigation.cjs'
      - 'scripts/qa-economics-mark-scheme-premium.cjs'
      - 'exam-prep/exam-prep-economics-native.css'
      - 'scripts/qa-economics-premium-plan-navigation.cjs'
      - 'exam-prep/runtime/written-core-view-v1.js'
      - 'exam-prep/runtime/written-core-controller-v1.js'
      - 'exam-prep/runtime/written-core-source-v1.css'
      - 'supabase/migrations/*iclub_econ_written_mark_scheme_v1.sql'
      - 'supabase/migrations/*iclub_econ_core_criteria_without_answer_hints_v1.sql'
      - 'index.html'
      - '.github/workflows/economics-written-consent-beta.yml'
  workflow_dispatch:

jobs:
  beta-consent-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auth, consent, source and regression boundaries
        run: node scripts/qa-economics-consent-written-beta.cjs
      - name: Four Paper cards, click-path and written consent navigation
        run: node scripts/qa-economics-four-papers-navigation.cjs
      - name: Cambridge-aligned mark scheme 22 task and premium UI QA
        run: node scripts/qa-economics-mark-scheme-premium.cjs
      - name: Compact mobile study grid and inline Back across all locales
        run: node scripts/qa-economics-premium-plan-navigation.cjs
