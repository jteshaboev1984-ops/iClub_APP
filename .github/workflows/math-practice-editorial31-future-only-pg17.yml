name: Math Practice 31 editorial future-only PG17 old/history safety
on:
  push:
    branches:
      - qa/math-practice-31-editorial-future-only-20261120
  pull_request:
    branches:
      - fix/math-practice-answer-patterns-future-only-20261120
    paths:
      - 'supabase/preflight/math_practice_v2_31_editorial_contenthash_pin_readonly.sql'
      - 'scripts/math-practice-v2-itemwise-two-stage-generator.cjs'
      - 'scripts/math-practice-v2-future-only-81-test-fixture.cjs'
      - 'supabase/tests/math_practice_editorial31_future_only_pg17.sql'
      - '.github/workflows/math-practice-editorial31-future-only-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-pg17-history-version-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-fixture-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove no academic/editorial regression and no guessable letter cycles
        run: |
          set -euo pipefail
          node --check scripts/math-practice-v2-itemwise-two-stage-generator.cjs
          node --check scripts/math-practice-v2-future-only-81-test-fixture.cjs
          node scripts/math-practice-v2-editorial31-independent-oracles.cjs
          node scripts/math-practice-v2-answer-pattern-and-semantic-guard.cjs
      - name: Generate only exact 31 staged corrections, QA still pending
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          chmod 700 "$tmp"
          trap 'rm -rf "$tmp"' EXIT
          node scripts/math-practice-v2-itemwise-two-stage-generator.cjs \
            --group editorial31 --out "$tmp/stage.sql"
          node scripts/math-practice-v2-future-only-81-test-fixture.cjs \
            --expect 31 --stage "$tmp/stage.sql" --out "$tmp/fixture.sql"
          createdb -T template0 math_editorial31
          psql -X -v ON_ERROR_STOP=1 -d math_editorial31 \
            -f "$tmp/fixture.sql" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_editorial31 \
            -f "$tmp/stage.sql" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_editorial31 \
            -f supabase/candidates/math_practice_v2_future_only_atomic_membership_switch_v1.sql >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d math_editorial31 \
            -f supabase/tests/math_practice_editorial31_future_only_pg17.sql
      - name: Retain previous two- and three-item staging contract
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          chmod 700 "$tmp"
          trap 'rm -rf "$tmp"' EXIT
          node scripts/math-practice-v2-itemwise-two-stage-generator.cjs \
            --group editorial --out "$tmp/editorial2.sql"
          node scripts/math-practice-v2-itemwise-two-stage-generator.cjs \
            --group answer_pattern --out "$tmp/pattern3.sql"
          node scripts/math-practice-v2-future-only-81-test-fixture.cjs \
            --expect 2 --stage "$tmp/editorial2.sql" --out "$tmp/editorial2_fixture.sql"
          node scripts/math-practice-v2-future-only-81-test-fixture.cjs \
            --expect 3 --stage "$tmp/pattern3.sql" --out "$tmp/pattern3_fixture.sql"
      - name: Release policy
        run: echo 'Never published: 31 new QA flags PENDING. No hosted DB DML, old questions rewritten, main/deploy/season changes.'
