name: P2-75 AI Academic-State Parity

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/*exam_prep*.sql'
      - supabase/tests/p0_15_contract_bootstrap.sql
      - supabase/tests/p1_03_ephemeral_legacy_helpers.sql
      - supabase/tests/p1_05_ephemeral_legacy_fixture.sql
      - supabase/tests/p2_36_current_schema_replay_compat.sql
      - supabase/tests/p2_75_ai_academic_state_parity_matrix.sql
      - .github/workflows/p2-75-ai-academic-state-parity.yml
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/*exam_prep*.sql'
      - supabase/tests/p0_15_contract_bootstrap.sql
      - supabase/tests/p1_03_ephemeral_legacy_helpers.sql
      - supabase/tests/p1_05_ephemeral_legacy_fixture.sql
      - supabase/tests/p2_36_current_schema_replay_compat.sql
      - supabase/tests/p2_75_ai_academic_state_parity_matrix.sql
      - .github/workflows/p2-75-ai-academic-state-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-academic-state-parity:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Initialize diagnostic log
        run: printf 'P2-75 AI academic-state parity CI\n' > p275-ai-parity.log

      - name: Bootstrap isolated legacy and Supabase contract
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql 2>&1 | tee -a p275-ai-parity.log
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_03_ephemeral_legacy_helpers.sql 2>&1 | tee -a p275-ai-parity.log
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_05_ephemeral_legacy_fixture.sql 2>&1 | tee -a p275-ai-parity.log

      - name: Apply complete current Exam Prep migration stack
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*exam_prep*.sql' | sort)
          test "${#files[@]}" -ge 1

          apply_one() {
            local f="$1"
            local b
            b="$(basename "$f")"
            if [[ "$b" == '20260907061000_exam_prep_stage3_key_registry_v1.sql' ]]; then
              echo '=== Replaying production Core-only controlled-beta boundary ===' | tee -a p275-ai-parity.log
              psql -v ON_ERROR_STOP=1 -c "update private.exam_prep_feature_config set rollout_state='controlled_beta',core_enabled=true,ai_enabled=false,mentor_enabled=false,kill_switch=false,updated_at=now() where id=1" >>p275-ai-parity.log 2>&1
            fi
            if [[ "$b" == '20260911114829_exam_prep_p2_34_stage4_timed_section_majority_gate_v1.sql' ]]; then
              echo '=== Normalizing historical Stage-4 patch anchors in isolated CI only ===' | tee -a p275-ai-parity.log
              psql -v ON_ERROR_STOP=1 -f supabase/tests/p2_36_current_schema_replay_compat.sql >>p275-ai-parity.log 2>&1
            fi
            if [[ "$b" == '20260911121959_exam_prep_p2_36_real_expansion_governance_gate_v1.sql' ]]; then
              echo '=== Seeding isolated production-shaped cohort dependency ===' | tee -a p275-ai-parity.log
              psql -v ON_ERROR_STOP=1 -c "insert into private.exam_prep_beta_cohorts(cohort_key,program_key,cohort_status,planned_size,current_wave,monitoring_hours,notes) values('p236-ci-cohort','math_as_p1_p5','draft',12,0,72,'isolated P2-75 dependency') on conflict(cohort_key) do nothing" >>p275-ai-parity.log 2>&1
            fi
            echo "=== Applying $f ===" | tee -a p275-ai-parity.log
            psql -v ON_ERROR_STOP=1 -f "$f" >>p275-ai-parity.log 2>&1
          }

          recent=(
            '20260910121500_exam_prep_p2_17_preserve_learning_priority_v1.sql'
            '20260910160000_exam_prep_mixed_same_section_transfer_fix.sql'
            '20260910162000_exam_prep_retention_authorizer_reconcile.sql'
            '20260910164500_exam_prep_p2_18_weekly_plan_actionability_v1.sql'
            '20260910121001_exam_prep_p2_19_fresh_retest_and_plan_binding_v1.sql'
            '20260910130529_exam_prep_p2_20_mixed_mastery_area_guard_v1.sql'
          )

          for f in "${files[@]}"; do
            b="$(basename "$f")"
            case "$b" in
              '20260910121500_exam_prep_p2_17_preserve_learning_priority_v1.sql'|\
              '20260910160000_exam_prep_mixed_same_section_transfer_fix.sql'|\
              '20260910162000_exam_prep_retention_authorizer_reconcile.sql'|\
              '20260910164500_exam_prep_p2_18_weekly_plan_actionability_v1.sql'|\
              '20260910121001_exam_prep_p2_19_fresh_retest_and_plan_binding_v1.sql'|\
              '20260910130529_exam_prep_p2_20_mixed_mastery_area_guard_v1.sql')
                if [[ "$b" == '20260910164500_exam_prep_p2_18_weekly_plan_actionability_v1.sql' ]]; then
                  echo '=== Replaying P2-17..P2-20 in production migration order ===' | tee -a p275-ai-parity.log
                  for rb in "${recent[@]}"; do
                    apply_one "supabase/migrations/$rb"
                  done
                fi
                continue
                ;;
            esac
            apply_one "$f"
          done

      - name: Normalize production-shaped Core-on AI-off baseline
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL' >>p275-ai-parity.log 2>&1
          update private.exam_prep_feature_config
          set rollout_state='controlled_beta',core_enabled=true,ai_enabled=false,mentor_enabled=false,kill_switch=false,updated_at=now()
          where id=1;
          update private.exam_prep_ai_policy set generation_enabled=false,updated_at=now() where id=1;
          update private.exam_prep_optional_capability_status
          set runtime_status='shadow',gate_version=null,updated_at=now()
          where capability_code='ai_assist';
          SQL

          core="$(psql -Atqc "select core_enabled from private.exam_prep_feature_config where id=1")"
          ai="$(psql -Atqc "select ai_enabled from private.exam_prep_feature_config where id=1")"
          generation="$(psql -Atqc "select generation_enabled from private.exam_prep_ai_policy where id=1")"
          runtime="$(psql -Atqc "select runtime_status from private.exam_prep_optional_capability_status where capability_code='ai_assist'")"
          echo "P275_CORE=$core" | tee -a p275-ai-parity.log
          echo "P275_AI=$ai" | tee -a p275-ai-parity.log
          echo "P275_GENERATION=$generation" | tee -a p275-ai-parity.log
          echo "P275_RUNTIME=$runtime" | tee -a p275-ai-parity.log
          test "$core" = 't'
          test "$ai" = 'f'
          test "$generation" = 'f'
          test "$runtime" = 'shadow'

      - name: Run rollback-only AI academic-state parity matrix
        shell: bash
        env:
          PGOPTIONS: '-c p275.isolated_db=true'
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p2_75_ai_academic_state_parity_matrix.sql 2>&1 | tee -a p275-ai-parity.log

      - name: Prove rollback restored AI-off baseline and zero P2-75 residue
        shell: bash
        run: |
          set -euo pipefail
          core="$(psql -Atqc "select core_enabled from private.exam_prep_feature_config where id=1")"
          ai="$(psql -Atqc "select ai_enabled from private.exam_prep_feature_config where id=1")"
          generation="$(psql -Atqc "select generation_enabled from private.exam_prep_ai_policy where id=1")"
          runtime="$(psql -Atqc "select runtime_status from private.exam_prep_optional_capability_status where capability_code='ai_assist'")"
          synth="$(psql -Atqc "select count(*) from private.exam_prep_synthetic_identities where fixture_profile_key='SVF-P275-AI-PARITY'")"
          runs="$(psql -Atqc "select count(*) from private.exam_prep_synthetic_validation_runs where run_id='SV-P275CI-AI-PARITY'")"
          users="$(psql -Atqc "select count(*) from auth.users where email like 'exam-prep-sv-p275-%@invalid.example'")"
          echo "P275_POST_CORE=$core" | tee -a p275-ai-parity.log
          echo "P275_POST_AI=$ai" | tee -a p275-ai-parity.log
          echo "P275_POST_GENERATION=$generation" | tee -a p275-ai-parity.log
          echo "P275_POST_RUNTIME=$runtime" | tee -a p275-ai-parity.log
          echo "P275_POST_SYNTH=$synth" | tee -a p275-ai-parity.log
          echo "P275_POST_RUNS=$runs" | tee -a p275-ai-parity.log
          echo "P275_POST_USERS=$users" | tee -a p275-ai-parity.log
          test "$core" = 't'
          test "$ai" = 'f'
          test "$generation" = 'f'
          test "$runtime" = 'shadow'
          test "$synth" = '0'
          test "$runs" = '0'
          test "$users" = '0'

      - name: Mark P2-75 parity GREEN
        run: echo 'P2-75 AI ACADEMIC-STATE PARITY GREEN' | tee -a p275-ai-parity.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-75-ai-academic-state-parity
          path: p275-ai-parity.log
          if-no-files-found: error
          retention-days: 7
