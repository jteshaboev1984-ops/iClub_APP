name: Mathematics Practice future-only atomic switch PG17
on:
  push:
    branches:
      - qa/math-practice-future-only-atomic-switch-pg17-20261120
  pull_request:
    branches:
      - qa/math-practice-future-only-81-contenthash-pin-20261119
    paths:
      - 'supabase/candidates/math_practice_v2_future_only_atomic_membership_switch_v1.sql'
      - 'scripts/math-practice-v2-future-only-81-stage-generator.cjs'
      - 'supabase/tests/math_practice_future_only_atomic_fixture_pg17.sql'
      - 'supabase/tests/math_practice_future_only_atomic_switch_pg17.sql'
      - '.github/workflows/math-practice-v2-future-only-atomic-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgresql-17:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ephemeral-fixture-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate all 81 staged versions without printing academic content
        run: |
          set -euo pipefail
          node --check scripts/math-practice-v2-future-only-81-stage-generator.cjs
          private_dir="$(mktemp -d)"
          chmod 700 "$private_dir"
          trap 'rm -rf "$private_dir"' EXIT
          node scripts/math-practice-v2-future-only-81-stage-generator.cjs --out "$private_dir/stage.sql"
          node - "$private_dir/stage.sql" <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const sql=fs.readFileSync(process.argv[2],'utf8');
          assert.ok(sql.includes('jsonb_array_length(v_items)<>81'));
          assert.ok(sql.includes("qa_math_status,qa_language_status,qa_technical_status,qa_tour_separation_status"));
          assert.ok(sql.includes("'pending','pending','pending','pending'"));
          assert.ok(sql.includes("v_new_id,v_old_link.order_no,false"));
          assert.ok(!sql.includes('delete from public.practice_answers'));
          console.log('PASS 81 original staged questions, inactive memberships and pending QA; no protected content printed');
          NODE
      - name: Run actual future-only swap and rollback in disposable PG17
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/math_practice_future_only_atomic_fixture_pg17.sql
          psql -v ON_ERROR_STOP=1 -f supabase/candidates/math_practice_v2_future_only_atomic_membership_switch_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/math_practice_future_only_atomic_switch_pg17.sql
      - name: Boundary
        run: echo 'DISPOSABLE PG17 ONLY; NO production credentials, no live Supabase write, no deployment.'
