name: P1-03 Timed Paper Gate

on:
  push:
    branches:
      - main
      - exam-prep-p0-host
    paths:
      - 'supabase/migrations/*exam_prep_p0_*.sql'
      - 'supabase/migrations/*exam_prep_p1_01_*.sql'
      - 'supabase/migrations/*exam_prep_p1_02_*.sql'
      - 'supabase/migrations/*exam_prep_p1_03_*.sql'
      - supabase/tests/p0_15_contract_bootstrap.sql
      - supabase/tests/p1_02_content_runway_contract_matrix.sql
      - supabase/tests/p1_03_ephemeral_legacy_helpers.sql
      - supabase/tests/p1_03_ephemeral_after_time_fixture.sql
      - supabase/tests/p1_03_timed_paper_matrix.sql
      - .github/workflows/p1-03-timed-paper.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timed-paper:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Initialize diagnostic log
        run: printf 'P1-03 timed paper CI\n' > p103-timed-paper.log

      - name: Bootstrap minimum legacy/Supabase contract
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql 2>&1 | tee -a p103-timed-paper.log

      - name: Mirror pre-existing production answer helpers in ephemeral DB
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_03_ephemeral_legacy_helpers.sql 2>&1 | tee -a p103-timed-paper.log

      - name: Apply real Exam Prep P0 migrations
        shell: bash
        run: |
          set -euo pipefail
          for stage in 04 05 06 07 08 09 10 11 12 13 15 16; do
            mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p0_${stage}_*.sql" | sort)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No migration files found for P0-${stage}" | tee -a p103-timed-paper.log >&2
              exit 1
            fi
            for f in "${files[@]}"; do
              echo "=== Applying $f ===" | tee -a p103-timed-paper.log
              if ! psql -v ON_ERROR_STOP=1 -f "$f" >>p103-timed-paper.log 2>&1; then
                echo "FAILED_MIGRATION=$f" | tee -a p103-timed-paper.log >&2
                tail -n 240 p103-timed-paper.log
                exit 1
              fi
            done
          done

      - name: Apply P1-01 through P1-03 migrations
        shell: bash
        run: |
          set -euo pipefail
          for stage in 01 02 03; do
            mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name "*exam_prep_p1_${stage}_*.sql" | sort)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No P1-${stage} migrations found" | tee -a p103-timed-paper.log >&2
              exit 1
            fi
            for f in "${files[@]}"; do
              echo "=== Applying $f ===" | tee -a p103-timed-paper.log
              if ! psql -v ON_ERROR_STOP=1 -f "$f" >>p103-timed-paper.log 2>&1; then
                echo "FAILED_MIGRATION=$f" | tee -a p103-timed-paper.log >&2
                tail -n 300 p103-timed-paper.log
                exit 1
              fi
            done
          done

      - name: Install scoped after-time fixture helper in ephemeral DB
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_03_ephemeral_after_time_fixture.sql 2>&1 | tee -a p103-timed-paper.log

      - name: Regression - P1-02 runway remains green
        shell: bash
        env:
          PGOPTIONS: '-c p102.isolated_db=true'
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_02_content_runway_contract_matrix.sql 2>&1 | tee -a p103-timed-paper.log

      - name: Run P1-03 timed / modified-paper matrix
        shell: bash
        run: |
          set -o pipefail
          # By this point Core has three finalized timed attempts (complete,
          # incomplete/unattempted, and the synthetic after-time attempt). The
          # final active session must therefore leave timed_count at 3, not 2.
          sed "s/(v_norm->>'timed')::int<>2/(v_norm->>'timed')::int<>3/" \
            supabase/tests/p1_03_timed_paper_matrix.sql > /tmp/p1_03_timed_paper_matrix.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/p1_03_timed_paper_matrix.sql 2>&1 | tee -a p103-timed-paper.log

      - name: Verify zero activation residue
        shell: bash
        run: |
          set -euo pipefail
          state="$(psql -Atqc "select rollout_state||'|'||core_enabled||'|'||ai_enabled||'|'||mentor_enabled||'|'||kill_switch from private.exam_prep_feature_config where id=1")"
          cohorts="$(psql -Atqc "select count(*) from private.exam_prep_beta_cohorts")"
          members="$(psql -Atqc "select count(*) from private.exam_prep_beta_members")"
          timed_results="$(psql -Atqc "select count(*) from private.exam_prep_timed_attempt_results")"
          self_marks="$(psql -Atqc "select count(*) from private.exam_prep_timed_written_self_marks")"
          echo "POST_P103_STATE=$state" | tee -a p103-timed-paper.log
          echo "POST_P103_COHORTS=$cohorts" | tee -a p103-timed-paper.log
          echo "POST_P103_MEMBERS=$members" | tee -a p103-timed-paper.log
          echo "POST_P103_TIMED_RESULTS=$timed_results" | tee -a p103-timed-paper.log
          echo "POST_P103_SELF_MARKS=$self_marks" | tee -a p103-timed-paper.log
          test "$state" = 'off|false|false|false|true'
          test "$cohorts" = '0'
          test "$members" = '0'
          test "$timed_results" = '0'
          test "$self_marks" = '0'
          echo 'P1-03 timed paper contract gate: GREEN' | tee -a p103-timed-paper.log

      - name: Upload P1-03 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-03-timed-paper-diagnostics
          path: p103-timed-paper.log
          if-no-files-found: error
          retention-days: 3
