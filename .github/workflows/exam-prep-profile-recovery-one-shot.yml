name: One-shot reviewed profile recovery promotion (DRAFT branch only)
on:
  push:
    branches: ['fix/exam-prep-weekly-goal-flow-safe']
    paths: ['.github/workflows/exam-prep-profile-recovery-one-shot.yml']
permissions:
  contents: read
jobs:
  verify-before-promote:
    if: github.repository == 'jteshaboev1984-ops/iClub_APP' && github.event.head_commit.message == 'ci(exam-prep): one-shot guarded profile recovery draft promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact prior head and one added workflow only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'b79ed3ce8180a121c9aa5ba1526376a3a0a022eb'
          test "$(git show --pretty=format: --name-only HEAD | sed '/^$/d')" = '.github/workflows/exam-prep-profile-recovery-one-shot.yml'
          node scripts/weekly-flow-profile-recovery-cutover.cjs
          node scripts/weekly-flow-profile-recovery-cutover.cjs --apply
          node --check exam-prep/exam-prep-api.js
          node --check exam-prep/exam-prep-recovery.js
          node --check exam-prep/exam-prep-exam-map.js
          node scripts/weekly-flow-profile-recovery-regression.cjs
          node scripts/p2-07-recovery-regression.cjs
          node scripts/weekly-flow-adapter-regression.cjs
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
  promote-reviewed-only:
    needs: verify-before-promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exam-prep-weekly-goal-flow-safe
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote exact three source patches, never merge or deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'b79ed3ce8180a121c9aa5ba1526376a3a0a022eb'
          node scripts/weekly-flow-profile-recovery-cutover.cjs
          node scripts/weekly-flow-profile-recovery-cutover.cjs --apply
          node scripts/weekly-flow-profile-recovery-regression.cjs
          node --check exam-prep/exam-prep-api.js
          node --check exam-prep/exam-prep-recovery.js
          node --check exam-prep/exam-prep-exam-map.js
          git diff --check
          expected="$(printf '%s\n' exam-prep/exam-prep-api.js exam-prep/exam-prep-recovery.js exam-prep/exam-prep-exam-map.js | LC_ALL=C sort)"
          actual="$(git diff --name-only | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git hash-object exam-prep/exam-prep-api.js exam-prep/exam-prep-recovery.js exam-prep/exam-prep-exam-map.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- exam-prep/exam-prep-api.js exam-prep/exam-prep-recovery.js exam-prep/exam-prep-exam-map.js
          git commit -m 'fix(exam-prep): retain guarded weekly plans after profile edits and interruptions'
          git push origin HEAD:refs/heads/fix/exam-prep-weekly-goal-flow-safe
