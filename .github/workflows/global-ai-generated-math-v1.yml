name: Global AI Generated Mathematics v1

on:
  pull_request:
    branches:
      - feat/subject-selection-shadow-v1
      - main
    paths:
      - 'supabase/migrations/20261006173000_iclub_global_ai_generation_adapter_v1.sql'
      - 'supabase/reversions/20261006173000_iclub_global_ai_generation_adapter_v1_revert.sql'
      - 'supabase/tests/global_ai_generation_adapter_v1_matrix.sql'
      - 'supabase/functions/global-ai/**'
      - '.github/scripts/global_ai_generation_v1_contract.js'
      - '.github/scripts/global_ai_gateway_foundation_v1_contract.js'
      - '.github/workflows/global-ai-generated-math-v1.yml'
  push:
    branches:
      - feat/global-ai-generation-v1
      - main
    paths:
      - 'supabase/migrations/20261006173000_iclub_global_ai_generation_adapter_v1.sql'
      - 'supabase/reversions/20261006173000_iclub_global_ai_generation_adapter_v1_revert.sql'
      - 'supabase/tests/global_ai_generation_adapter_v1_matrix.sql'
      - 'supabase/functions/global-ai/**'
      - '.github/scripts/global_ai_generation_v1_contract.js'
      - '.github/scripts/global_ai_gateway_foundation_v1_contract.js'
      - '.github/workflows/global-ai-generated-math-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation-safety:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Initialize diagnostics
        run: printf 'Global AI generated Mathematics v1 CI\n' > global-ai-generation.log

      - name: Bootstrap isolated Supabase contract
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_15_contract_bootstrap.sql 2>&1 | tee -a global-ai-generation.log

      - name: Apply dormant commercial dependency stack
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006102000_iclub_global_ai_tariff_foundation_v1.sql 2>&1 | tee -a global-ai-generation.log
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006113000_iclub_global_ai_gateway_foundation_v1.sql 2>&1 | tee -a global-ai-generation.log
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006124000_iclub_global_ai_ui_bootstrap_v1.sql 2>&1 | tee -a global-ai-generation.log
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006133000_iclub_global_ai_conversation_ui_v1.sql 2>&1 | tee -a global-ai-generation.log
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006143000_iclub_plans_profile_ui_v1.sql 2>&1 | tee -a global-ai-generation.log
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006153000_iclub_subscription_access_lifecycle_v1.sql 2>&1 | tee -a global-ai-generation.log
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006153100_iclub_grandfather_subject_access_v1.sql 2>&1 | tee -a global-ai-generation.log
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006164000_iclub_subject_selection_shadow_ui_v1.sql 2>&1 | tee -a global-ai-generation.log

      - name: Static learner-data preservation guard
        shell: bash
        run: |
          set -euo pipefail
          migration='supabase/migrations/20261006173000_iclub_global_ai_generation_adapter_v1.sql'
          ! grep -Eiq '\b(update|delete[[:space:]]+from|truncate)[[:space:]]+public\.(users|user_subjects|practice_attempts|practice_answers|tour_attempts|tour_answers|certificates|recommendations|ratings_cache)\b' "$migration"
          ! grep -Eiq '\binsert[[:space:]]+into[[:space:]]+public\.(users|user_subjects|practice_attempts|practice_answers|tour_attempts|tour_answers|certificates|recommendations|ratings_cache)\b' "$migration"
          ! grep -Eiq '\b(master(y|ies)|readiness|progression|placement)[[:space:]]*=' "$migration"

      - name: Apply dormant generated adapter
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006173000_iclub_global_ai_generation_adapter_v1.sql 2>&1 | tee -a global-ai-generation.log

      - name: Prove runtime remains OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -Atqc "select generation_enabled from private.iclub_global_ai_runtime_config where id=1")" = 'f'
          test "$(psql -Atqc "select global_ai_rollout_mode from private.iclub_global_ai_runtime_config where id=1")" = 'off'
          test "$(psql -Atqc "select count(*) from private.iclub_global_ai_provider_leases")" = '0'

      - name: Run generated adapter SQL matrix
        shell: bash
        env:
          PGOPTIONS: '-c global_ai.generation_isolated=true'
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/global_ai_generation_adapter_v1_matrix.sql 2>&1 | tee -a global-ai-generation.log

      - name: Validate generation static contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/global_ai_generation_v1_contract.js
          node --check .github/scripts/global_ai_gateway_foundation_v1_contract.js
          node .github/scripts/global_ai_generation_v1_contract.js 2>&1 | tee -a global-ai-generation.log
          node .github/scripts/global_ai_gateway_foundation_v1_contract.js 2>&1 | tee -a global-ai-generation.log

      - name: Type-check Global AI Edge Function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check generated gateway
        run: deno check supabase/functions/global-ai/index.ts

      - name: Prove safe pre-activation generation rollback
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/reversions/20261006173000_iclub_global_ai_generation_adapter_v1_revert.sql 2>&1 | tee -a global-ai-generation.log
          test "$(psql -Atqc "select to_regprocedure('public.reserve_iclub_global_ai_provider_call_service_v1(uuid,uuid,text,text,text,numeric)') is null")" = 't'
          test "$(psql -Atqc "select to_regclass('private.iclub_global_ai_provider_leases') is null")" = 't'
          test "$(psql -Atqc "select count(*) from information_schema.columns where table_schema='private' and table_name='iclub_global_ai_gateway_audit' and column_name in ('model_provider','model_id','input_tokens','output_tokens','estimated_cost_usd')")" = '0'

      - name: Mark generated Mathematics adapter GREEN
        run: echo 'GLOBAL AI GENERATED MATHEMATICS V1 GREEN' | tee -a global-ai-generation.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-ai-generated-math-v1
          path: global-ai-generation.log
          if-no-files-found: error
          retention-days: 7
