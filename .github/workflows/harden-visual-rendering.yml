name: Harden visual question rendering

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reject legacy relative URLs and localise controls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          old = '''    const raw = String(value || "").trim();
    if (!raw) return "";

    try {'''
          new = '''    const raw = String(value || "").trim();
    if (!raw) return "";
    // Legacy relative filenames are not reliable question assets and must not block a tour.
    if (!/^https?:\\/\\//i.test(raw)) return "";

    try {'''
          if text.count(old) != 1:
              raise SystemExit('normalizeQuestionImageUrl anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    retryBtn.hidden = true;
    status.hidden = true;

    if (!url) {'''
          new = '''    retryBtn.hidden = true;
    retryBtn.textContent = tr3(
      "Повторить загрузку",
      "Qayta yuklash",
      "Retry loading"
    );
    openBtn.setAttribute("aria-label", tr3(
      "Увеличить изображение",
      "Rasmni kattalashtirish",
      "Enlarge image"
    ));
    status.hidden = true;

    if (!url) {'''
          if text.count(old) != 1:
              raise SystemExit('image control localisation anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    __questionImageModalBound = true;
    if (closeBtn) closeBtn.addEventListener("click", closeQuestionImageModal);'''
          new = '''    __questionImageModalBound = true;
    if (closeBtn) {
      closeBtn.setAttribute("aria-label", tr3("Закрыть", "Yopish", "Close"));
      closeBtn.addEventListener("click", closeQuestionImageModal);
    }'''
          if text.count(old) != 1:
              raise SystemExit('modal close anchor not found exactly once')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate hardening
        run: |
          node --check app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('app.js').read_text(encoding='utf-8')
          assert 'if (!/^https?:\\/\\//i.test(raw)) return "";' in text
          assert '"Qayta yuklash"' in text
          assert '"Rasmni kattalashtirish"' in text
          print('Visual rendering hardening validated.')
          PY

      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/harden-visual-rendering.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden and localise visual question rendering"
          git push origin HEAD:${{ github.head_ref }}
