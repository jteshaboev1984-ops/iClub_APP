<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>iClub AI Lab Cleanup</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f3f6fb; color: #071124; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    .card { width: min(440px, 100%); border: 1px solid #dbe3ef; border-radius: 18px; background: #fff; padding: 18px; box-shadow: 0 18px 50px rgba(15, 23, 42, .10); }
    h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.15; }
    p { margin: 0; color: #475569; font-size: 14px; line-height: 1.4; }
    .small { margin-top: 10px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Очищаем AI-lab тесты…</h1>
      <p>Удаляются только локальные события тестовой AI-lab сессии из интерфейса. Профиль, база, реальные попытки и сертификаты не удаляются.</p>
      <div class="small" id="cleanup-status">Подготовка…</div>
    </div>
  </div>
  <script>
    (function () {
      'use strict';

      var statusEl = document.getElementById('cleanup-status');
      var start = Date.parse('2026-07-08T09:00:00.000Z');
      var end = Date.parse('2026-07-08T13:00:00.000Z');
      var targetTypes = new Set([
        'practice_attempt_started',
        'practice_attempt_finished',
        'practice_db_save_result',
        'practice_review_opened',
        'recommendation_opened',
        'ai_lab_practice_attempt_started',
        'ai_lab_practice_attempt_finished',
        'ai_lab_practice_db_save_result',
        'ai_lab_practice_review_opened',
        'ai_lab_recommendation_opened'
      ]);

      function eventTs(event) {
        var raw = event && (event.ts || event.payload && event.payload.ts || event.payload && event.payload._db_created_at);
        var parsed = typeof raw === 'number' ? raw : Date.parse(String(raw || ''));
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function isEconomics(payload) {
        if (!payload) return false;
        return String(payload.subject_id || payload.subject_key || payload.subject_id_db || '').toLowerCase() === 'economics'
          || String(payload.subject_id_db || '') === '7';
      }

      function isLabEvent(event) {
        var type = String(event && event.type || '');
        var payload = event && event.payload || {};
        var ts = eventTs(event);
        if (payload._is_lab === true || payload._is_lab === 'true') return true;
        if (!targetTypes.has(type)) return false;
        if (!isEconomics(payload)) return false;
        return ts >= start && ts < end;
      }

      var removed = 0;
      try {
        var raw = localStorage.getItem('iclub_events_v1');
        if (raw) {
          var store = JSON.parse(raw);
          var items = Array.isArray(store) ? store : Array.isArray(store && store.items) ? store.items : [];
          var keep = items.filter(function (event) {
            var remove = isLabEvent(event);
            if (remove) removed += 1;
            return !remove;
          });

          if (Array.isArray(store)) {
            localStorage.setItem('iclub_events_v1', JSON.stringify(keep));
          } else if (store && typeof store === 'object') {
            store.items = keep;
            localStorage.setItem('iclub_events_v1', JSON.stringify(store));
          }
        }
      } catch (e) {}

      try { localStorage.removeItem('iclub_state_v1'); } catch (e) {}

      if (statusEl) statusEl.textContent = 'Удалено локальных AI-lab событий: ' + removed + '. Возвращаемся в app…';
      setTimeout(function () { window.location.replace('/'); }, 900);
    })();
  </script>
</body>
</html>
