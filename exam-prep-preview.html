<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
  <title>iClub · Cambridge AS Mathematics Exam Prep Preview</title>
  <link rel="stylesheet" href="exam-prep/exam-prep.css" />
</head>
<body class="ep-preview-body">
  <div class="exam-prep-preview">
    <header class="ep-preview-topbar">
      <div class="ep-topbar-inner">
        <div class="ep-brand">
          <div class="ep-brand-mark" aria-hidden="true">iC</div>
          <div class="ep-brand-copy">
            <strong id="ep-title">Cambridge AS Mathematics</strong>
            <span id="ep-subtitle">Paper 1 + Paper 5</span>
          </div>
          <span class="ep-preview-badge" id="ep-preview-badge">Preview</span>
        </div>
        <div class="ep-controls" aria-label="Preview controls">
          <select class="ep-control" id="ep-language" aria-label="Language"></select>
          <select class="ep-control" id="ep-profile" aria-label="Learner scenario"></select>
          <select class="ep-control" id="ep-service" aria-label="Support mode"></select>
        </div>
      </div>
      <div class="ep-preview-notice"><div id="ep-preview-notice">Static preview. No real data is used.</div></div>
    </header>

    <nav class="ep-route-nav" aria-label="Exam Prep preview screens">
      <div class="ep-route-nav-inner" id="ep-route-nav"></div>
    </nav>

    <main class="ep-preview-main">
      <div id="exam-prep-root" class="exam-prep" aria-live="polite"></div>
    </main>

    <footer class="ep-safety-footer">
      <div class="ep-safety-footer-inner">
        <span id="ep-safety-status">P0-01 checks pending…</span>
        <span>Supabase: OFF · Production entry: NONE · Legacy storage: untouched</span>
      </div>
    </footer>
  </div>

  <script src="exam-prep/exam-prep-config.js"></script>
  <script src="exam-prep/exam-prep-i18n.js"></script>
  <script src="exam-prep/exam-prep-contracts.js"></script>
  <script src="exam-prep/exam-prep-static-data.js"></script>
  <script src="exam-prep/exam-prep-engine.js"></script>
  <script src="exam-prep/exam-prep-store.js"></script>
  <script src="exam-prep/exam-prep-ui.js"></script>
  <script src="exam-prep/exam-prep-controller.js"></script>
</body>
</html>
