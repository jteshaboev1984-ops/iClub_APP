<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>iClub AI Diagnostic Lab</title>
  <link rel="icon" href="logo.png" type="image/png" />
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071124;
    }

    .lab-shell {
      position: fixed;
      inset: 0;
      display: grid;
      background: #071124;
    }

    .lab-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .lab-loading {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: #071124;
      color: #ffffff;
      font: 800 14px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 0.18s ease;
    }

    .lab-loading.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="lab-shell">
    <iframe
      id="iclub-lab-frame"
      class="lab-frame"
      src="/?ai_diag=1&ai_diag_empty=1&ai_lab=1"
      title="iClub App AI Diagnostic Lab"
    ></iframe>
  </div>

  <div class="lab-loading" id="lab-loading">Opening iClub AI Diagnostic Lab…</div>

  <script>
    (function () {
      'use strict';

      var frame = document.getElementById('iclub-lab-frame');
      var loading = document.getElementById('lab-loading');

      function injectScriptOnce(doc, src, flag) {
        if (doc.querySelector('script[' + flag + '="1"]')) return;
        var js = doc.createElement('script');
        js.src = src;
        js.setAttribute(flag, '1');
        doc.body.appendChild(js);
      }

      function injectIntoFrame() {
        try {
          var win = frame.contentWindow;
          var doc = frame.contentDocument || win.document;
          if (!win || !doc || !doc.head || !doc.body) return;

          try {
            win.localStorage.setItem('iclub_ai_diag_enabled', '1');
            win.localStorage.setItem('iclub_ai_diag_show_empty', '1');
          } catch (e) {}

          if (!doc.querySelector('link[data-ai-diagnosis-lab-css="1"]')) {
            var css = doc.createElement('link');
            css.rel = 'stylesheet';
            css.href = 'ai-diagnosis-archive-preview.css?v=lab2';
            css.setAttribute('data-ai-diagnosis-lab-css', '1');
            doc.head.appendChild(css);
          }

          injectScriptOnce(doc, 'ai-diagnosis-archive-preview.js?v=lab2', 'data-ai-diagnosis-lab-js');
          injectScriptOnce(doc, 'ai-diagnosis-lab-result-fix.js?v=lab2', 'data-ai-diagnosis-lab-result-fix');

          setTimeout(function () {
            try {
              if (win.iClubAiDiagnosisArchivePreview && typeof win.iClubAiDiagnosisArchivePreview.refresh === 'function') {
                win.iClubAiDiagnosisArchivePreview.refresh();
              }
            } catch (e) {}
          }, 900);
        } catch (e) {
          // Same-origin injection is expected on Vercel. If it fails, keep the app usable.
        }
      }

      frame.addEventListener('load', function () {
        injectIntoFrame();
        setTimeout(injectIntoFrame, 800);
        setTimeout(injectIntoFrame, 1800);
        if (loading) {
          setTimeout(function () { loading.classList.add('is-hidden'); }, 450);
        }
      });
    })();
  </script>
</body>
</html>
