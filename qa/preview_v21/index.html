<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#18233b;background:#f5f8fd}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:0 auto;padding:18px 20px 112px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(130deg,#2062f2,#65b8ff);color:#fff;font-size:20px;font-weight:800;display:grid;place-items:center;box-shadow:0 6px 22px #2762df26}header{display:flex;gap:12px;align-items:center}.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.4px}.sub{color:#697993;font-size:12px;margin-top:3px}.locale{border:1px solid #d7e2f1;border-radius:11px;background:#fff;padding:9px;color:#263956;font-weight:650}.banner{margin-top:25px;padding:13px 16px;border:1px solid #dce5f6;border-radius:16px;background:#fff;color:#496080;font-size:13px}.card{margin-top:18px;border:1px solid #e1e9f6;border-radius:21px;background:#fff;padding:20px;box-shadow:0 8px 30px #152d5a0b}.card h2{margin:0 0 13px;font-size:20px;letter-spacing:-.5px}.card p{font-size:14px;color:#63738c;line-height:1.6}.status{margin:11px 0;border-radius:12px;background:#eff5ff;padding:13px;font-size:14px;font-weight:700;color:#2654ab}.order{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:10px}.order li{padding:12px 14px;background:#f5f8fc;border-radius:12px;display:flex;gap:13px;align-items:center;font-size:14px}.order b{width:26px;height:26px;display:grid;place-items:center;border-radius:9px;background:#e7efff;color:#2f64cd}button{font:inherit;cursor:pointer}.secondary{border:1px solid #dae3ef;background:#fff;border-radius:10px;padding:10px 14px;color:#205dcc;font-weight:650}.examples{margin-top:20px;color:#425773;font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.98);border-top:1px solid #dce6f2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));box-shadow:0 -5px 28px #17365b0c}.bottom button{min-width:0;border:0;border-radius:12px;background:transparent;display:grid;justify-items:center;gap:5px;padding:10px 2px;color:#697b95;font-size:12px;font-weight:650}.bottom button[aria-current=page]{background:#edf4ff;color:#205ed4}.bottom svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.route{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}:focus-visible{outline:3px solid #60a5fa;outline-offset:3px}@media(max-width:390px){main{padding:14px 14px 120px}.card{padding:17px}.bottom button{font-size:11px}}@media(min-width:800px){.bottom{left:50%;right:auto;transform:translateX(-50%);width:720px;border-left:1px solid #e1e8f0;border-right:1px solid #e1e8f0;border-radius:18px 18px 0 0}}</style></head><body>
<main><div class="brand"><header><div class="mark" aria-hidden="true">i</div><div><h1>iClub AI</h1><div class="sub" id="header-text"></div></div></header><div><label for="lang" class="sr-only" id="lang-label">Язык интерфейса</label><select id="lang" class="locale" aria-labelledby="lang-label"><option value="ru">RU</option><option value="uz">UZ</option><option value="en">EN</option></select></div></div>
<div class="banner" id="preview-caption"></div><section class="card" aria-labelledby="page-heading"><h2 id="page-heading"></h2><div id="main-content"></div><div class="route" id="route-actions"></div></section>
<div class="card"><h2 id="help-heading"></h2><p id="help-copy"></p></div><div class="examples" id="build-note"></div></main>
<nav class="bottom" id="tabbar" aria-label="Нижнее меню"></nav>
<script>(()=>{"use strict";
const text={"ru":{"home":"Главная","courses":"Учёба","ratings":"Рейтинг","profile":"Профиль","about":"О проекте","support":"Поддержка","title":"Следующий шаг","off":"Персональные рекомендации ещё недоступны","explain":"После серверной проверки здесь появится безопасный следующий шаг. Прогресс ученика не меняется.","note":"Порядок действий — пример, не рекомендация ученику","back":"На главную","lang":"Язык интерфейса","head":"Демонстрация iClub AI","details":"Реальные данные и AI-запросы не используются","steps":["Разобрать ошибки Practice","Посмотреть открытый архив Tour","Продолжить обучение"]},"uz":{"home":"Bosh sahifa","courses":"O‘qish","ratings":"Reyting","profile":"Profil","about":"Loyiha haqida","support":"Yordam","title":"Keyingi qadam","off":"Shaxsiy tavsiyalar hozircha mavjud emas","explain":"Server tekshiruvidan keyin bu yerda xavfsiz keyingi qadam ko‘rsatiladi. O‘quvchi natijalari o‘zgarmaydi.","note":"Harakatlar tartibi — namuna, shaxsiy tavsiya emas","back":"Bosh sahifaga","lang":"Interfeys tili","head":"iClub AI namoyishi","details":"Haqiqiy ma’lumotlar va AI so‘rovlari ishlatilmaydi","steps":["Practice xatolarini tahlil qilish","Ochiq Tour arxivini ko‘rish","O‘qishni davom ettirish"]},"en":{"home":"Home","courses":"Study","ratings":"Ratings","profile":"Profile","about":"About project","support":"Support","title":"Next step","off":"Personal recommendations are not available yet","explain":"After server verification, a safe next action will appear here. Student progress is never changed.","note":"This order is an example, not a personal recommendation","back":"Go Home","lang":"Interface language","head":"iClub AI demonstration","details":"No real student data or AI requests are used","steps":["Review finished Practice mistakes","Review an open Tour archive","Continue studying"]}};const copy={"ru":{"nav_home":"В нижнем меню выберите «Главная».","nav_courses":"В нижнем меню выберите «Учёба».","nav_ratings":"В нижнем меню выберите «Рейтинг».","nav_profile":"В нижнем меню выберите «Профиль».","nav_about":"Откройте вкладку «Главная» и выберите «О проекте».","nav_support":"Откройте «Профиль» и выберите «Поддержка»."},"uz":{"nav_home":"Pastki menyudan «Bosh sahifa»ni tanlang.","nav_courses":"Pastki menyudan «O‘qish»ni tanlang.","nav_ratings":"Pastki menyudan «Reyting»ni tanlang.","nav_profile":"Pastki menyudan «Profil»ni tanlang.","nav_about":"«Bosh sahifa» bo‘limiga o‘ting va «Loyiha haqida»ni tanlang.","nav_support":"«Profil» bo‘limini oching va «Yordam»ni tanlang."},"en":{"nav_home":"In the bottom menu, choose “Home”.","nav_courses":"In the bottom menu, choose “Study”.","nav_ratings":"In the bottom menu, choose “Ratings”.","nav_profile":"In the bottom menu, choose “Profile”.","nav_about":"On “Home”, choose “About project”.","nav_support":"Open “Profile” and choose “Support”."}};
const viewNames=["home","courses","ratings","profile"],icon={home:'<path d="m3 10 9-7 9 7v11H3z"/><path d="M9 21v-8h6v8"/>',courses:'<path d="M5 3h14v18H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M3 18a2 2 0 0 1 2-2h14"/>',ratings:'<path d="M5 20V11M12 20V4M19 20V8M3 20h18"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4.5 21a8 8 0 0 1 15 0"/>'};
let lang="ru",view="home";
const byId=id=>document.getElementById(id);
const nav=byId("tabbar");
for(const v of viewNames){const b=document.createElement("button");b.type="button";b.dataset.tab=v;const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox","0 0 24 24");svg.setAttribute("aria-hidden","true");svg.innerHTML=icon[v];const span=document.createElement("span");span.dataset.label=v;b.append(svg,span);b.addEventListener("click",()=>{view=v;render()});nav.append(b)}
function addButton(label,to){const b=document.createElement("button");b.className="secondary";b.type="button";b.textContent=label;b.onclick=()=>{view=to;render()};byId("route-actions").append(b)}
function render(){const t=text[lang];document.documentElement.lang=lang;byId("header-text").textContent=t.details;byId("lang-label").textContent=t.lang;byId("preview-caption").textContent=t.head+" · "+t.details;nav.setAttribute("aria-label",({ru:"Нижнее меню",uz:"Pastki menyu",en:"Bottom navigation"})[lang]);
for(const b of nav.querySelectorAll("button")){const v=b.dataset.tab;b.querySelector("span").textContent=t[v];if(v===view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")}
byId("page-heading").textContent=t[view];byId("help-heading").textContent=t.head;byId("help-copy").textContent=copy[lang]["nav_"+view];byId("route-actions").replaceChildren();byId("main-content").replaceChildren();
if(view==="home"){const ttl=document.createElement("h3");ttl.textContent=t.title;const stat=document.createElement("div");stat.className="status";stat.textContent=t.off;const para=document.createElement("p");para.textContent=t.explain;const note=document.createElement("p");note.textContent=t.note;const ul=document.createElement("ul");ul.className="order";for(let i=0;i<3;i++){const li=document.createElement("li"),num=document.createElement("b"),txt=document.createElement("span");num.textContent=String(i+1);txt.textContent=t.steps[i];li.append(num,txt);ul.append(li)}byId("main-content").append(ttl,stat,para,note,ul);addButton(t.about,"about")}
else if(view==="profile"){addButton(t.support,"support")}
else if(view==="about"||view==="support")addButton(t.back,"home");
else{const p=document.createElement("p");p.textContent=t.explain;byId("main-content").append(p)}
byId("build-note").textContent=t.details}
byId("lang").addEventListener("change",e=>{lang=e.target.value;render()});render();
})();</script></body></html>
