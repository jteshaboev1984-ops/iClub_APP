<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'; img-src 'none'; frame-ancestors 'none'">
<title>iClub AI Home — isolated QA demonstration</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7fc;color:#20324e}
*{box-sizing:border-box}body{margin:0}main{max-width:640px;margin:auto;padding:22px 17px 115px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
h1{margin:0;font-size:23px;letter-spacing:-.5px}h2{font-size:19px;margin:0 0 14px}
small{color:#6e7e99}select,button{font:inherit}
select{border:1px solid #cad6ea;border-radius:9px;background:white;padding:8px}
.card{background:white;border:1px solid #dfebf8;border-radius:18px;padding:22px;margin-top:22px;box-shadow:0 10px 25px #243c670b}
.note{line-height:1.55;font-size:14px;color:#657693}.result{border-radius:12px;padding:16px;background:#eff5ff;color:#2453ac;min-height:68px;font-weight:650}
.choices{display:grid;gap:8px;margin-top:12px}.choices:empty{display:none}
.choice-item{width:100%;text-align:center;border:1px solid #dce8f7;background:#fafcff;padding:12px 14px;border-radius:11px;font-size:14px;font-weight:700;color:#254a88;cursor:pointer}
.primary{background:#245fe0;color:white;border:0;border-radius:11px;padding:12px 17px;margin-top:16px;font-weight:700}
.secondary{background:white;color:#3159aa;border:1px solid #d4def1;border-radius:10px;padding:9px;margin-top:16px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:white;border-top:1px solid #dce6f5;padding:8px}
nav button{border:0;background:transparent;padding:10px 3px;border-radius:9px;min-width:0;font-size:12px;color:#63738b}
nav button[aria-current=page]{color:#2159d3;background:#eaf2ff;font-weight:700}
:focus-visible{outline:3px solid #63a1f5;outline-offset:2px}
@media(max-width:375px){h1{font-size:20px}.card{padding:15px}}
</style></head>
<body>
<main>
<header><div><h1>iClub AI · Home</h1><small id="caption"></small></div>
<div><label id="locale-label" for="locale">Язык</label>
<select id="locale"><option value="ru">RU</option><option value="uz">UZ</option><option value="en">EN</option></select></div></header>
<section id="home-card" class="card" aria-labelledby="heading">
<h2 id="heading"></h2><p class="note" id="explain"></p>
<div id="result" class="result" role="status" aria-live="polite" data-state="idle"></div>
<div id="choices" class="choices" role="list" aria-label="Разрешённые предметы"></div>
<button id="check" type="button" class="primary"></button>
<button id="confirm" type="button" class="secondary" hidden></button>
<button id="open-study" type="button" class="primary" hidden></button>
<button id="leave" type="button" class="secondary"></button>
</section>
<section id="study-panel" class="card" aria-labelledby="study-heading" hidden>
<h2 id="study-heading"></h2>
<p id="study-subject" class="note"></p>
<div id="study-result" class="result" role="status" aria-live="polite"></div>
<p id="study-disclaimer" class="note"></p>
<button id="study-back" type="button" class="secondary"></button>
</section>
</main>
<nav id="tabs" aria-label="Нижнее меню">
<button data-page="home" aria-current="page"></button>
<button data-page="courses"></button>
<button data-page="ratings"></button>
<button data-page="profile"></button>
</nav>
<script>
(()=>{"use strict";
const LANG={
ru:{caption:"Без реальных учеников и внешнего AI",heading:"Следующий шаг",
 explain:"Демонстрация проверенного сервером выбора. Учебные результаты не меняются.",
 check:"Проверить следующий шаг",leave:"Выйти из демонстрации",
 confirm:"Проверить выбранное действие",confirming:"Проверяем выбранное действие",
 openStudy:"Открыть учебный раздел",opening:"Открываем учебный раздел",
 studyBack:"Вернуться на главную",studyReadOnly:"Проверочный просмотр. Учебные результаты не изменяются.",
 studyPracticeSummary:"Ошибок для разбора: ",studyTourSummary:"Архив завершённого тура доступен для просмотра.",
 studySubjectSummary:"Можно продолжить изучение выбранного предмета.",
 confirmed:"Действие подтверждено. Учебный прогресс не изменён",
 idle:"Нажмите, чтобы проверить разрешённое действие",pending:"Проверяем доступ",expired:"Срок рекомендации истёк. Проверьте снова",
 denied:"Рекомендация сейчас недоступна",left:"Сеанс завершён",
 review_finalized_practice:"Разобрать ошибки Practice",
 review_open_tour_archive:"Посмотреть открытый архив Tour",
 continue_enrolled_subject:"Продолжить обучение",selection_required:"Выберите предмет",
 tab:["Главная","Учёба","Рейтинг","Профиль"],nav:"Нижнее меню",lang:"Язык"},
uz:{caption:"Haqiqiy o‘quvchilar va tashqi AI ishlatilmaydi",heading:"Keyingi qadam",
 explain:"Server tasdiqlagan tanlov namoyishi. O‘quvchining natijalari o‘zgarmaydi.",
 check:"Keyingi qadamni tekshirish",leave:"Namoyishdan chiqish",
 confirm:"Tanlangan qadamni tekshirish",confirming:"Tanlov tekshirilmoqda",
 openStudy:"O‘quv bo‘limini ochish",opening:"O‘quv bo‘limi ochilmoqda",
 studyBack:"Bosh sahifaga qaytish",studyReadOnly:"Sinov ko‘rish. O‘qish natijalari o‘zgarmaydi.",
 studyPracticeSummary:"Ko‘rib chiqiladigan xatolar: ",studyTourSummary:"Yakunlangan tur arxivi ko‘rish uchun ochiq.",
 studySubjectSummary:"Tanlangan fanni o‘rganishni davom ettirish mumkin.",
 confirmed:"Tanlov tasdiqlandi. O‘qish natijalari o‘zgarmadi",
 idle:"Mumkin bo‘lgan qadamni tekshirish uchun bosing",pending:"Ruxsat tekshirilmoqda",expired:"Tavsiya muddati tugadi. Qayta tekshiring",
 denied:"Tavsiya hozircha mavjud emas",left:"Seans yakunlandi",
 review_finalized_practice:"Practice xatolarini tahlil qilish",
 review_open_tour_archive:"Ochiq Tour arxivini ko‘rish",
 continue_enrolled_subject:"O‘qishni davom ettirish",selection_required:"Fanni tanlang",
 tab:["Bosh sahifa","O‘qish","Reyting","Profil"],nav:"Pastki menyu",lang:"Til"},
en:{caption:"No real students or external AI",heading:"Next step",
 explain:"Demonstration of a server-verified choice. Student progress is unchanged.",
 check:"Check next step",leave:"Leave demonstration",
 confirm:"Verify selected action",confirming:"Verifying selected action",
 openStudy:"Open study section",opening:"Opening study section",
 studyBack:"Return to Home",studyReadOnly:"Test-only view. Learning progress is unchanged.",
 studyPracticeSummary:"Mistakes to review: ",studyTourSummary:"The completed Tour archive is available to view.",
 studySubjectSummary:"You can continue learning this subject.",
 confirmed:"Action verified. Study progress was not changed",
 idle:"Select to verify an eligible action",pending:"Checking access",expired:"Recommendation expired. Check again",
 denied:"A recommendation is not currently available",left:"Session ended",
 review_finalized_practice:"Review Practice mistakes",
 review_open_tour_archive:"Review an open Tour archive",
 continue_enrolled_subject:"Continue studying",selection_required:"Choose a subject",
 tab:["Home","Study","Ratings","Profile"],nav:"Bottom navigation",lang:"Language"}
};
// Exact subject captions copied from current i18n.js, verified by offline QA.
const SUBJECT_NAMES={"ru":{"informatics":"Информатика","economics":"Экономика","biology":"Биология","chemistry":"Химия","mathematics":"Математика","english_a1":"Английский (A1)","english_a2":"Английский (A2)","english_b1":"Английский (B1)","sat":"SAT","ielts":"IELTS"},"uz":{"informatics":"Informatika","economics":"Iqtisodiyot","biology":"Biologiya","chemistry":"Kimyo","mathematics":"Matematika","english_a1":"Ingliz tili (A1)","english_a2":"Ingliz tili (A2)","english_b1":"Ingliz tili (B1)","sat":"SAT","ielts":"IELTS"},"en":{"informatics":"Informatics","economics":"Economics","biology":"Biology","chemistry":"Chemistry","mathematics":"Mathematics","english_a1":"English (A1)","english_a2":"English (A2)","english_b1":"English (B1)","sat":"SAT","ielts":"IELTS"}};
const h="33333333-3333-4333-8333-333333333333";
const syntheticToken="synthetic-owner-no-real-jwt-AAAAAAAA";
let locale="ru",page="home",epoch=0,active=true,state="idle",action=null;
let expiresAtMs=0,expiryTimer=null,choices=[],handoffToken=null,singleSubject=null;
let confirmedToken=null,confirmedAction=null,confirmedSubject=null;
let routeToken=null,routeSubject=null,routeTarget=null,routeCount=0;
function clearExpiry(){if(expiryTimer!==null)clearTimeout(expiryTimer);
 expiryTimer=null;expiresAtMs=0;choices=[];handoffToken=null;singleSubject=null;}
function expireIfStale(){if(active&&state==="ready"&&expiresAtMs>0&&Date.now()>=expiresAtMs){
 clearExpiry();state="expired";action=null;render();
}}
function resetSuggestion(){clearExpiry();state="idle";action=null;}
const by=id=>document.getElementById(id);
const buttons=[...document.querySelectorAll("#tabs button")];
function render(){
 const c=LANG[locale];document.documentElement.lang=locale;
 by("caption").textContent=c.caption;by("heading").textContent=c.heading;
 by("explain").textContent=c.explain;by("check").textContent=c.check;
 by("leave").textContent=c.leave;by("confirm").textContent=c.confirm;
 by("open-study").textContent=c.openStudy;
 by("study-back").textContent=c.studyBack;
 by("study-disclaimer").textContent=c.studyReadOnly;
 by("home-card").hidden=page==="study";
 by("study-panel").hidden=page!=="study";
 if(page==="study"){
  by("study-heading").textContent=routeTarget==="practice-review"?
   c.review_finalized_practice:routeTarget==="tour-review"?
   c.review_open_tour_archive:c.continue_enrolled_subject;
  by("study-subject").textContent=SUBJECT_NAMES[locale][routeSubject]||"";
  by("study-result").textContent=routeTarget==="practice-review"?
   c.studyPracticeSummary+routeCount:routeTarget==="tour-review"?
   c.studyTourSummary:c.studySubjectSummary;
 }
 by("locale-label").textContent=c.lang;
 by("tabs").setAttribute("aria-label",c.nav);
 buttons.forEach((b,i)=>{
  const shown=page==="study"?"courses":page;
  b.textContent=c.tab[i];b.toggleAttribute("aria-current",b.dataset.page===shown);
  if(b.dataset.page===(page==="study"?"courses":page))b.setAttribute("aria-current","page");
  else b.removeAttribute("aria-current");
 });
 by("open-study").hidden=!(active&&page==="home"&&state==="confirmed"&&confirmedToken);
 by("locale").disabled=page==="study";
 by("confirm").hidden=!(active&&page==="home"&&state==="ready"&&
 action!=="selection_required");
 const output=by("result");
 output.dataset.state=state;
 output.textContent=!active?c.left:page!=="home"?c.idle:
  state==="ready"?c[action]||c.selection_required:
  c[state]||c.idle;
 const list=by("choices");list.replaceChildren();
 list.setAttribute("aria-label",c.selection_required);
 if(active&&page==="home"&&state==="ready"&&action==="selection_required"){
  for(const option of choices){
   const item=document.createElement("button");item.className="choice-item";
   item.setAttribute("type","button");
   item.textContent=SUBJECT_NAMES[locale][option.subjectKey];
   item.addEventListener("click",()=>submitChoice(option.actionCode,option.subjectKey));
   const wrapper=document.createElement("div");wrapper.setAttribute("role","listitem");
   wrapper.append(item);list.append(wrapper);
  }
 }
 by("check").disabled=!active||page!=="home"||state==="pending"||state==="confirming"||state==="opening";
}
async function submitChoice(actionCode,subjectKey){
 if(!active||page!=="home"||state!=="ready"||!handoffToken||
  !["review_finalized_practice","review_open_tour_archive",
    "continue_enrolled_subject"].includes(actionCode)||!SUBJECT_NAMES[locale][subjectKey])
  return;
 const at=++epoch,token=handoffToken;
 confirmedToken=null;confirmedAction=null;confirmedSubject=null;
 clearExpiry();state="confirming";action=null;render();
 try{
  const res=await fetch("/qa/home/confirm",{method:"POST",
   credentials:"omit",cache:"no-store",
   headers:{"Content-Type":"application/json",
    "Authorization":"Bearer "+syntheticToken},
   body:JSON.stringify({contextHandle:h,locale,handoffToken:token,actionCode,subjectKey})});
  const data=await res.json();
  if(at!==epoch||!active||page!=="home")return;
  state=res.ok&&data.ok===true&&data.status==="qa_handoff_confirmed"&&
   data.reviewOnly===true&&data.releaseAllowed===false&&
   data.navigationExecuted===false&&data.progressChanged===false?
   "confirmed":"denied";
  if(state==="confirmed"){
   confirmedToken=token;confirmedAction=actionCode;confirmedSubject=subjectKey;
  }
 }catch{if(at===epoch)state="denied";}
 if(at===epoch)render();
}

// Only synthetic localhost navigation is possible. The Home token is
// consumed at /confirm; opening creates a NEW independent server scope.
async function qaPost(path,body){
 const res=await fetch(path,{method:"POST",credentials:"omit",cache:"no-store",
  headers:{"Content-Type":"application/json",
   "Authorization":"Bearer "+syntheticToken},
  body:JSON.stringify(body)});
 return {res,data:await res.json()};
}
by("open-study").addEventListener("click",async()=>{
 if(!active||page!=="home"||state!=="confirmed"||!confirmedToken)return;
 const at=++epoch,token=confirmedToken,code=confirmedAction,subject=confirmedSubject;
 confirmedToken=null;state="opening";render();
 try{
  const open=await qaPost("/qa/study/open",{contextHandle:h,locale,
   handoffToken:token,actionCode:code,subjectKey:subject});
  if(at!==epoch||!active)return;
  if(!open.res.ok||open.data.status!=="qa_study_scope_open"||
   !/^[A-Za-z0-9_-]{32}$/.test(open.data.routeToken||"")||
   open.data.reviewOnly!==true||open.data.releaseAllowed!==false||
   open.data.progressChanged!==false)throw Error("Route refused");
  routeToken=open.data.routeToken;
  const read=await qaPost("/qa/study/read",{locale,routeToken});
  if(at!==epoch||!active)return;
  if(!read.res.ok||read.data.status!=="qa_study_read"||
   read.data.reviewOnly!==true||read.data.releaseAllowed!==false||
   read.data.progressChanged!==false||
   read.data.subjectKey!==subject||
   read.data.targetScreen!==open.data.targetScreen||
   !["practice-review","tour-review","subject-hub"].includes(read.data.targetScreen)||
   !Number.isSafeInteger(read.data.reviewCount))throw Error("Study read refused");
  routeSubject=read.data.subjectKey;routeTarget=read.data.targetScreen;
  routeCount=read.data.reviewCount;
  page="study";state="study";
 }catch{
  if(at===epoch){
   if(routeToken)void qaPost("/qa/study/close",{routeToken,locale}).catch(()=>{});
   routeToken=null;state="denied";
  }
 }
 if(at===epoch)render();
});
by("study-back").addEventListener("click",async()=>{
 if(page!=="study"||!routeToken)return;
 const at=++epoch,token=routeToken,oldLocale=locale;
 state="closing";render();
 try{
  const closed=await qaPost("/qa/study/close",{locale:oldLocale,routeToken:token});
  if(at!==epoch)return;
  if(!closed.res.ok||closed.data.status!=="qa_study_closed"||
   closed.data.progressChanged!==false)throw Error("Close refused");
  routeToken=null;routeSubject=null;routeTarget=null;routeCount=0;
  confirmedToken=null;page="home";resetSuggestion();state="idle";
 }catch{if(at===epoch)state="denied";}
 if(at===epoch)render();
});

by("confirm").addEventListener("click",()=>submitChoice(action,singleSubject));
by("locale").addEventListener("change",e=>{
 locale=e.target.value;epoch++;resetSuggestion();render();
});
buttons.forEach(b=>b.addEventListener("click",()=>{
 if(page==="study"){by("study-back").click();return;}
 page=b.dataset.page;epoch++;confirmedToken=null;resetSuggestion();render();
}));
by("leave").addEventListener("click",()=>{
 const was=routeToken;
 if(was)void qaPost("/qa/study/close",{locale,routeToken:was}).catch(()=>{});
 routeToken=null;confirmedToken=null;
 epoch++;clearExpiry();active=false;state="left";action=null;render();
});
by("check").addEventListener("click",async()=>{
 if(!active||page!=="home"||state==="pending")return;
 const at=++epoch;clearExpiry();state="pending";render();
 try{
  const res=await fetch("/qa/home/next",{method:"POST",
   credentials:"omit",cache:"no-store",
   headers:{"Content-Type":"application/json",
    "Authorization":"Bearer "+syntheticToken},
   body:JSON.stringify({contextHandle:h,locale})});
  const data=await res.json();
  if(at!==epoch||!active||page!=="home")return;
  if(res.ok&&data.ok===true&&data.reviewOnly===true&&
   data.releaseAllowed===false&&
   (data.status==="candidate_only"||data.status==="selection_required")){
   const deadline=data.expiresAtMs;
   if(!Number.isSafeInteger(deadline)||deadline<=Date.now()||
      deadline-Date.now()>30000){state="denied";action=null;}
   else{
    const tie=data.status==="selection_required";
    const possible=tie&&Array.isArray(data.choices)&&
     data.choices.length>=2&&data.choices.length<=3&&
     data.choices.every(v=>v&&Object.keys(v).sort().join(",")==="actionCode,subjectKey"&&
      ["review_finalized_practice","review_open_tour_archive",
       "continue_enrolled_subject"].includes(v.actionCode)&&
      !!SUBJECT_NAMES[locale][v.subjectKey])&&
     new Set(data.choices.map(v=>v.subjectKey)).size===data.choices.length;
    if(tie&&!possible){state="denied";action=null;}
    else{
     if(!/^[A-Za-z0-9_-]{32}$/.test(data.handoffToken||"")||
        (!tie&&!SUBJECT_NAMES[locale][data.subjectKey])){
      state="denied";action=null;
     }else{
      choices=tie?data.choices.map(v=>({actionCode:v.actionCode,subjectKey:v.subjectKey})):[];
      handoffToken=data.handoffToken;
      singleSubject=tie?null:data.subjectKey;
      state="ready";action=tie?"selection_required":data.actionCode;
     }
    }
    if(state==="ready"){
    expiresAtMs=deadline;
    expiryTimer=setTimeout(()=>{
     if(at===epoch)expireIfStale();
    },Math.max(1,deadline-Date.now()+1));
    }
   }
  }else{state="denied";action=null;}
 }catch{
  if(at===epoch){state="denied";action=null;}
 }
 if(at===epoch)render();
});
document.addEventListener("visibilitychange",expireIfStale);
render();
window.__qaHomeState=()=>({state,action,active,page,locale,expiresAtMs,
 studyTarget:routeTarget,studySubject:routeSubject,studyCount:routeCount,
 visibleChoices:[...document.querySelectorAll("#choices .choice-item")].map(x=>x.textContent)});
})();
</script></body></html>
