    <marker id="bothStart" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#111827"/></marker>
  </defs>
  <g stroke="#111827" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
