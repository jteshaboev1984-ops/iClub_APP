<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><rect width="1200" height="800" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs><text x="600" y="70" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="36" font-weight="700" fill="#111827">Bitmap pixel-data calculation</text><rect x="90" y="135" width="280" height="150" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="230.0" y="220.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="500" fill="#111827">20 × 10 pixels</text><rect x="460" y="135" width="280" height="150" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/><text x="600.0" y="220.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="500" fill="#111827">16 colours</text><rect x="830" y="135" width="280" height="150" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="970.0" y="220.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="500" fill="#111827">4 bits/pixel</text><line x1="370" y1="210" x2="455" y2="210" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><line x1="740" y1="210" x2="825" y2="210" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><rect x="250" y="370" width="700" height="115" rx="22" fill="#f8fafc" stroke="#334155" stroke-width="4"/><text x="600.0" y="437.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="500" fill="#111827">20 × 10 × 4 = 800 bits = 100 bytes</text><line x1="600" y1="485" x2="600" y2="555" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><rect x="315" y="565" width="570" height="120" rx="22" fill="#fefce8" stroke="#ca8a04" stroke-width="4"/><text x="600.0" y="635.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="500" fill="#111827">Lossless output = 35% of original</text><text x="600" y="750" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#991b1b">Compressed size = ?</text></svg>